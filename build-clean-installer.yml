name: Build CLEAN DPopCleaner installer

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  clean-installer:
    runs-on: windows-2022
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify original core EXE
        shell: pwsh
        run: |
          $p = "app/DPopCleaner.exe"
          if (-not (Test-Path $p)) {
            throw "Missing app/DPopCleaner.exe. Upload the ORIGINAL standalone DPopCleaner 0.2.14 EXE to this path."
          }
          $h=(Get-FileHash -Algorithm SHA256 $p).Hash.ToLowerInvariant()
          Write-Host "Core EXE SHA-256: $h"
          if ($h -ne "7d5e0a510189db31ef7ee1aca72dc182332a8020d994c81be40a519c5960515c") {
            throw "Wrong DPopCleaner.exe. Expected the original 0.2.14 standalone EXE."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build clean installer
        shell: pwsh
        run: |
          $iscc="${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          Push-Location release
          New-Item -ItemType Directory -Force output | Out-Null
          & $iscc "/DSourceExe=$((Resolve-Path '..\app\DPopCleaner.exe').Path)" "DPopCleaner_CLEAN.iss"
          $ec=$LASTEXITCODE
          Pop-Location
          if ($ec -ne 0) { exit $ec }

      - name: Show installer contents policy
        shell: pwsh
        run: |
          Write-Host "This installer contains only DPopCleaner.exe."
          Write-Host "It does NOT bundle WinDivert.sys, WinDivert.dll, winws.exe or zapret files."

      - name: Hash installer
        id: meta
        shell: pwsh
        run: |
          $p="release/output/DPopCleaner_Setup_0.2.14_BETA_CLEAN.exe"
          $h=(Get-FileHash -Algorithm SHA256 $p).Hash.ToLowerInvariant()
          $s=(Get-Item $p).Length
          "sha256=$h" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "size=$s" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Installer SHA-256: $h"
          Write-Host "Installer size: $s"

      - name: Publish clean installer release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag="v0.2.14-clean"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "DPopCleaner 0.2.14 BETA - Clean installer" `
              --notes "Installer containing only the original DPopCleaner executable. WinDivert/Zapret binaries are not bundled." `
              --prerelease
          }
          gh release upload $tag "release/output/DPopCleaner_Setup_0.2.14_BETA_CLEAN.exe" --clobber

      - name: Write release metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force update | Out-Null
          $obj=[ordered]@{
            product="DPopCleaner"
            channel="beta"
            version="0.2.14"
            version_code=214
            available=$true
            signed=$false
            download_url="https://github.com/${{ github.repository }}/releases/download/v0.2.14-clean/DPopCleaner_Setup_0.2.14_BETA_CLEAN.exe"
            sha256="${{ steps.meta.outputs.sha256 }}"
            size=[int64]"${{ steps.meta.outputs.size }}"
          }
          $obj | ConvertTo-Json | Set-Content -Encoding utf8 update/beta.json


      - name: Point website to clean installer
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/v0.2.14-clean/DPopCleaner_Setup_0.2.14_BETA_CLEAN.exe"

          if (Test-Path "index.html") {
            $x = Get-Content "index.html" -Raw
            $x = $x.Replace("./downloads/DPopCleaner_Setup_0.2.14_BETA.exe", $url)
            $x = $x.Replace("DPopCleaner_Setup_0.2.14_BETA.exe", "DPopCleaner_Setup_0.2.14_BETA_CLEAN.exe")
            Set-Content -Encoding utf8 "index.html" $x
          }

          if (Test-Path "script.js") {
            $x = Get-Content "script.js" -Raw
            $x = $x.Replace("./downloads/DPopCleaner_Setup_0.2.14_BETA.exe", $url)
            $x = $x.Replace("DPopCleaner_Setup_0.2.14_BETA.exe", "DPopCleaner_Setup_0.2.14_BETA_CLEAN.exe")
            Set-Content -Encoding utf8 "script.js" $x
          }

      - name: Stage website
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "_site/update" | Out-Null
          $files = @("index.html","styles.css","script.js","dpopcleaner-icon.png","version.json",".nojekyll")
          foreach ($f in $files) {
            if (Test-Path $f) { Copy-Item $f "_site/" -Force }
          }
          Copy-Item "update/beta.json" "_site/update/beta.json" -Force
          if (Test-Path "update/stable.json") {
            Copy-Item "update/stable.json" "_site/update/stable.json" -Force
          }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPopCleaner-clean-installer
          path: |
            release/output/DPopCleaner_Setup_0.2.14_BETA_CLEAN.exe
            update/beta.json
