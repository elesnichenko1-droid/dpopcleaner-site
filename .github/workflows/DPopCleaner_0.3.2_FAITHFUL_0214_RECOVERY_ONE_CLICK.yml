name: DPopCleaner 0.3.2 FAITHFUL 0.2.14 RECOVERY

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpopcleaner-0-3-2-faithful-recovery
  cancel-in-progress: false

jobs:
  master:
    runs-on: windows-2022

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify clean baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = git status --porcelain
          if ($dirty) {
            Write-Host $dirty
            throw 'Checkout is unexpectedly dirty.'
          }

          foreach ($path in @(
            'v032/CMakeLists.txt',
            'v032/ui/Shell.cpp',
            'v032/ui/pages/OverviewPage.cpp',
            'scripts/Prepare-032Source.ps1'
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required 0.3.2 baseline file missing: $path"
            }
          }

      - name: Apply complete faithful recovery payload
