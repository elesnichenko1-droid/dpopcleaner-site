name: Fix R4 compile and rebuild

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dpopcleaner-r4-compile-fix
  cancel-in-progress: false

jobs:
  fix-and-rebuild:
    runs-on: windows-2022
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Extract and fix R4 MainWindow source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workflowPath = '.github/workflows/build-dpopcleaner-0.3.1-r4.yml'
          $workflow = Get-Content -Raw -LiteralPath $workflowPath
          $match = [regex]::Match(
            $workflow,
            "else \{ Write-Base64File '([A-Za-z0-9+/=]+)' r4-overrides/MainWindow\.cpp \}"
          )
          if (-not $match.Success) {
            throw 'Embedded R4 MainWindow.cpp was not found in the release workflow.'
          }

          $source = [Text.Encoding]::UTF8.GetString(
            [Convert]::FromBase64String($match.Groups[1].Value)
          )

          $replacements = [ordered]@{
            'std::max(1L, rc.bottom - rc.top)' =
              'std::max(1, static_cast<int>(rc.bottom - rc.top))'
            'std::max(1L, rc.right - rc.left)' =
              'std::max(1, static_cast<int>(rc.right - rc.left))'
            'std::max(140, (rc.right - rc.left) / 7)' =
              'std::max(140, static_cast<int>((rc.right - rc.left) / 7))'
            'std::max(220, (rc.right - rc.left) / 5)' =
              'std::max(220, static_cast<int>((rc.right - rc.left) / 5))'
            'std::max(700L, rc.right - rc.left)' =
              'std::max(700, static_cast<int>(rc.right - rc.left))'
            'std::max(760L, rc.right - rc.left)' =
              'std::max(760, static_cast<int>(rc.right - rc.left))'
          }

          foreach ($old in $replacements.Keys) {
            if (-not $source.Contains($old)) {
              throw "Expected source fragment was not found: $old"
            }
            $source = $source.Replace($old, $replacements[$old])
          }

          foreach ($bad in $replacements.Keys) {
            if ($source.Contains($bad)) {
              throw "Mixed WinAPI LONG/int expression remains: $bad"
            }
          }

          foreach ($required in @(
            '0.3.1 BETA R4',
            'PaintSunsetBackground',
            'LayoutControls(hwnd)',
            'ListView_SetImageList',
            'dpop::cleaner::CleanUserTemp()',
            'dpop::guard::QuickScan()',
            'dpop::apps::EnumerateInstalledApps()',
            'dpop::zapret::QueryStatus()',
            'dpop::update::CheckForUpdates()'
          )) {
            if (-not $source.Contains($required)) {
              throw "R4 functional/UI marker missing after patch: $required"
            }
          }

          New-Item -ItemType Directory -Path r4 -Force | Out-Null
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'r4/MainWindow.cpp'),
            $source,
            [Text.UTF8Encoding]::new($false)
          )
          Write-Host 'PASS: fixed R4 MainWindow.cpp generated.'

      - name: Commit fixed R4 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r4/MainWindow.cpp
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Fixed R4 source is already committed.'
          } else {
            git commit -m 'Fix R4 WinAPI integer type compilation'
            git pull --rebase origin main
            git push origin HEAD:main
          }

      - name: Start corrected R4 release build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh workflow run build-dpopcleaner-0.3.1-r4.yml --ref main
          Write-Host 'Corrected R4 workflow dispatched on main.'
