name: Rev13 branch metadata sync

on:
  push:
    branches:
      - fix/0.4.17-rev13-uac-tray-ram

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/0.4.17-rev13-uac-tray-ram
          fetch-depth: 0
      - name: Synchronize revision 13 release files
        run: python tools/rev13_release_sync.py
      - name: Remove temporary sync helpers and push
        shell: bash
        run: |
          rm -f tools/rev13_release_sync.py .github/workflows/rev13-branch-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "chore: finalize rev13 release metadata"
          git push origin HEAD:fix/0.4.17-rev13-uac-tray-ram
