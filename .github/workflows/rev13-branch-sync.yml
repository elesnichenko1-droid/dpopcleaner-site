name: Rev13 branch metadata sync

on:
  push:
    branches:
      - fix/0.4.17-rev13-uac-tray-ram

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/0.4.17-rev13-uac-tray-ram
          fetch-depth: 0
      - name: Synchronize revision 13 release files
        run: python tools/rev13_release_sync.py
      - name: Preserve generated publisher and push non-workflow files
        shell: bash
        run: |
          cp .github/workflows/publish-dpopcleaner-0.4.17.yml "$RUNNER_TEMP/publish-dpopcleaner-0.4.17-rev13.yml"
          git restore --source=HEAD -- .github/workflows/publish-dpopcleaner-0.4.17.yml .github/workflows/rev13-branch-sync.yml
          rm -f tools/rev13_release_sync.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "chore: finalize rev13 release metadata"
          git push origin HEAD:fix/0.4.17-rev13-uac-tray-ram
      - name: Upload generated rev13 publisher
        uses: actions/upload-artifact@v4
        with:
          name: rev13-publisher-generated
          path: ${{ runner.temp }}/publish-dpopcleaner-0.4.17-rev13.yml
          if-no-files-found: error
