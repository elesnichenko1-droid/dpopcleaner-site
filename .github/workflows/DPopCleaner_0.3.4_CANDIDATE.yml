name: DPopCleaner 0.3.4 Candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dpopcleaner-0-3-4-candidate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run 0.3.4 migration and UI contract tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/test_dpop034_migrate.py -v
          if ($LASTEXITCODE -ne 0) { throw '0.3.4 migration tests failed.' }
          python tests/test_dpop034_layout_contract.py -v
          if ($LASTEXITCODE -ne 0) { throw '0.3.4 layout tests failed.' }
          python tests/test_dpop034_build_contract.py -v
          if ($LASTEXITCODE -ne 0) { throw '0.3.4 build contract tests failed.' }
          python tests/test_dpop034_zapret_ui_contract.py -v
          if ($LASTEXITCODE -ne 0) { throw '0.3.4 Zapret UI contract failed.' }
          python tests/test_dpop034_shell_parity.py -v
          if ($LASTEXITCODE -ne 0) { throw '0.3.4 shell parity contract failed.' }
          python tests/test_dpop034_page_content_layout.py -v
          if ($LASTEXITCODE -ne 0) { throw '0.3.4 shared page content layout contract failed.' }

      - name: Build and CTest DPopCleaner 0.3.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'dpop034-output'
          $workspace = Join-Path $env:RUNNER_TEMP 'dpop034-workspace'
          python tools/dpop034_migrate.py --repository $PWD --output $output --workspace $workspace --build
          if ($LASTEXITCODE -ne 0) { throw 'DPopCleaner 0.3.4 migration/build failed.' }
          "DPOP034_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Capture 0.3.4 UI evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:DPOP034_OUTPUT 'artifacts/DPopCleaner.exe'
          $evidence = Join-Path $env:DPOP034_OUTPUT 'evidence'
          ./tools/dpop033_ui_smoke.ps1 -ExePath $exe -OutputDir $evidence
          ./tools/dpop034_zapret_ui_smoke.ps1 -ExePath $exe -OutputDir $evidence
          ./tools/dpop034_shell_ui_smoke.ps1 -ExePath $exe -OutputDir $evidence

      - name: Upload 0.3.4 candidate
        uses: actions/upload-artifact@v4
        with:
          name: dpopcleaner-0.3.4-candidate
          path: ${{ runner.temp }}/dpop034-output/*
          if-no-files-found: error
