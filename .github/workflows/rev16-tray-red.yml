name: Rev16 tray historical RED

on:
  push:
    branches:
      - feat/0.4.17-rev16-single-tray-zapret
    paths:
      - 'tools/dpop0417_rev16_single_tray_smoke.ps1'
      - '.github/workflows/rev16-tray-red.yml'

permissions:
  contents: read

jobs:
  rev15-red:
    runs-on: windows-2022
    steps:
      - name: Checkout rev.16 test harness
        uses: actions/checkout@v5
      - name: Download published rev.15 installer
        shell: pwsh
        run: |
          $url = 'https://github.com/elesnichenko1-droid/dpopcleaner-site/releases/download/v0.4.17-rev15/DPopCleaner_Setup_0.4.17.exe'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\DPopCleaner_Setup_0.4.17_rev15.exe"
      - name: Prove rev.15 violates rev.16 single-tray invariant
        shell: pwsh
        run: ./tools/dpop0417_rev16_single_tray_smoke.ps1 -InstallerPath "$env:RUNNER_TEMP\DPopCleaner_Setup_0.4.17_rev15.exe" -OutputDir '_release/0.4.17/evidence/rev16-tray-red'
