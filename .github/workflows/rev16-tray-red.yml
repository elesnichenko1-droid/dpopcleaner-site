name: Rev16 tray historical RED

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/dpop0417_rev16_single_tray_smoke.ps1'
      - '.github/workflows/rev16-tray-red.yml'
      - 'tests/test_dpop0417_rev13_uac_tray_contract.py'

permissions:
  contents: read

jobs:
  rev15-red:
    runs-on: windows-2022
    steps:
      - name: Checkout rev.16 test harness
        uses: actions/checkout@v5
      - name: Download published rev.15 installer
        shell: pwsh
        run: |
          $url = 'https://github.com/elesnichenko1-droid/dpopcleaner-site/releases/download/v0.4.17-rev15/DPopCleaner_Setup_0.4.17.exe'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\DPopCleaner_Setup_0.4.17_rev15.exe"
      - name: Confirm published rev.15 fails rev.16 single-tray invariant
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $redObserved = $false
          try {
            & ./tools/dpop0417_rev16_single_tray_smoke.ps1 -InstallerPath "$env:RUNNER_TEMP\DPopCleaner_Setup_0.4.17_rev15.exe" -OutputDir '_release/0.4.17/evidence/rev16-tray-red'
          } catch {
            $redObserved = $true
            Write-Host "REV16_TRAY_HISTORICAL_RED_DETAIL $($_.Exception.Message)"
          }
          if (-not $redObserved) { throw 'Historical RED was not reproduced: published rev.15 unexpectedly satisfies rev.16 single-tray invariant.' }
          Write-Host 'REV16_TRAY_HISTORICAL_RED_CONFIRMED'
