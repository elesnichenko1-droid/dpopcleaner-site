name: DPopCleaner 0.3.3 Reverse Migration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dpopcleaner-0-3-3-reverse-migration-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify canonical migration layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('tools/dpop033_migrate.py','tools/dpop033_core.py','tools/dpop033_ui_smoke.ps1','tests/test_dpop033_migrate.py','tests/test_dpop033_recovery_controls.py')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Required canonical migration file is missing: $path" }
          }
      - name: Run migration and regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/test_dpop033_migrate.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Migration tests failed.' }
          python tests/test_dpop033_recovery_controls.py -v
          if ($LASTEXITCODE -ne 0) { throw 'RecoveryControls regression test failed.' }
      - name: Build DPopCleaner 0.3.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output=Join-Path $env:RUNNER_TEMP 'dpop033-output'; $workspace=Join-Path $env:RUNNER_TEMP 'dpop033-workspace'
          python tools/dpop033_migrate.py --repository $PWD --output $output --workspace $workspace --build
          if ($LASTEXITCODE -ne 0) { throw 'DPopCleaner 0.3.3 migration/build failed.' }
          "DPOP033_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DPOP033_WORKSPACE=$workspace" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Capture and verify 0.3.3 UX
        shell: pwsh
        run: |
          ./tools/dpop033_ui_smoke.ps1 -ExePath (Join-Path $env:DPOP033_OUTPUT 'artifacts/DPopCleaner.exe') -OutputDir (Join-Path $env:DPOP033_OUTPUT 'evidence')
      - name: Upload verified 0.3.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpopcleaner-0.3.3-reverse-migration
          path: ${{ runner.temp }}/dpop033-output/*
          if-no-files-found: error
