name: DPopCleaner 0.3.3 Reverse Migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/DPopCleaner_0.3.3_REVERSE_MIGRATION.yml'

permissions:
  contents: read

concurrency:
  group: dpopcleaner-0-3-3-reverse-migration
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify canonical migration layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'tools/dpop033_migrate.py',
            'tools/dpop033_ui_smoke.ps1',
            'tests/test_dpop033_migrate.py',
            'docs/superpowers/specs/2026-08-24-dpopcleaner-0.3.3-migration-design.md',
            'docs/superpowers/plans/2026-08-24-dpopcleaner-0.3.3-migration.md'
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required canonical migration file is missing: $path"
            }
          }

          foreach ($path in @(
            'dpop033_migrate.py',
            'dpop033_ui_smoke.ps1',
            'test_dpop033_migrate.py',
            'DPopCleaner_0.3.3_REVERSE_MIGRATION.yml',
            '2026-08-24-dpopcleaner-0.3.3-migration-design.md',
            '2026-08-24-dpopcleaner-0.3.3-migration.md'
          )) {
            if (Test-Path -LiteralPath $path) {
              throw "Accidental root duplicate still exists: $path"
            }
          }

      - name: Run migration unit and isolation tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/test_dpop033_migrate.py -v
          if ($LASTEXITCODE -ne 0) {
            throw 'Migration unit tests failed.'
          }

      - name: Diagnose recovered RecoveryControls source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagOutput = Join-Path $env:RUNNER_TEMP 'dpop033-diagnostic-output'
          $diagWorkspace = Join-Path $env:RUNNER_TEMP 'dpop033-diagnostic-workspace'

          python tools/dpop033_migrate.py `
            --repository $PWD `
            --output $diagOutput `
            --workspace $diagWorkspace

          if ($LASTEXITCODE -ne 0) {
            throw 'Diagnostic migration failed.'
          }

          $source = Join-Path $diagOutput 'source-overlay/v033/ui/RecoveryControls.cpp'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Recovered source missing: $source"
          }

          Write-Host '=== BEGIN RecoveryControls.cpp ==='
          $line = 0
          Get-Content -LiteralPath $source | ForEach-Object {
            $line++
            Write-Host ('{0,4}: {1}' -f $line, $_)
          }
          Write-Host '=== END RecoveryControls.cpp ==='

      - name: Build DPopCleaner 0.3.3 from faithful 0.2.14 UX plus 0.3.2 core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'dpop033-output'
          $workspace = Join-Path $env:RUNNER_TEMP 'dpop033-workspace'

          python tools/dpop033_migrate.py `
            --repository $PWD `
            --output $output `
            --workspace $workspace `
            --build

          if ($LASTEXITCODE -ne 0) {
            throw 'DPopCleaner 0.3.3 migration/build failed.'
          }

          "DPOP033_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DPOP033_WORKSPACE=$workspace" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Capture and verify recovered 0.2.14-style UX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:DPOP033_OUTPUT 'artifacts/DPopCleaner.exe'
          $evidence = Join-Path $env:DPOP033_OUTPUT 'evidence'
          ./tools/dpop033_ui_smoke.ps1 `
            -ExePath $exe `
            -OutputDir $evidence

      - name: Collect test evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:DPOP033_OUTPUT 'evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          $lastTest = Join-Path $env:DPOP033_WORKSPACE 'build/Testing/Temporary/LastTest.log'
          if (Test-Path -LiteralPath $lastTest -PathType Leaf) {
            Copy-Item -LiteralPath $lastTest -Destination (Join-Path $evidence 'CTest-LastTest.log') -Force
          }

          Get-FileHash -Algorithm SHA256 `
            (Join-Path $env:DPOP033_OUTPUT 'artifacts/DPopCleaner.exe'), `
            (Join-Path $env:DPOP033_OUTPUT 'artifacts/DPopUpdater.exe') |
            Format-Table -AutoSize |
            Out-String |
            Set-Content -LiteralPath (Join-Path $evidence 'SHA256.txt') -Encoding utf8

      - name: Upload verified 0.3.3 migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpopcleaner-0.3.3-reverse-migration
          path: ${{ runner.temp }}/dpop033-output/*
          if-no-files-found: error
