name: Apply DPopCleaner 0.3.2 Task 5 session log footer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task5:
    runs-on: windows-2022

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Task 4 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'v032/ui/ShellModel.cpp',
            'v032/ui/Layout.cpp',
            'v032/ui/Theme.cpp',
            'v032/ui/Controls.cpp',
            'v032/tests/ThemeTests.cpp',
            'v032/tests/ControlsTests.cpp'
          )) {
            if (-not (Test-Path $path)) { throw "Missing Task 2-4 baseline: $path" }
          }
          if (Test-Path v032/ui/SessionLog.cpp) { throw 'Task 5 precondition failed: SessionLog.cpp already exists.' }
          if (Test-Path v032/ui/StatusBar.cpp) { throw 'Task 5 precondition failed: StatusBar.cpp already exists.' }

      - name: RED - add tests and prove Task 5 implementation is missing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Write-B64([string]$Path,[string]$Data) {
            $dir = Split-Path -Parent $Path
            if ($dir) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
            [IO.File]::WriteAllBytes($Path,[Convert]::FromBase64String($Data))
          }

          Write-B64 'v032/tests/SessionLogTests.cpp' ''
          Write-B64 'v032/tests/StatusBarCompileTests.cpp' ''
          Write-B64 'v032/CMakeLists.txt' ''

          Remove-Item task5-red-src,task5-red-build -Recurse -Force -ErrorAction SilentlyContinue
          ./scripts/Prepare-032Source.ps1 -RepositoryRoot $PWD -Destination "$PWD/task5-red-src"

          $redOutput = @()
          & cmake -S task5-red-src -B task5-red-build -A x64 -DBUILD_TESTING=ON 2>&1 |
            Tee-Object -Variable redOutput
          $redCode = $LASTEXITCODE

          if ($redCode -eq 0) {
            throw 'RED unexpectedly configured before SessionLog/StatusBar implementation.'
          }

          $joined = ($redOutput | Out-String)
          if ($joined -notmatch 'SessionLog\.cpp|StatusBar\.cpp') {
            throw "RED failed for an unrelated reason. Output:`n$joined"
          }

          Write-Host 'RED PASS: SessionLog/StatusBar source files are correctly missing.'
          exit 0

      - name: GREEN - implement session log and footer status bar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Write-B64([string]$Path,[string]$Data) {
            $dir = Split-Path -Parent $Path
            if ($dir) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
            [IO.File]::WriteAllBytes($Path,[Convert]::FromBase64String($Data))
          }

          Write-B64 'v032/ui/SessionLog.h' ''
          Write-B64 'v032/ui/SessionLog.cpp' ''
          Write-B64 'v032/ui/StatusBar.h' ''
          Write-B64 'v032/ui/StatusBar.cpp' ''

      - name: Verify Task 5 source policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sessionHeader = Get-Content -Raw v032/ui/SessionLog.h
          $sessionImpl = Get-Content -Raw v032/ui/SessionLog.cpp
          $statusHeader = Get-Content -Raw v032/ui/StatusBar.h
          $statusImpl = Get-Content -Raw v032/ui/StatusBar.cpp
          $tests = Get-Content -Raw v032/tests/SessionLogTests.cpp
          $cmakeText = Get-Content -Raw v032/CMakeLists.txt

          foreach ($token in @(
            'enum class EventLevel',
            'SessionEvent',
            'std::span<const SessionEvent> Events()',
            'RenderText() const'
          )) {
            if (-not $sessionHeader.Contains($token)) { throw "SessionLog header missing: $token" }
          }

          foreach ($token in @(
            'HH:MM:SS',
            'WARNING',
            'ERROR',
            'NormalizeLine'
          )) {
            if ($token -eq 'HH:MM:SS') {
              if (-not $sessionImpl.Contains('%H:%M:%S')) { throw 'SessionLog timestamp format missing.' }
            } elseif (-not $sessionImpl.Contains($token)) {
              throw "SessionLog implementation missing: $token"
            }
          }

          foreach ($token in @(
            'kSupportCommandId = 1200',
            'L"Поддержка"',
            'L"v0.3.2 BETA"',
            'CreateReadOnlyLogEdit',
            'layout.status',
            'layout.log',
            'layout.support',
            'layout.version'
          )) {
            $haystack = $statusHeader + "`n" + $statusImpl
            if (-not $haystack.Contains($token)) { throw "StatusBar behavior missing: $token" }
          }

          if (-not $tests.Contains('SessionLogTests PASS')) { throw 'SessionLogTests explicit PASS missing.' }
          if (-not $cmakeText.Contains('StatusBarCompileTests')) { throw 'StatusBar compile/link test target missing.' }

          Write-Host 'Task 5 source policy PASS'

      - name: GREEN - build and run Task 5 tests plus regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item task5-src,task5-build -Recurse -Force -ErrorAction SilentlyContinue
          ./scripts/Prepare-032Source.ps1 -RepositoryRoot $PWD -Destination "$PWD/task5-src"

          cmake -S task5-src -B task5-build -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }

          cmake --build task5-build --config Release --target `
            SessionLogTests `
            StatusBarCompileTests `
            ThemeTests `
            ControlsTests `
            LayoutTests `
            ShellModelTests
          if ($LASTEXITCODE -ne 0) { throw 'Task 2-5 test build failed.' }

          ctest --test-dir task5-build -C Release `
            -R '^(SessionLogTests|StatusBarCompileTests|ThemeTests|ControlsTests|LayoutTests|ShellModelTests)$' `
            --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Task 2-5 regression tests failed.' }

      - name: Confirm R4 and site are untouched
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $protectedDiff = git diff -- r4 index.html script.js update downloads release-manifest.js
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect protected paths.' }
          if ($protectedDiff) {
            Write-Host $protectedDiff
            throw 'Task 5 changed protected R4/site files.'
          }

          Write-Host 'R4 and site remain untouched.'

      - name: Commit Task 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item task5-red-src,task5-red-build,task5-src,task5-build -Recurse -Force -ErrorAction SilentlyContinue

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add `
            v032/CMakeLists.txt `
            v032/ui/SessionLog.h `
            v032/ui/SessionLog.cpp `
            v032/ui/StatusBar.h `
            v032/ui/StatusBar.cpp `
            v032/tests/SessionLogTests.cpp `
            v032/tests/StatusBarCompileTests.cpp

          if (git diff --cached --quiet) {
            Write-Host 'Task 5 already matches.'
            exit 0
          }

          git commit -m 'feat: add DPopCleaner session log footer'
          git push origin HEAD:main
