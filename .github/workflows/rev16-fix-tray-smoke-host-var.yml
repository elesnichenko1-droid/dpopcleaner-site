name: Rev16 fix tray smoke host variable

on:
  push:
    branches:
      - feat/0.4.17-rev16-single-tray-zapret
    paths:
      - '.github/workflows/rev16-fix-tray-smoke-host-var.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/0.4.17-rev16-single-tray-zapret
      - name: Rename reserved Host variable
        shell: pwsh
        run: |
          $path = 'tools/dpop0417_rev16_single_tray_smoke.ps1'
          $text = Get-Content -Raw -LiteralPath $path
          $count = ([regex]::Matches($text, '\$host\b', [Text.RegularExpressions.RegexOptions]::IgnoreCase)).Count
          if ($count -ne 3) { throw "Expected exactly 3 reserved host variable references, found $count" }
          $text = [regex]::Replace($text, '\$host\b', '$settingsHost', [Text.RegularExpressions.RegexOptions]::IgnoreCase)
          [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))
      - name: Commit harness fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/dpop0417_rev16_single_tray_smoke.ps1
          git commit -m 'test(rev16): avoid reserved Host variable in tray smoke'
          git push origin HEAD:feat/0.4.17-rev16-single-tray-zapret
