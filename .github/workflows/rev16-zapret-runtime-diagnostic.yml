name: Rev16 Zapret runtime diagnostic

on:
  push:
    branches:
      - feat/0.4.17-rev16-single-tray-zapret
    paths:
      - '.github/workflows/rev16-zapret-runtime-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Prepare pinned Flowseal Zapret 1.10.2
        shell: pwsh
        run: ./tools/dpop0417_prepare_zapret.ps1

      - name: Verify initialized noninteractive upstream install
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path '_release/0.4.17/third-party/Zapret').Path
          $diag=Join-Path $env:RUNNER_TEMP 'rev16-zapret-runtime-diagnostic'
          New-Item -ItemType Directory -Force -Path $diag|Out-Null
          $service=Join-Path $root 'service.bat'
          $source=(Get-Content -Raw -LiteralPath $service)-replace "`r`n","`n"
          $rootPrompt='set /p menu_choice=   Select option (0-12): '
          $strategyPrompt='set /p "choice=Input option (0-!count!, default: 0): "'
          if(([regex]::Matches($source,[regex]::Escape($rootPrompt))).Count-ne 1){throw 'root prompt mismatch'}
          if(([regex]::Matches($source,[regex]::Escape($strategyPrompt))).Count-ne 1){throw 'strategy prompt mismatch'}

          Get-Process winws -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          foreach($name in @('zapret','WinDivert','WinDivert14')){cmd.exe /d /c "sc.exe stop $name >nul 2>&1 & sc.exe delete $name >nul 2>&1"|Out-Null}
          Start-Sleep -Milliseconds 600

          $rootReplacement=@'
          if defined DPOP_INSTALL_ONCE exit /b
          set "DPOP_INSTALL_ONCE=1"
          set "menu_choice=1"
          '@ -replace "`r`n","`n"
          $modified=$source.Replace($rootPrompt,$rootReplacement).Replace($strategyPrompt,'set "choice=22"')
          $variant=Join-Path $root 'service-dpop-initialized-install.bat'
          [IO.File]::WriteAllText($variant,($modified-replace "`n","`r`n"),[Text.UTF8Encoding]::new($false))

          $out=Join-Path $diag 'stdout.txt';$err=Join-Path $diag 'stderr.txt'
          $p=Start-Process -FilePath 'cmd.exe' -ArgumentList ('/d /c ""'+$variant+'" admin"') -WorkingDirectory $root -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          $samples=[Collections.Generic.List[object]]::new();$start=[DateTime]::UtcNow
          while((([DateTime]::UtcNow-$start).TotalSeconds)-lt 15){
            $elapsed=[int]([DateTime]::UtcNow-$start).TotalMilliseconds
            $svc=Get-CimInstance Win32_Service -Filter "Name='zapret'" -ErrorAction SilentlyContinue
            $winws=@(Get-CimInstance Win32_Process -Filter "Name='winws.exe'" -ErrorAction SilentlyContinue)
            $driver=Get-CimInstance Win32_SystemDriver -Filter "Name='WinDivert'" -ErrorAction SilentlyContinue
            $selected='';$image=''
            try{$props=Get-ItemProperty -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\zapret' -ErrorAction Stop;$selected=[string]$props.'zapret-discord-youtube';$image=[string]$props.ImagePath}catch{}
            $samples.Add([pscustomobject]@{ElapsedMs=$elapsed;Exists=[bool]$svc;State=if($svc){[string]$svc.State}else{'Missing'};ExitCode=if($svc){[int]$svc.ExitCode}else{-1};Winws=$winws.Count;Driver=if($driver){[string]$driver.State}else{'Missing'};Selected=$selected;ImagePath=$image})
            Start-Sleep -Milliseconds 125
          }
          $samples|Export-Csv -NoTypeInformation -Encoding UTF8 (Join-Path $diag 'samples.csv')
          $firstExists=$samples|Where-Object Exists|Select-Object -First 1
          $firstRunning=$samples|Where-Object State -eq 'Running'|Select-Object -First 1
          $last=$samples[$samples.Count-1]
          $existsMs=if($firstExists){$firstExists.ElapsedMs}else{-1};$runningMs=if($firstRunning){$firstRunning.ElapsedMs}else{-1}
          Write-Host "REV16_INITIALIZED_INSTALL exists_ms=$existsMs running_ms=$runningMs last=$($last.State) exit=$($last.ExitCode) winws=$($last.Winws) driver=$($last.Driver) selected='$($last.Selected)' image_len=$($last.ImagePath.Length)"
          Write-Host "REV16_IMAGE_HAS_GAME_TCP_12=$($last.ImagePath -match '--filter-tcp[ =]+12') REV16_IMAGE_HAS_GAME_UDP_12=$($last.ImagePath -match '--filter-udp[ =]+12')"
          Write-Host '===== STDOUT TAIL =====';Get-Content $out -Tail 100 -ErrorAction SilentlyContinue|Write-Host
          Write-Host '===== STDERR =====';Get-Content -Raw $err -ErrorAction SilentlyContinue|Write-Host
          $events=Get-WinEvent -FilterHashtable @{LogName='System';StartTime=[DateTime]::Now.AddMinutes(-5)} -ErrorAction SilentlyContinue|Where-Object{$_.Message-match'(?i)zapret|WinDivert|winws'}|Select-Object TimeCreated,ProviderName,Id,LevelDisplayName,Message
          $events|Format-List|Out-String -Width 400|Set-Content -Encoding UTF8 (Join-Path $diag 'events.txt')
          Get-Content -Raw (Join-Path $diag 'events.txt')|Write-Host
          if($last.State-ne'Running'){throw "Initialized upstream install did not stay Running: state=$($last.State) exit=$($last.ExitCode)"}
          if($last.Selected-ne'general'){throw "Unexpected registered strategy: $($last.Selected)"}
          if($last.ImagePath-notmatch'--filter-tcp[ =]+12'){throw 'GameFilterTCP fallback was not preserved in service args'}
          if($last.ImagePath-notmatch'--filter-udp[ =]+12'){throw 'GameFilterUDP fallback was not preserved in service args'}

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rev16-zapret-runtime-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/rev16-zapret-runtime-diagnostic
          if-no-files-found: warn

      - name: Cleanup runner state
        if: always()
        shell: pwsh
        run: |
          Get-Process winws -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          foreach($name in @('zapret','WinDivert','WinDivert14')){cmd.exe /d /c "sc.exe stop $name >nul 2>&1 & sc.exe delete $name >nul 2>&1"|Out-Null}
          Remove-Item -Force -ErrorAction SilentlyContinue '_release/0.4.17/third-party/Zapret/service-dpop-initialized-install.bat'
          exit 0
