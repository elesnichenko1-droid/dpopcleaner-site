name: Rev16 Zapret runtime diagnostic

on:
  push:
    branches:
      - feat/0.4.17-rev16-single-tray-zapret
    paths:
      - '.github/workflows/rev16-zapret-runtime-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5

      - name: Prepare pinned Flowseal Zapret 1.10.2
        shell: pwsh
        run: ./tools/dpop0417_prepare_zapret.ps1

      - name: Compare immediate stdin with fixed selected choice
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path '_release/0.4.17/third-party/Zapret').Path
          $diag = Join-Path $env:RUNNER_TEMP 'rev16-zapret-runtime-diagnostic'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          $service = Join-Path $root 'service.bat'
          $raw = (Get-Content -Raw -LiteralPath $service) -replace "`r`n", "`n"
          $title = 'title ZAPRET SERVICE MANAGER v!LOCAL_VERSION!'
          $choicePrompt = 'set /p "choice=Input option (0-!count!, default: 0): "'
          if (([regex]::Matches($raw,[regex]::Escape($title))).Count -ne 1) { throw 'title anchor mismatch' }
          if (([regex]::Matches($raw,[regex]::Escape($choicePrompt))).Count -ne 1) { throw 'choice prompt mismatch' }

          function Clear-State {
            Get-Process winws -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            foreach($name in @('zapret','WinDivert','WinDivert14')) {
              cmd.exe /d /c "sc.exe stop $name >nul 2>&1 & sc.exe delete $name >nul 2>&1" | Out-Null
            }
            Start-Sleep -Milliseconds 600
          }

          function Snapshot([string]$Mode,[int]$Elapsed) {
            $svc = Get-CimInstance Win32_Service -Filter "Name='zapret'" -ErrorAction SilentlyContinue
            $winws = @(Get-CimInstance Win32_Process -Filter "Name='winws.exe'" -ErrorAction SilentlyContinue)
            $driver = Get-CimInstance Win32_SystemDriver -Filter "Name='WinDivert'" -ErrorAction SilentlyContinue
            $selected=''; $image=''
            try {
              $props=Get-ItemProperty -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\zapret' -ErrorAction Stop
              $selected=[string]$props.'zapret-discord-youtube'; $image=[string]$props.ImagePath
            } catch { }
            [pscustomobject]@{
              Mode=$Mode; ElapsedMs=$Elapsed; Exists=[bool]$svc;
              State=if($svc){[string]$svc.State}else{'Missing'};
              ExitCode=if($svc){[int]$svc.ExitCode}else{-1};
              ServicePid=if($svc){[int]$svc.ProcessId}else{0};
              WinwsCount=$winws.Count;
              DriverState=if($driver){[string]$driver.State}else{'Missing'};
              Selected=$selected; ImageLength=$image.Length
            }
          }

          function Invoke-Probe([string]$Mode,[bool]$FixedChoice) {
            Clear-State
            $source=$raw.Replace($title,($title+"`ngoto service_install"))
            if($FixedChoice){ $source=$source.Replace($choicePrompt,'set "choice=22"') }
            $variant=Join-Path $root ("service-dpop-$Mode.bat")
            [IO.File]::WriteAllText($variant,($source -replace "`n","`r`n"),[Text.UTF8Encoding]::new($false))
            $out=Join-Path $diag "$Mode-stdout.txt"; $err=Join-Path $diag "$Mode-stderr.txt"
            $psi=[Diagnostics.ProcessStartInfo]::new()
            $psi.FileName='cmd.exe'; $psi.Arguments='/d /c ""'+$variant+'" admin"'; $psi.WorkingDirectory=$root
            $psi.UseShellExecute=$false; $psi.CreateNoWindow=$true; $psi.RedirectStandardOutput=$true; $psi.RedirectStandardError=$true
            if(-not $FixedChoice){$psi.RedirectStandardInput=$true}
            $p=[Diagnostics.Process]::new(); $p.StartInfo=$psi
            if(-not $p.Start()){throw "could not start $Mode"}
            $outTask=$p.StandardOutput.ReadToEndAsync(); $errTask=$p.StandardError.ReadToEndAsync()
            if(-not $FixedChoice){$p.StandardInput.WriteLine('22');$p.StandardInput.Flush()}
            $samples=[Collections.Generic.List[object]]::new(); $start=[DateTime]::UtcNow
            while((([DateTime]::UtcNow-$start).TotalSeconds) -lt 12){
              $elapsed=[int]([DateTime]::UtcNow-$start).TotalMilliseconds
              $samples.Add((Snapshot $Mode $elapsed))
              Start-Sleep -Milliseconds 125
            }
            $firstExists=$samples|Where-Object Exists|Select-Object -First 1
            $firstRunning=$samples|Where-Object State -eq 'Running'|Select-Object -First 1
            $last=$samples[$samples.Count-1]
            $existsMs=if($firstExists){$firstExists.ElapsedMs}else{-1};$runningMs=if($firstRunning){$firstRunning.ElapsedMs}else{-1}
            Write-Host "REV16_AB mode=$Mode exists_ms=$existsMs running_ms=$runningMs last=$($last.State) exit=$($last.ExitCode) winws=$($last.WinwsCount) driver=$($last.DriverState) selected='$($last.Selected)' image_len=$($last.ImageLength)"
            $samples|Export-Csv -NoTypeInformation -Encoding UTF8 (Join-Path $diag "$Mode-samples.csv")
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            Get-Process winws -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Milliseconds 250
            try{if($outTask.Wait(1000)){$outTask.Result|Set-Content -Encoding UTF8 $out}else{'[pending]'|Set-Content -Encoding UTF8 $out}}catch{}
            try{if($errTask.Wait(1000)){$errTask.Result|Set-Content -Encoding UTF8 $err}else{'[pending]'|Set-Content -Encoding UTF8 $err}}catch{}
            Remove-Item -Force -ErrorAction SilentlyContinue $variant
          }

          Invoke-Probe 'stdin' $false
          Invoke-Probe 'fixed-choice' $true

          Write-Host '===== FIXED CHOICE STDOUT TAIL ====='
          Get-Content (Join-Path $diag 'fixed-choice-stdout.txt') -Tail 100 -ErrorAction SilentlyContinue | Write-Host
          Write-Host '===== FIXED CHOICE STDERR ====='
          Get-Content -Raw (Join-Path $diag 'fixed-choice-stderr.txt') -ErrorAction SilentlyContinue | Write-Host
          $events=Get-WinEvent -FilterHashtable @{LogName='System';StartTime=[DateTime]::Now.AddMinutes(-5)} -ErrorAction SilentlyContinue |
            Where-Object {$_.Message -match '(?i)zapret|WinDivert|winws'} | Select-Object TimeCreated,ProviderName,Id,LevelDisplayName,Message
          $events|Format-List|Out-String -Width 400|Set-Content -Encoding UTF8 (Join-Path $diag 'events.txt')
          Get-Content -Raw (Join-Path $diag 'events.txt') | Write-Host
          Clear-State

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rev16-zapret-runtime-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/rev16-zapret-runtime-diagnostic
          if-no-files-found: warn

      - name: Cleanup runner state
        if: always()
        shell: pwsh
        run: |
          Get-Process winws -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          foreach($name in @('zapret','WinDivert','WinDivert14')) { cmd.exe /d /c "sc.exe stop $name >nul 2>&1 & sc.exe delete $name >nul 2>&1" | Out-Null }
          Remove-Item -Force -ErrorAction SilentlyContinue '_release/0.4.17/third-party/Zapret/service-dpop-*.bat'
          exit 0
