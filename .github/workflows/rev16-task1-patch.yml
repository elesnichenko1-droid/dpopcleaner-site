name: Rev16 Task1 patch helper

on:
  push:
    branches:
      - feat/0.4.17-rev16-single-tray-zapret
    paths:
      - 'tools/rev16_apply_task1_patch.py'
      - '.github/workflows/rev16-task1-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/0.4.17-rev16-single-tray-zapret
          fetch-depth: 0
      - name: Apply deterministic Task 1 patch
        shell: pwsh
        run: python tools/rev16_apply_task1_patch.py
      - name: Commit Task 1 GREEN implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain)) { throw 'Task 1 patch produced no source changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v0417/src/SimpleUpdate/LauncherContext.cs v0417/src/SimpleUpdate/TrayRamBadgeHost.cs v0417/src/SimpleUpdate/BridgeTrayGhostSuppressor.cs
          git commit -m 'fix(rev16): preserve single tray identity across core restart'
          git push origin HEAD:feat/0.4.17-rev16-single-tray-zapret
