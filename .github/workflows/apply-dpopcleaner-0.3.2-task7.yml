name: Apply DPopCleaner 0.3.2 Task 7 functional overview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task7:
    runs-on: windows-2022

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Task 6 committed baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'v032/ui/Shell.cpp',
            'v032/ui/Shell.h',
            'v032/ui/StatusBar.cpp',
            'v032/ui/StatusBar.h',
            'v032/tests/ShellContractTests.cpp'
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Task 6 baseline missing: $path"
            }
          }
          if (Test-Path -LiteralPath 'v032/ui/pages/OverviewPage.cpp') {
            throw 'Task 7 already appears committed.'
          }
          Write-Host 'Task 6 baseline PASS'

      - name: RED - add Overview model test and prove model is missing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Write-B64([string]$Path,[string]$Data) {
            $dir = Split-Path -Parent $Path
            if ($dir) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
            [IO.File]::WriteAllBytes($Path,[Convert]::FromBase64String($Data))
          }

          Write-B64 'v032/tests/OverviewModelTests.cpp' ''

          $cmakePath = 'v032/CMakeLists.txt'
          $cmake = Get-Content -Raw -LiteralPath $cmakePath
          if (-not $cmake.Contains('add_executable(OverviewModelTests')) {
            $target = [Text.Encoding]::UTF8.GetString(
              [Convert]::FromBase64String('')
            )
            $lastEndif = $cmake.LastIndexOf('endif()')
            if ($lastEndif -lt 0) {
              throw 'Final BUILD_TESTING endif() not found.'
            }
            $cmake = $cmake.Insert($lastEndif, $target)
            Set-Content -LiteralPath $cmakePath -Value $cmake -Encoding utf8
          }

          Remove-Item task7-red-src,task7-red-build -Recurse -Force -ErrorAction SilentlyContinue
          ./scripts/Prepare-032Source.ps1 -RepositoryRoot $PWD -Destination "$PWD/task7-red-src"

          cmake -S task7-red-src -B task7-red-build -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) {
            throw 'RED configure failed for an unrelated reason.'
          }

          $redOutput = @()
          & cmake --build task7-red-build --config Release --target OverviewModelTests 2>&1 |
            Tee-Object -Variable redOutput
          $redCode = $LASTEXITCODE

          if ($redCode -eq 0) {
            throw 'RED unexpectedly passed before OverviewPage.h exists.'
          }

          $joined = ($redOutput | Out-String)
          if ($joined -notmatch 'OverviewPage\.h') {
            throw "RED failed for an unrelated reason. Output:`n$joined"
          }

          Write-Host 'RED PASS: Overview model test fails because OverviewPage.h is absent.'
          exit 0

      - name: GREEN - implement Overview and fix static backgrounds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Write-B64([string]$Path,[string]$Data) {
            $dir = Split-Path -Parent $Path
            if ($dir) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
            [IO.File]::WriteAllBytes($Path,[Convert]::FromBase64String($Data))
          }

          Write-B64 'v032/ui/pages/OverviewPage.h' ''
          Write-B64 'v032/ui/pages/OverviewPage.cpp' ''
          Write-B64 'v032/ui/Shell.cpp' ''
          Write-B64 'v032/ui/StatusBar.h' ''
          Write-B64 'v032/ui/StatusBar.cpp' ''

          $cmakePath = 'v032/CMakeLists.txt'
          $lines = [Collections.Generic.List[string]]::new()
          Get-Content -LiteralPath $cmakePath | ForEach-Object {
            [void]$lines.Add([string]$_)
          }

          $appStart = -1
          $appEnd = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].Trim() -eq 'add_executable(DPopCleaner WIN32') {
              $appStart = $i
              break
            }
          }
          if ($appStart -lt 0) { throw 'DPopCleaner target not found.' }

          for ($i = $appStart + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i].Trim() -eq ')') {
              $appEnd = $i
              break
            }
          }
          if ($appEnd -lt 0) { throw 'DPopCleaner target end not found.' }

          $overviewCount = 0
          $settingsIndex = -1
          for ($i = $appStart + 1; $i -lt $appEnd; $i++) {
            $trimmed = $lines[$i].Trim()
            if ($trimmed -eq 'src/ui/pages/OverviewPage.cpp') {
              $overviewCount++
            }
            if ($trimmed -eq 'src/ui/pages/SettingsStubPage.cpp') {
              $settingsIndex = $i
            }
          }

          if ($overviewCount -eq 0) {
            if ($settingsIndex -lt 0) {
              throw 'SettingsStubPage.cpp anchor missing in DPopCleaner target.'
            }
            $lines.Insert(
              $settingsIndex + 1,
              '    src/ui/pages/OverviewPage.cpp'
            )
          } elseif ($overviewCount -ne 1) {
            throw "OverviewPage.cpp count is invalid: $overviewCount"
          }

          Set-Content -LiteralPath $cmakePath -Value $lines -Encoding utf8

      - name: Verify Task 7 source policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $overview = Get-Content -Raw v032/ui/pages/OverviewPage.cpp
          $header = Get-Content -Raw v032/ui/pages/OverviewPage.h
          $shell = Get-Content -Raw v032/ui/Shell.cpp
          $cmake = Get-Content -Raw v032/CMakeLists.txt

          foreach ($token in @(
            'Диск C:\',
            'Оперативная память',
            'Установленные приложения',
            'DPopGuard',
            'Zapret',
            'Заполненность корзины',
            'Обновить',
            'Быстрая очистка',
            'Быстрый DPopGuard',
            'Открыть диск',
            'Открыть приложения',
            'system_info::Collect()',
            'EnumerateInstalledApps()',
            'EstimateRecycleBinBytes()',
            'QueryStatus()',
            'L"Обзор обновлён."'
          )) {
            if (-not $overview.Contains($token)) {
              throw "Overview behavior missing: $token"
            }
          }

          foreach ($token in @(
            'ramUsedPercent',
            'driveUsedPercent',
            'recycleEmpty',
            'zapretText',
            'QuickScan • AMSI'
          )) {
            if (-not $header.Contains($token)) {
              throw "Overview model missing: $token"
            }
          }

          foreach ($token in @(
            'overviewPage_.Create',
            'overviewPage_.Show(overview)',
            'case kOverviewLogChangedMessage:',
            'GetStockObject(DC_BRUSH)'
          )) {
            if (-not $shell.Contains($token)) {
              throw "Shell integration missing: $token"
            }
          }

          if ($shell.Contains('GetStockObject(NULL_BRUSH)')) {
            throw 'Task 6 white STATIC background regression remains.'
          }

          $overviewSourceCount = @(
            Get-Content v032/CMakeLists.txt |
              Where-Object { $_.Trim() -eq 'src/ui/pages/OverviewPage.cpp' }
          ).Count
          if ($overviewSourceCount -ne 1) {
            throw "OverviewPage.cpp must occur once in CMake; got $overviewSourceCount"
          }

          if (-not $cmake.Contains('add_executable(OverviewModelTests')) {
            throw 'OverviewModelTests target missing.'
          }

          Write-Host 'Task 7 source policy PASS'

      - name: GREEN - build app and Task 2-7 tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item task7-src,task7-build -Recurse -Force -ErrorAction SilentlyContinue
          ./scripts/Prepare-032Source.ps1 -RepositoryRoot $PWD -Destination "$PWD/task7-src"

          cmake -S task7-src -B task7-build -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'Task 7 configure failed.' }

          cmake --build task7-build --config Release --target `
            DPopCleaner `
            OverviewModelTests `
            ShellContractTests `
            SessionLogTests `
            StatusBarCompileTests `
            ThemeTests `
            ControlsTests `
            LayoutTests `
            ShellModelTests
          if ($LASTEXITCODE -ne 0) { throw 'Task 7 build failed.' }

          ctest --test-dir task7-build -C Release `
            -R '^(OverviewModelTests|ShellContractTests|SessionLogTests|StatusBarCompileTests|ThemeTests|ControlsTests|LayoutTests|ShellModelTests)$' `
            --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Task 2-7 regression tests failed.' }

      - name: Capture Task 7 Overview and reject white-background regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Path task7-evidence -Force | Out-Null

          $result = ./scripts/Capture-AppScreenshot.ps1 `
            -ExecutablePath 'task7-build/bin/Release/DPopCleaner.exe' `
            -OutputPath 'task7-evidence/DPopCleaner_0.3.2_Task7_Overview.png' `
            -TimeoutSeconds 30

          $result |
            ConvertTo-Json -Depth 8 |
            Set-Content 'task7-evidence/capture-report.json' -Encoding utf8

          if (-not $result.graceful_close) {
            throw 'Task 7 app did not close gracefully.'
          }

          Add-Type -AssemblyName System.Drawing
          $bitmap = [Drawing.Bitmap]::FromFile(
            (Resolve-Path 'task7-evidence/DPopCleaner_0.3.2_Task7_Overview.png')
          )
          try {
            $white = 0
            $sampled = 0

            for ($y = 0; $y -lt $bitmap.Height; $y += 4) {
              for ($x = 0; $x -lt $bitmap.Width; $x += 4) {
                $pixel = $bitmap.GetPixel($x, $y)
                $sampled++
                if ($pixel.R -ge 240 -and
                    $pixel.G -ge 240 -and
                    $pixel.B -ge 240) {
                  $white++
                }
              }
            }

            $ratio = if ($sampled -eq 0) {
              1.0
            } else {
              [double]$white / [double]$sampled
            }

            Write-Host ("Near-white pixel ratio: {0:P2}" -f $ratio)

            if ($ratio -gt 0.05) {
              throw "White-background regression detected: ratio=$ratio"
            }
          } finally {
            $bitmap.Dispose()
          }

          Copy-Item `
            'task7-build/bin/Release/DPopCleaner.exe' `
            'task7-evidence/DPopCleaner_0.3.2_Task7.exe' `
            -Force

      - name: Upload Task 7 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: dpopcleaner-0.3.2-task7-overview
          path: task7-evidence/*
          if-no-files-found: error

      - name: Confirm R4 and published site are untouched
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $protectedDiff = git diff -- r4 index.html script.js update downloads release-manifest.js
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect protected paths.' }
          if ($protectedDiff) {
            Write-Host $protectedDiff
            throw 'Task 7 changed protected R4/site files.'
          }

          Write-Host 'Protected R4/site paths PASS'

      - name: Commit Task 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item task7-red-src,task7-red-build,task7-src,task7-build,task7-evidence `
            -Recurse -Force -ErrorAction SilentlyContinue

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add `
            v032/CMakeLists.txt `
            v032/ui/Shell.cpp `
            v032/ui/StatusBar.h `
            v032/ui/StatusBar.cpp `
            v032/ui/pages/OverviewPage.h `
            v032/ui/pages/OverviewPage.cpp `
            v032/tests/OverviewModelTests.cpp

          if (git diff --cached --quiet) {
            Write-Host 'Task 7 already matches.'
            exit 0
          }

          git commit -m 'feat: restore functional overview dashboard'
          git push origin HEAD:main
