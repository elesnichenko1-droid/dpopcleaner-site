name: Capture DPopCleaner 0.4.17 site screenshots

on:
  push:
    branches:
      - feat/dpopcleaner-0.4.17-0214
    paths:
      - '.github/workflows/capture-dpopcleaner-0.4.17-assets.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: windows-2022
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feat/dpopcleaner-0.4.17-0214

      - name: Build companion modules
        shell: pwsh
        run: |
          dotnet build v0417/src/DPop.Common/DPop.Common.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build v0417/src/DiskAnalyzer/DiskAnalyzer.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build v0417/src/RestoreCenter/RestoreCenter.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage and capture real windows
        shell: pwsh
        run: |
          ./tools/dpop0417_stage.ps1 -RequireCompanions
          ./tools/dpop0417_disk_smoke.ps1 `
            -ExePath '_release/0.4.17/stage/Modules/DiskAnalyzer.exe' `
            -OutputDir '_release/0.4.17/evidence/disk'
          ./tools/dpop0417_restore_smoke.ps1 `
            -ExePath '_release/0.4.17/stage/Modules/RestoreCenter.exe' `
            -OutputDir '_release/0.4.17/evidence/restore'
          if (-not (Test-Path '_release/0.4.17/evidence/disk/disk-analyzer-1200x850.png')) { throw 'Disk screenshot missing.' }
          if (-not (Test-Path '_release/0.4.17/evidence/restore/restore-center-1100x700.png')) { throw 'Restore screenshot missing.' }
          New-Item -ItemType Directory -Path assets -Force | Out-Null
          Copy-Item '_release/0.4.17/evidence/disk/disk-analyzer-1200x850.png' 'assets/dpopcleaner-0.4.17-disk.png' -Force
          Copy-Item '_release/0.4.17/evidence/restore/restore-center-1100x700.png' 'assets/dpopcleaner-0.4.17-restore.png' -Force

      - name: Commit verified screenshots
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/dpopcleaner-0.4.17-disk.png assets/dpopcleaner-0.4.17-restore.png
          if (git diff --cached --quiet) {
            Write-Host 'Screenshots already match verified evidence.'
            exit 0
          }
          git commit -m 'assets(0.4.17): add verified Windows screenshots'
          git push origin HEAD:feat/dpopcleaner-0.4.17-0214
