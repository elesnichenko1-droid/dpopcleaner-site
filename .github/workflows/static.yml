name: Deploy legacy DPopCleaner site to Pages (manual only)

on:
  workflow_dispatch:

permissions:
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-legacy-manual
  cancel-in-progress: false

jobs:
  legacy-manual-only:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy deployer disabled for automatic releases
        run: |
          echo "Automatic legacy Pages deployment is disabled."
          echo "DPopCleaner 0.3.5+ is published by publish-dpopcleaner-0.3.5.yml."
