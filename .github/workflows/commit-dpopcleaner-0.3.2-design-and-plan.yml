name: Commit DPopCleaner 0.3.2 design and plan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Write approved design and shell plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/superpowers/specs docs/superpowers/plans
          printf '%s' '' | base64 -d > docs/superpowers/specs/2026-08-23-dpopcleaner-0.3.2-ui-recovery-design.md
          printf '%s' '' | base64 -d > docs/superpowers/plans/2026-08-23-dpopcleaner-0.3.2-shell-recovery.md

      - name: Verify documents
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DPopCleaner 0.3.2 BETA R1' docs/superpowers/specs/2026-08-23-dpopcleaner-0.3.2-ui-recovery-design.md
          grep -q 'DPopCleaner 0.3.2 Shell Recovery Implementation Plan' docs/superpowers/plans/2026-08-23-dpopcleaner-0.3.2-shell-recovery.md
          ! grep -Eiq 'TBD|TODO|implement later|fill in details' docs/superpowers/plans/2026-08-23-dpopcleaner-0.3.2-shell-recovery.md

      - name: Commit documents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/specs/2026-08-23-dpopcleaner-0.3.2-ui-recovery-design.md \
                  docs/superpowers/plans/2026-08-23-dpopcleaner-0.3.2-shell-recovery.md
          if git diff --cached --quiet; then
            echo 'Documents already match.'
            exit 0
          fi
          git commit -m 'docs: add DPopCleaner 0.3.2 recovery design and shell plan'
          git push origin HEAD:main
