name: DPopCleaner 0.4.18 Phase A development

on:
  push:
    branches:
      - feat/0.4.18-phase-a-native-core
    paths:
      - 'v0418/**'
      - 'tests/test_dpop0418_phase_a_identity_contract.py'
      - '.github/workflows/DPopCleaner_0.4.18_PHASE_A.yml'
  pull_request:
    paths:
      - 'v0418/**'
      - 'tests/test_dpop0418_phase_a_identity_contract.py'
      - '.github/workflows/DPopCleaner_0.4.18_PHASE_A.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify Phase A identity contract
        shell: pwsh
        run: python -m pytest -q tests/test_dpop0418_phase_a_identity_contract.py
      - name: Configure native CMake tests
        shell: pwsh
        run: cmake -S v0418 -B build0418 -A x64
      - name: Build settings and update-policy tests
        shell: pwsh
        run: cmake --build build0418 --config Release --target AppSettingsTests UpdatePolicyTests
      - name: Run settings and update-policy tests
        shell: pwsh
        run: ctest --test-dir build0418 -C Release -R 'AppSettingsTests|UpdatePolicyTests' --output-on-failure
