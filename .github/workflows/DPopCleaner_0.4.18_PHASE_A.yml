name: DPopCleaner 0.4.18 Phase A development

on:
  push:
    branches:
      - feat/0.4.18-phase-a-native-core
    paths:
      - 'v0418/**'
      - 'tests/test_dpop0418_phase_a_identity_contract.py'
      - '.github/workflows/DPopCleaner_0.4.18_PHASE_A.yml'
  pull_request:
    paths:
      - 'v0418/**'
      - 'tests/test_dpop0418_phase_a_identity_contract.py'
      - '.github/workflows/DPopCleaner_0.4.18_PHASE_A.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify Phase A identity contract
        shell: pwsh
        run: python -m pytest -q tests/test_dpop0418_phase_a_identity_contract.py
