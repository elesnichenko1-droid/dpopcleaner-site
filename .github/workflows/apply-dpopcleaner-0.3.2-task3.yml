name: Apply DPopCleaner 0.3.2 Task 3 responsive layout

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task3:
    runs-on: windows-2022

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Task 2 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path v032/ui/ShellModel.h)) { throw 'Task 2 ShellModel.h missing.' }
          if (-not (Test-Path v032/ui/ShellModel.cpp)) { throw 'Task 2 ShellModel.cpp missing.' }
          if (-not (Test-Path v032/tests/ShellModelTests.cpp)) { throw 'Task 2 ShellModelTests missing.' }
          $baselineCmake = Get-Content -Raw v032/CMakeLists.txt
          if (-not $baselineCmake.Contains('ShellModelTests')) { throw 'Task 2 CMake baseline missing.' }
          if (Test-Path v032/ui/Layout.h) { throw 'Task 3 precondition failed: Layout.h already exists.' }
          if (Test-Path v032/ui/Layout.cpp) { throw 'Task 3 precondition failed: Layout.cpp already exists.' }

      - name: RED - write test and prove Layout is missing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Write-B64([string]$Path,[string]$Data) {
            $dir = Split-Path -Parent $Path
            if ($dir) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
            [IO.File]::WriteAllBytes($Path,[Convert]::FromBase64String($Data))
          }

          Write-B64 'v032/tests/LayoutTests.cpp' ''
          Write-B64 'v032/CMakeLists.txt' ''

          Remove-Item task3-red-src,task3-red-build -Recurse -Force -ErrorAction SilentlyContinue
          ./scripts/Prepare-032Source.ps1 -RepositoryRoot $PWD -Destination "$PWD/task3-red-src"

          $redOutput = @()
          & cmake -S task3-red-src -B task3-red-build -A x64 -DBUILD_TESTING=ON 2>&1 |
            Tee-Object -Variable redOutput
          $redCode = $LASTEXITCODE

          if ($redCode -eq 0) {
            throw 'RED unexpectedly configured before Layout implementation.'
          }

          $joined = ($redOutput | Out-String)
          if ($joined -notmatch 'Layout\.cpp') {
            throw "RED failed for an unrelated reason. Output:`n$joined"
          }

          Write-Host 'RED PASS: missing src/ui/Layout.cpp is the expected failure.'
          exit 0

      - name: GREEN - implement responsive Layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Write-B64([string]$Path,[string]$Data) {
            $dir = Split-Path -Parent $Path
            if ($dir) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
            [IO.File]::WriteAllBytes($Path,[Convert]::FromBase64String($Data))
          }

          Write-B64 'v032/ui/Layout.h' ''
          Write-B64 'v032/ui/Layout.cpp' ''

      - name: Verify Task 3 source policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $header = Get-Content -Raw v032/ui/Layout.h
          $impl = Get-Content -Raw v032/ui/Layout.cpp
          $tests = Get-Content -Raw v032/tests/LayoutTests.cpp
          $cmakeText = Get-Content -Raw v032/CMakeLists.txt

          foreach ($token in @(
            'std::array<Box, 6> overviewCards',
            'std::array<Box, 5> overviewActions',
            'ComputeShellLayout'
          )) {
            if (-not $header.Contains($token)) { throw "Layout header missing: $token" }
          }

          foreach ($token in @(
            'kMinClientWidth = 1100',
            'kMinClientHeight = 700',
            'kHeaderHeight = 100',
            'kTabsHeight = 54',
            'kFooterHeight = 150',
            'w >= 1180'
          )) {
            if (-not $impl.Contains($token)) { throw "Layout policy missing: $token" }
          }

          foreach ($token in @(
            '1100, 700',
            '1200, 850',
            '1920, 1080',
            'LayoutTests PASS'
          )) {
            if (-not $tests.Contains($token)) { throw "LayoutTests missing: $token" }
          }

          if (-not $cmakeText.Contains('add_executable(LayoutTests')) { throw 'LayoutTests target missing.' }
          Write-Host 'Task 3 source policy PASS'

      - name: GREEN - build and run Layout plus Task 2 regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item task3-src,task3-build -Recurse -Force -ErrorAction SilentlyContinue
          ./scripts/Prepare-032Source.ps1 -RepositoryRoot $PWD -Destination "$PWD/task3-src"

          cmake -S task3-src -B task3-build -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }

          cmake --build task3-build --config Release --target LayoutTests ShellModelTests
          if ($LASTEXITCODE -ne 0) { throw 'Task 2/3 test build failed.' }

          ctest --test-dir task3-build -C Release -R '^(LayoutTests|ShellModelTests)$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Layout/ShellModel tests failed.' }

      - name: Confirm R4 and site are untouched
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $protectedDiff = git diff -- r4 index.html script.js update downloads release-manifest.js
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect protected paths.' }
          if ($protectedDiff) {
            Write-Host $protectedDiff
            throw 'Task 3 changed protected R4/site files.'
          }

          Write-Host 'R4 and site remain untouched.'

      - name: Commit Task 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item task3-red-src,task3-red-build,task3-src,task3-build -Recurse -Force -ErrorAction SilentlyContinue

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add `
            v032/CMakeLists.txt `
            v032/ui/Layout.h `
            v032/ui/Layout.cpp `
            v032/tests/LayoutTests.cpp

          if (git diff --cached --quiet) {
            Write-Host 'Task 3 already matches.'
            exit 0
          }

          git commit -m 'feat: add responsive DPopCleaner 0.3.2 layout'
          git push origin HEAD:main
