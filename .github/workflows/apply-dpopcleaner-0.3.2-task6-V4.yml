name: Apply DPopCleaner 0.3.2 Task 6 real shell window V4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task6:
    runs-on: windows-2022

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Task 5 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'v032/ui/ShellModel.cpp',
            'v032/ui/Layout.cpp',
            'v032/ui/Theme.cpp',
            'v032/ui/Controls.cpp',
            'v032/ui/SessionLog.cpp',
            'v032/ui/StatusBar.cpp',
            'v032/tests/StatusBarCompileTests.cpp'
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing Task 2-5 baseline: $path"
            }
          }
          if (Test-Path -LiteralPath 'v032/ui/Shell.cpp') {
            throw 'Task 6 already appears committed; refusing to overlay an unknown state.'
          }
          if (Test-Path -LiteralPath 'v032/ui/pages/SettingsStubPage.cpp') {
            throw 'Task 6 Settings stub already appears committed; refusing to overlay an unknown state.'
          }
          Write-Host 'Task 5 baseline verified.'

      - name: Apply Task 6 sources and deterministic CMake update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Write-B64([string]$Path, [string]$Data) {
            $dir = Split-Path -Parent $Path
            if ($dir) {
              New-Item -ItemType Directory -Path $dir -Force | Out-Null
            }
            [IO.File]::WriteAllBytes(
              $Path,
              [Convert]::FromBase64String($Data)
            )
          }

          Write-B64 'v032/tests/ShellContractTests.cpp' ''
          Write-B64 'v032/ui/Shell.h' ''
          Write-B64 'v032/ui/Shell.cpp' ''
          Write-B64 'v032/ui/pages/SettingsStubPage.h' ''
          Write-B64 'v032/ui/pages/SettingsStubPage.cpp' ''

          $cmakePath = 'v032/CMakeLists.txt'
          $lines = [Collections.Generic.List[string]]::new()
          Get-Content -LiteralPath $cmakePath | ForEach-Object {
            [void]$lines.Add([string]$_)
          }

          function Find-ExecutableBlock(
            [Collections.Generic.List[string]]$InputLines,
            [string]$StartText
          ) {
            $start = -1
            for ($i = 0; $i -lt $InputLines.Count; $i++) {
              if ($InputLines[$i].Trim() -eq $StartText) {
                $start = $i
                break
              }
            }
            if ($start -lt 0) {
              throw "CMake target not found: $StartText"
            }

            $end = -1
            for ($i = $start + 1; $i -lt $InputLines.Count; $i++) {
              if ($InputLines[$i].Trim() -eq ')') {
                $end = $i
                break
              }
            }
            if ($end -lt 0) {
              throw "CMake target end not found: $StartText"
            }

            return [pscustomobject]@{ Start = $start; End = $end }
          }

          $appBlock = Find-ExecutableBlock $lines 'add_executable(DPopCleaner WIN32'

          $statusIndex = -1
          for ($i = $appBlock.Start + 1; $i -lt $appBlock.End; $i++) {
            if ($lines[$i].Trim() -eq 'src/ui/StatusBar.cpp') {
              if ($statusIndex -ge 0) {
                throw 'DPopCleaner target contains duplicate StatusBar.cpp entries.'
              }
              $statusIndex = $i
            }
          }
          if ($statusIndex -lt 0) {
            throw 'StatusBar.cpp was not found inside DPopCleaner target.'
          }

          $lines.Insert($statusIndex + 1, '    src/ui/Shell.cpp')
          $lines.Insert($statusIndex + 2, '    src/ui/pages/SettingsStubPage.cpp')

          $hasContractTarget = $false
          foreach ($line in $lines) {
            if ($line.Trim() -eq 'add_executable(ShellContractTests') {
              $hasContractTarget = $true
              break
            }
          }

          if (-not $hasContractTarget) {
            $buildTestingEnd = -1
            for ($i = $lines.Count - 1; $i -ge 0; $i--) {
              if ($lines[$i].Trim() -eq 'endif()') {
                $buildTestingEnd = $i
                break
              }
            }
            if ($buildTestingEnd -lt 0) {
              throw 'Final BUILD_TESTING endif() not found.'
            }

            $targetText = [Text.Encoding]::UTF8.GetString(
              [Convert]::FromBase64String('')
            )
            $targetLines = @(
              $targetText -split '\r?\n' |
                Where-Object { $_ -ne '' }
            )
            for ($offset = 0; $offset -lt $targetLines.Count; $offset++) {
              $lines.Insert(
                $buildTestingEnd + $offset,
                [string]$targetLines[$offset]
              )
            }
          }

          Set-Content -LiteralPath $cmakePath -Value $lines -Encoding utf8

          $policyPath = 'v032/tests/Ui032Policy.Tests.ps1'
          $policy = Get-Content -Raw -LiteralPath $policyPath
          if (-not $policy.Contains('# Task 6 shell recovery policy.')) {
            $append = [Text.Encoding]::UTF8.GetString(
              [Convert]::FromBase64String('')
            )
            $marker = "'Ui032Policy PASS'"
            if (-not $policy.Contains($marker)) {
              throw 'Ui032Policy PASS marker missing.'
            }
            $policy = $policy.Replace(
              $marker,
              $append + "`r`n" + $marker
            )
            Set-Content -LiteralPath $policyPath -Value $policy -Encoding utf8
          }

          Write-Host 'Task 6 sources and CMake were applied.'

      - name: Verify CMake target isolation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $lines = @(Get-Content -LiteralPath 'v032/CMakeLists.txt')

          function Get-TargetSources([string]$StartText) {
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i].Trim() -eq $StartText) {
                $start = $i
                break
              }
            }
            if ($start -lt 0) {
              throw "Target start missing: $StartText"
            }

            $sources = [Collections.Generic.List[string]]::new()
            for ($i = $start + 1; $i -lt $lines.Count; $i++) {
              $trimmed = $lines[$i].Trim()
              if ($trimmed -eq ')') {
                return @($sources)
              }
              [void]$sources.Add($trimmed)
            }
            throw "Target end missing: $StartText"
          }

          $appSources = @(Get-TargetSources 'add_executable(DPopCleaner WIN32')
          $statusSources = @(Get-TargetSources 'add_executable(StatusBarCompileTests')

          foreach ($required in @(
            'src/ui/StatusBar.cpp',
            'src/ui/Shell.cpp',
            'src/ui/pages/SettingsStubPage.cpp'
          )) {
            if (@($appSources | Where-Object { $_ -eq $required }).Count -ne 1) {
              throw "DPopCleaner target must contain exactly one $required"
            }
          }

          foreach ($forbidden in @(
            'src/ui/Shell.cpp',
            'src/ui/pages/SettingsStubPage.cpp'
          )) {
            if ($statusSources -contains $forbidden) {
              throw "StatusBarCompileTests was contaminated with $forbidden"
            }
          }

          $globalShellCount = @(
            $lines | Where-Object { $_.Trim() -eq 'src/ui/Shell.cpp' }
          ).Count
          if ($globalShellCount -ne 1) {
            throw "Shell.cpp must occur exactly once in CMakeLists.txt; found $globalShellCount"
          }

          if (@($lines | Where-Object { $_.Trim() -eq 'add_executable(ShellContractTests' }).Count -ne 1) {
            throw 'ShellContractTests target must occur exactly once.'
          }

          Write-Host 'CMake target isolation PASS'

      - name: Verify Task 6 shell policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./v032/tests/Ui032Policy.Tests.ps1

          $shell = Get-Content -Raw -LiteralPath 'v032/ui/Shell.cpp'
          $settings = Get-Content -Raw -LiteralPath 'v032/ui/pages/SettingsStubPage.cpp'

          foreach ($token in @(
            'for (const auto& tab : PrimaryTabs())',
            'L"⚙"',
            'Page::Settings',
            'WM_GETMINMAXINFO',
            'ComputeShellLayout',
            'statusBar_.Layout(layout)',
            'ShowPage(Page::Overview, false)'
          )) {
            if (-not $shell.Contains($token)) {
              throw "Shell source missing: $token"
            }
          }

          if ($shell -match 'SIDEBAR|PaintSunset|SunsetBackground') {
            throw 'R4 sidebar/sunset code leaked into Task 6.'
          }

          if ($settings -match 'BS_AUTOCHECKBOX|CreatePushButton') {
            throw 'Settings stub must not expose fake persisted controls.'
          }

          Write-Host 'Task 6 shell policy PASS'

      - name: Prepare source and configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item task6-src,task6-build -Recurse -Force -ErrorAction SilentlyContinue

          ./scripts/Prepare-032Source.ps1 `
            -RepositoryRoot $PWD `
            -Destination "$PWD/task6-src"

          cmake -S task6-src -B task6-build -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) {
            throw 'Task 6 CMake configure failed.'
          }

      - name: Build full app and Task 2-6 tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          cmake --build task6-build --config Release --target `
            DPopCleaner `
            ShellContractTests `
            SessionLogTests `
            StatusBarCompileTests `
            ThemeTests `
            ControlsTests `
            LayoutTests `
            ShellModelTests
          if ($LASTEXITCODE -ne 0) {
            throw 'Task 6 build failed.'
          }

      - name: Run Task 2-6 regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          ctest --test-dir task6-build -C Release `
            -R '^(ShellContractTests|SessionLogTests|StatusBarCompileTests|ThemeTests|ControlsTests|LayoutTests|ShellModelTests)$' `
            --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            throw 'Task 2-6 regression tests failed.'
          }

      - name: Verify 0.3.2 binary identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Resolve-Path 'task6-build/bin/Release/DPopCleaner.exe'
          $info = (Get-Item -LiteralPath $exe).VersionInfo

          if ($info.FileVersion -notlike '0.3.2.1*') {
            throw "Unexpected FileVersion: $($info.FileVersion)"
          }
          if ($info.ProductVersion -notlike '0.3.2 BETA R1*') {
            throw "Unexpected ProductVersion: $($info.ProductVersion)"
          }

          Write-Host "FileVersion=$($info.FileVersion)"
          Write-Host "ProductVersion=$($info.ProductVersion)"

      - name: Capture shell screenshot and verify graceful close
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Path task6-evidence -Force | Out-Null

          $result = ./scripts/Capture-AppScreenshot.ps1 `
            -ExecutablePath 'task6-build/bin/Release/DPopCleaner.exe' `
            -OutputPath 'task6-evidence/DPopCleaner_0.3.2_Task6_Shell.png' `
            -TimeoutSeconds 30

          $result |
            ConvertTo-Json -Depth 8 |
            Set-Content 'task6-evidence/capture-report.json' -Encoding utf8

          if (-not $result.graceful_close) {
            throw 'Task 6 shell did not close gracefully.'
          }
          # Capture-AppScreenshot.ps1 already rejects windows smaller than 800x500.
          # Do not compare captured GetWindowRect pixels with the app's logical
          # 1100x700 client minimum: hosted-runner DPI/non-client scaling can
          # report different screenshot dimensions.
          Write-Host "Captured shell: $($result.width)x$($result.height); graceful_close=$($result.graceful_close)"

          Copy-Item `
            'task6-build/bin/Release/DPopCleaner.exe' `
            'task6-evidence/DPopCleaner_0.3.2_Task6.exe' `
            -Force

      - name: Verify Task 6 evidence files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'task6-evidence/DPopCleaner_0.3.2_Task6_Shell.png',
            'task6-evidence/capture-report.json',
            'task6-evidence/DPopCleaner_0.3.2_Task6.exe'
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing Task 6 evidence: $path"
            }
          }
          $pngSize = (Get-Item -LiteralPath 'task6-evidence/DPopCleaner_0.3.2_Task6_Shell.png').Length
          if ($pngSize -le 10000) {
            throw "Task 6 screenshot is unexpectedly small: $pngSize bytes"
          }
          Write-Host "Task 6 evidence PASS; screenshot bytes=$pngSize"

      - name: Upload Task 6 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: dpopcleaner-0.3.2-task6-shell-v3
          path: task6-evidence/*
          if-no-files-found: error

      - name: Confirm R4 and site are untouched
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $protectedDiff = git diff -- r4 index.html script.js update downloads release-manifest.js
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect protected paths.'
          }
          if ($protectedDiff) {
            Write-Host $protectedDiff
            throw 'Task 6 changed protected R4/site files.'
          }

          Write-Host 'R4 and site remain untouched.'

      - name: Commit Task 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item task6-src,task6-build,task6-evidence `
            -Recurse -Force -ErrorAction SilentlyContinue

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add `
            v032/CMakeLists.txt `
            v032/ui/Shell.h `
            v032/ui/Shell.cpp `
            v032/ui/pages/SettingsStubPage.h `
            v032/ui/pages/SettingsStubPage.cpp `
            v032/tests/ShellContractTests.cpp `
            v032/tests/Ui032Policy.Tests.ps1

          if (git diff --cached --quiet) {
            Write-Host 'Task 6 already matches.'
            exit 0
          }

          git commit -m 'feat: restore real DPopCleaner 0.3.2 shell'
          git push origin HEAD:main
