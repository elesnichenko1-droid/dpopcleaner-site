name: Rev16 Zapret install diagnostic

on:
  push:
    branches:
      - feat/0.4.17-rev16-single-tray-zapret
    paths:
      - '.github/workflows/rev16-zapret-install-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Prepare pinned Flowseal Zapret 1.10.2
        shell: pwsh
        run: ./tools/dpop0417_prepare_zapret.ps1

      - name: Exercise upstream service_install directly with bridge-style stdin
        shell: pwsh
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'rev16-zapret-install-diagnostic'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          $root = (Resolve-Path '_release/0.4.17/third-party/Zapret').Path
          $service = Join-Path $root 'service.bat'
          $variant = Join-Path $root 'service-dpop-direct-install.bat'
          $source = (Get-Content -Raw -LiteralPath $service) -replace "`r`n", "`n"

          $anchor = 'title ZAPRET SERVICE MANAGER v!LOCAL_VERSION!'
          if (([regex]::Matches($source, [regex]::Escape($anchor))).Count -ne 1) {
            throw 'Flowseal manager title anchor is missing or ambiguous.'
          }

          # Preserve all upstream initialization and installation logic. Only bypass the interactive root menu.
          $modified = $source.Replace($anchor, ($anchor + "`ngoto service_install"))
          [IO.File]::WriteAllText($variant, ($modified -replace "`n", "`r`n"), [Text.UTF8Encoding]::new($false))

          function Clear-ZapretState {
            Get-Process winws -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            foreach ($name in @('zapret','WinDivert','WinDivert14')) {
              $arg = '/d /c "sc.exe stop ' + $name + ' >nul 2>&1 & sc.exe delete ' + $name + ' >nul 2>&1 & exit /b 0"'
              Start-Process -FilePath 'cmd.exe' -ArgumentList $arg -Wait -WindowStyle Hidden | Out-Null
            }
            Start-Sleep -Milliseconds 700
          }

          function Get-ZapretServiceState {
            $out = Join-Path $diag 'sc-query-live.txt'
            $err = Join-Path $diag 'sc-query-live-err.txt'
            $p = Start-Process -FilePath 'sc.exe' -ArgumentList @('query','zapret') -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -Wait
            if ($p.ExitCode -ne 0) { return 'MISSING' }
            $text = Get-Content -Raw -LiteralPath $out
            if ($text -match 'RUNNING') { return 'RUNNING' }
            if ($text -match 'START_PENDING') { return 'START_PENDING' }
            if ($text -match 'STOPPED') { return 'STOPPED' }
            return 'EXISTS'
          }

          Clear-ZapretState

          $info = [Diagnostics.ProcessStartInfo]::new()
          $info.FileName = 'cmd.exe'
          $info.Arguments = '/d /c ""' + $variant + '" admin"'
          $info.WorkingDirectory = $root
          $info.UseShellExecute = $false
          $info.CreateNoWindow = $true
          $info.RedirectStandardInput = $true

          $process = [Diagnostics.Process]::new()
          $process.StartInfo = $info
          if (-not $process.Start()) { throw 'Failed to start direct Flowseal manager process.' }

          # Direct :service_install has only the strategy prompt before upstream creates/starts the service.
          $process.StandardInput.WriteLine('1')
          $process.StandardInput.Flush()

          $state = 'TIMEOUT'
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          do {
            $stateNow = Get-ZapretServiceState
            if ($stateNow -eq 'RUNNING') { $state = 'RUNNING'; break }
            if ($process.HasExited) { $state = 'PROCESS_EXIT_' + $process.ExitCode; break }
            Start-Sleep -Milliseconds 250
          } while ([DateTime]::UtcNow -lt $deadline)

          $state | Set-Content -Encoding UTF8 (Join-Path $diag 'direct-install-state.txt')
          "process_exited=$($process.HasExited)" | Set-Content -Encoding UTF8 (Join-Path $diag 'direct-install-process.txt')
          if ($process.HasExited) { "process_exit_code=$($process.ExitCode)" | Add-Content -Encoding UTF8 (Join-Path $diag 'direct-install-process.txt') }
          else { 'process_exit_code=NA' | Add-Content -Encoding UTF8 (Join-Path $diag 'direct-install-process.txt') }

          $qcOut = Join-Path $diag 'direct-install-sc-qc.txt'
          $qcErr = Join-Path $diag 'direct-install-sc-qc-err.txt'
          $qc = Start-Process -FilePath 'sc.exe' -ArgumentList @('qc','zapret') -RedirectStandardOutput $qcOut -RedirectStandardError $qcErr -PassThru -Wait
          "exit_code=$($qc.ExitCode)" | Add-Content -Encoding UTF8 $qcOut

          $regOut = Join-Path $diag 'direct-install-reg.txt'
          $regErr = Join-Path $diag 'direct-install-reg-err.txt'
          $reg = Start-Process -FilePath 'reg.exe' -ArgumentList @('query','HKLM\System\CurrentControlSet\Services\zapret','/v','zapret-discord-youtube') -RedirectStandardOutput $regOut -RedirectStandardError $regErr -PassThru -Wait
          "exit_code=$($reg.ExitCode)" | Add-Content -Encoding UTF8 $regOut

          Get-Process winws -ErrorAction SilentlyContinue |
            Select-Object Id,ProcessName,Path |
            Format-List |
            Out-String |
            Set-Content -Encoding UTF8 (Join-Path $diag 'direct-install-winws.txt')

          Write-Host "REV16_DIRECT_UPSTREAM_INSTALL=$state"
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Milliseconds 300
          }

          Clear-ZapretState
          Remove-Item -Force -ErrorAction SilentlyContinue $variant

          if ($state -ne 'RUNNING') {
            throw "Direct upstream service_install did not reach RUNNING: $state"
          }

      - name: Print diagnostic evidence
        if: always()
        shell: pwsh
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'rev16-zapret-install-diagnostic'
          foreach ($file in @(
            'direct-install-state.txt','direct-install-process.txt',
            'direct-install-sc-qc.txt','direct-install-sc-qc-err.txt',
            'direct-install-reg.txt','direct-install-reg-err.txt','direct-install-winws.txt'
          )) {
            $path = Join-Path $diag $file
            Write-Host "===== $file ====="
            if (Test-Path -LiteralPath $path) { Get-Content -Raw -LiteralPath $path | Write-Host }
            else { Write-Host '<missing>' }
          }

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rev16-zapret-install-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/rev16-zapret-install-diagnostic
          if-no-files-found: error

      - name: Cleanup diagnostic state
        if: always()
        shell: pwsh
        run: |
          Get-Process winws -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          foreach ($name in @('zapret','WinDivert','WinDivert14')) {
            $arg = '/d /c "sc.exe stop ' + $name + ' >nul 2>&1 & sc.exe delete ' + $name + ' >nul 2>&1 & exit /b 0"'
            Start-Process -FilePath 'cmd.exe' -ArgumentList $arg -Wait -WindowStyle Hidden | Out-Null
          }
          Remove-Item -Force -ErrorAction SilentlyContinue '_release/0.4.17/third-party/Zapret/service-dpop-*.bat'
          exit 0
