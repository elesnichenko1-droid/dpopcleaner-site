name: Rev16 Zapret install diagnostic

on:
  push:
    branches:
      - feat/0.4.17-rev16-single-tray-zapret
    paths:
      - '.github/workflows/rev16-zapret-install-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Prepare pinned Flowseal Zapret 1.10.2
        shell: pwsh
        run: ./tools/dpop0417_prepare_zapret.ps1

      - name: Compare redirected stdin and cmd-native pipe
        shell: pwsh
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'rev16-zapret-install-diagnostic'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null

          $root = (Resolve-Path '_release/0.4.17/third-party/Zapret').Path
          $service = Join-Path $root 'service.bat'
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $admin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)

          @(
            "user=$($identity.Name)"
            "admin=$admin"
            "cwd=$((Get-Location).Path)"
            "zapret_root=$root"
            "service_bat=$service"
            "service_bat_exists=$(Test-Path -LiteralPath $service)"
          ) | Set-Content -Encoding UTF8 (Join-Path $diag 'environment.txt')

          function Remove-ZapretState {
            Get-Process winws -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            foreach ($name in @('zapret','WinDivert','WinDivert14')) {
              & sc.exe stop $name *> $null
              & sc.exe delete $name *> $null
            }
            Start-Sleep -Milliseconds 700
          }

          function Wait-ZapretRunning([Diagnostics.Process]$Process, [int]$Seconds) {
            $deadline = [DateTime]::UtcNow.AddSeconds($Seconds)
            do {
              $query = & sc.exe query zapret 2>&1 | Out-String
              $code = $LASTEXITCODE
              if ($code -eq 0 -and $query -match 'RUNNING') { return 'RUNNING' }
              if ($Process -and $Process.HasExited) { return 'PROCESS_EXIT_' + $Process.ExitCode }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $deadline)
            return 'TIMEOUT'
          }

          Remove-ZapretState

          # Probe A: prove whether ordinary cmd SET /P accepts Start-Process redirected stdin.
          $probeBat = Join-Path $diag 'setp-probe.cmd'
          $probeInput = Join-Path $diag 'setp-probe-input.txt'
          $probeOut = Join-Path $diag 'setp-probe-stdout.txt'
          $probeErr = Join-Path $diag 'setp-probe-stderr.txt'
          $probeLines = @(
            '@echo off',
            'set "probe=null"',
            'set /p probe=PROBE:',
            'echo RESULT=[%probe%]',
            'if "%probe%"=="alpha" exit /b 0',
            'exit /b 7'
          )
          [IO.File]::WriteAllText($probeBat, (($probeLines -join "`r`n") + "`r`n"), [Text.Encoding]::ASCII)
          [IO.File]::WriteAllText($probeInput, "alpha`r`n", [Text.Encoding]::ASCII)
          $probeArg = '/d /c ""' + $probeBat + '""'
          $probe = Start-Process -FilePath 'cmd.exe' -ArgumentList $probeArg -RedirectStandardInput $probeInput -RedirectStandardOutput $probeOut -RedirectStandardError $probeErr -PassThru -Wait
          $probeState = if ($probe.ExitCode -eq 0) { 'PASS' } else { 'FAIL_' + $probe.ExitCode }
          "state=$probeState" | Set-Content -Encoding UTF8 (Join-Path $diag 'setp-probe-state.txt')
          Write-Host "REV16_SET_P_REDIRECT_PROBE=$probeState"

          # Probe B: drive the real upstream interactive manager with a native cmd pipe.
          Remove-ZapretState
          $driver = Join-Path $diag 'flowseal-pipe-driver.cmd'
          $pipeOut = Join-Path $diag 'flowseal-pipe-stdout.txt'
          $pipeErr = Join-Path $diag 'flowseal-pipe-stderr.txt'
          $driverLines = @(
            '@echo off',
            '(',
            '  echo 1',
            '  echo 1',
            '  echo x',
            '  echo 0',
            (') | call "' + $service + '" admin')
          )
          [IO.File]::WriteAllText($driver, (($driverLines -join "`r`n") + "`r`n"), [Text.Encoding]::ASCII)
          $driverArg = '/d /c ""' + $driver + '""'
          "cmd.exe $driverArg" | Set-Content -Encoding UTF8 (Join-Path $diag 'flowseal-pipe-command.txt')
          Get-Content -Raw -LiteralPath $driver | Set-Content -Encoding UTF8 (Join-Path $diag 'flowseal-pipe-driver-copy.txt')

          $pipeProcess = $null
          $pipeState = 'START_FAILED'
          try {
            $pipeProcess = Start-Process -FilePath 'cmd.exe' -ArgumentList $driverArg -WorkingDirectory $root -RedirectStandardOutput $pipeOut -RedirectStandardError $pipeErr -PassThru
            $pipeState = Wait-ZapretRunning $pipeProcess 30
          }
          catch {
            ($_ | Out-String) | Set-Content -Encoding UTF8 (Join-Path $diag 'flowseal-pipe-start-exception.txt')
          }

          "state=$pipeState" | Set-Content -Encoding UTF8 (Join-Path $diag 'flowseal-pipe-state.txt')
          if ($pipeProcess) {
            "process_exited=$($pipeProcess.HasExited)" | Set-Content -Encoding UTF8 (Join-Path $diag 'flowseal-pipe-process.txt')
            if ($pipeProcess.HasExited) { "process_exit_code=$($pipeProcess.ExitCode)" | Add-Content -Encoding UTF8 (Join-Path $diag 'flowseal-pipe-process.txt') }
            else { 'process_exit_code=NA' | Add-Content -Encoding UTF8 (Join-Path $diag 'flowseal-pipe-process.txt') }
          }
          Write-Host "REV16_FLOWSEAL_CMD_PIPE=$pipeState"

          $query = & sc.exe query zapret 2>&1 | Out-String
          $queryCode = $LASTEXITCODE
          $query | Set-Content -Encoding UTF8 (Join-Path $diag 'sc-query.txt')
          "exit_code=$queryCode" | Add-Content -Encoding UTF8 (Join-Path $diag 'sc-query.txt')

          $qc = & sc.exe qc zapret 2>&1 | Out-String
          $qcCode = $LASTEXITCODE
          $qc | Set-Content -Encoding UTF8 (Join-Path $diag 'sc-qc.txt')
          "exit_code=$qcCode" | Add-Content -Encoding UTF8 (Join-Path $diag 'sc-qc.txt')

          $registry = & reg.exe query 'HKLM\System\CurrentControlSet\Services\zapret' 2>&1 | Out-String
          $registryCode = $LASTEXITCODE
          $registry | Set-Content -Encoding UTF8 (Join-Path $diag 'service-registry.txt')
          "exit_code=$registryCode" | Add-Content -Encoding UTF8 (Join-Path $diag 'service-registry.txt')

          Get-Process winws -ErrorAction SilentlyContinue |
            Select-Object Id,ProcessName,Path |
            Format-List |
            Out-String |
            Set-Content -Encoding UTF8 (Join-Path $diag 'winws-processes.txt')

          if ($pipeProcess -and -not $pipeProcess.HasExited) {
            Stop-Process -Id $pipeProcess.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Milliseconds 300
          }

      - name: Print preserved diagnostic evidence
        if: always()
        shell: pwsh
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'rev16-zapret-install-diagnostic'
          foreach ($file in @(
            'environment.txt',
            'setp-probe-state.txt','setp-probe-stdout.txt','setp-probe-stderr.txt',
            'flowseal-pipe-command.txt','flowseal-pipe-driver-copy.txt','flowseal-pipe-state.txt','flowseal-pipe-process.txt',
            'flowseal-pipe-stdout.txt','flowseal-pipe-stderr.txt','flowseal-pipe-start-exception.txt',
            'sc-query.txt','sc-qc.txt','service-registry.txt','winws-processes.txt'
          )) {
            $path = Join-Path $diag $file
            Write-Host "===== $file ====="
            if (Test-Path -LiteralPath $path) {
              $text = Get-Content -Raw -LiteralPath $path
              if ($text.Length -gt 12000) { $text = $text.Substring([Math]::Max(0, $text.Length - 12000)) }
              Write-Host $text
            } else {
              Write-Host '<missing>'
            }
          }

          Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY '## Rev16 Zapret stdin A/B diagnostic'
          foreach ($file in @('setp-probe-state.txt','flowseal-pipe-state.txt','sc-query.txt','sc-qc.txt')) {
            $path = Join-Path $diag $file
            Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY "`n### $file`n```text"
            if (Test-Path -LiteralPath $path) { Get-Content -Raw -LiteralPath $path | Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY }
            else { Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY '<missing>' }
            Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY '```'
          }

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rev16-zapret-install-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/rev16-zapret-install-diagnostic
          if-no-files-found: error

      - name: Assert cmd-native pipe reaches RUNNING
        shell: pwsh
        run: |
          $stateFile = Join-Path $env:RUNNER_TEMP 'rev16-zapret-install-diagnostic\flowseal-pipe-state.txt'
          if (-not (Test-Path -LiteralPath $stateFile)) { throw 'Flowseal pipe state file is missing.' }
          $state = (Get-Content -LiteralPath $stateFile | Select-Object -First 1).Trim()
          Write-Host "REV16_FLOWSEAL_CMD_PIPE_ASSERT=$state"
          if ($state -ne 'state=RUNNING') { throw "Cmd-native Flowseal pipe did not reach RUNNING: $state" }

      - name: Cleanup diagnostic services
        if: always()
        shell: pwsh
        run: |
          Get-Process winws -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          foreach ($name in @('zapret','WinDivert','WinDivert14')) {
            & sc.exe stop $name *> $null
            & sc.exe delete $name *> $null
          }
