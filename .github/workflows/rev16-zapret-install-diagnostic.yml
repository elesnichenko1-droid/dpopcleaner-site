name: Rev16 Zapret install diagnostic

on:
  push:
    branches:
      - feat/0.4.17-rev16-single-tray-zapret
    paths:
      - '.github/workflows/rev16-zapret-install-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Prepare pinned Flowseal Zapret 1.10.2
        shell: pwsh
        run: ./tools/dpop0417_prepare_zapret.ps1

      - name: Locate where upstream manager consumes stdin
        shell: pwsh
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'rev16-zapret-install-diagnostic'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          $root = (Resolve-Path '_release/0.4.17/third-party/Zapret').Path
          $service = Join-Path $root 'service.bat'
          $source = (Get-Content -Raw -LiteralPath $service) -replace "`r`n", "`n"

          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $admin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          @(
            "user=$($identity.Name)"
            "admin=$admin"
            "root=$root"
            "service_sha256=$((Get-FileHash -LiteralPath $service -Algorithm SHA256).Hash)"
          ) | Set-Content -Encoding UTF8 (Join-Path $diag 'environment.txt')

          function New-ProbeSnippet([string]$ResultPath) {
            return (@(
              'setlocal EnableDelayedExpansion',
              'set "DPOP_PROBE=EMPTY"',
              'set /p "DPOP_PROBE=PROBE:"',
              ('> "' + $ResultPath + '" echo !DPOP_PROBE!'),
              'exit /b'
            ) -join "`n")
          }

          function Invoke-FlowsealProbe([string]$Name, [string]$Needle) {
            $result = Join-Path $diag ("probe-$Name.txt")
            $variant = Join-Path $root ("service-dpop-probe-$Name.bat")
            $driver = Join-Path $diag ("driver-$Name.cmd")
            $stdout = Join-Path $diag ("stdout-$Name.txt")
            $stderr = Join-Path $diag ("stderr-$Name.txt")

            $index = $source.IndexOf($Needle, [StringComparison]::Ordinal)
            if ($index -lt 0) {
              "MARKER_NOT_FOUND" | Set-Content -Encoding UTF8 $result
              return 'MARKER_NOT_FOUND'
            }
            $second = $source.IndexOf($Needle, $index + $Needle.Length, [StringComparison]::Ordinal)
            if ($second -ge 0) {
              "MARKER_NOT_UNIQUE" | Set-Content -Encoding UTF8 $result
              return 'MARKER_NOT_UNIQUE'
            }

            $snippet = New-ProbeSnippet $result
            $modified = $source.Substring(0, $index + $Needle.Length) + "`n" + $snippet + $source.Substring($index + $Needle.Length)
            [IO.File]::WriteAllText($variant, ($modified -replace "`n", "`r`n"), [Text.Encoding]::UTF8)

            $driverLines = @(
              '@echo off',
              ('(echo MAGIC) | call "' + $variant + '" admin')
            )
            [IO.File]::WriteAllText($driver, (($driverLines -join "`r`n") + "`r`n"), [Text.Encoding]::ASCII)
            $arg = '/d /c ""' + $driver + '""'
            $p = Start-Process -FilePath 'cmd.exe' -ArgumentList $arg -WorkingDirectory $root -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            if (-not $p.WaitForExit(8000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              if (-not (Test-Path -LiteralPath $result)) { 'TIMEOUT' | Set-Content -Encoding UTF8 $result }
            }
            Start-Sleep -Milliseconds 100
            $value = if (Test-Path -LiteralPath $result) { (Get-Content -Raw -LiteralPath $result).Trim() } else { 'NO_RESULT' }
            Remove-Item -Force -ErrorAction SilentlyContinue $variant
            return $value
          }

          # Control: redirected stdin itself works on this runner.
          $control = Join-Path $diag 'control.cmd'
          $controlInput = Join-Path $diag 'control-input.txt'
          $controlOut = Join-Path $diag 'control-stdout.txt'
          $controlErr = Join-Path $diag 'control-stderr.txt'
          $controlLines = @(
            '@echo off',
            'set "DPOP_PROBE=EMPTY"',
            'set /p "DPOP_PROBE=PROBE:"',
            'echo %DPOP_PROBE%'
          )
          [IO.File]::WriteAllText($control, (($controlLines -join "`r`n") + "`r`n"), [Text.Encoding]::ASCII)
          [IO.File]::WriteAllText($controlInput, "MAGIC`r`n", [Text.Encoding]::ASCII)
          $controlArg = '/d /c ""' + $control + '""'
          $cp = Start-Process -FilePath 'cmd.exe' -ArgumentList $controlArg -RedirectStandardInput $controlInput -RedirectStandardOutput $controlOut -RedirectStandardError $controlErr -PassThru -Wait
          $controlValue = (Get-Content -Raw -LiteralPath $controlOut).Trim()

          $probes = [ordered]@{}
          $probes['control'] = $controlValue
          $probes['admin-entry'] = Invoke-FlowsealProbe 'admin-entry' 'if "%1"=="admin" ('
          $probes['after-check-chcp'] = Invoke-FlowsealProbe 'after-check-chcp' '    call :check_command chcp'
          $probes['after-check-find'] = Invoke-FlowsealProbe 'after-check-find' "    call :check_command chcp`n    call :check_command find"
          $probes['after-check-findstr'] = Invoke-FlowsealProbe 'after-check-findstr' "    call :check_command chcp`n    call :check_command find`n    call :check_command findstr"
          $probes['after-check-netsh'] = Invoke-FlowsealProbe 'after-check-netsh' "    call :check_command chcp`n    call :check_command find`n    call :check_command findstr`n    call :check_command netsh"
          $probes['after-load-user-lists'] = Invoke-FlowsealProbe 'after-load-user-lists' "    call :check_command netsh`n    `n    call :load_user_lists"
          $probes['menu-before-status'] = Invoke-FlowsealProbe 'menu-before-status' ":menu`n`ncls"
          $probes['after-ipset-status'] = Invoke-FlowsealProbe 'after-ipset-status' 'call :ipset_switch_status'
          $probes['after-game-status'] = Invoke-FlowsealProbe 'after-game-status' "call :ipset_switch_status`ncall :game_switch_status"
          $probes['after-update-status'] = Invoke-FlowsealProbe 'after-update-status' "call :ipset_switch_status`ncall :game_switch_status`ncall :check_updates_switch_status"
          $probes['after-strategy-status'] = Invoke-FlowsealProbe 'after-strategy-status' "call :ipset_switch_status`ncall :game_switch_status`ncall :check_updates_switch_status`ncall :get_strategy_name"

          $summary = foreach ($entry in $probes.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)"
          }
          $summary | Set-Content -Encoding UTF8 (Join-Path $diag 'probe-summary.txt')
          $summary | ForEach-Object { Write-Host "REV16_STDIN_PROBE $_" }

          if ($controlValue -ne 'MAGIC') {
            throw "Control redirected-stdin probe failed: '$controlValue'"
          }
          exit 0

      - name: Print probe summary
        if: always()
        shell: pwsh
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'rev16-zapret-install-diagnostic'
          foreach ($file in @('environment.txt','probe-summary.txt')) {
            Write-Host "===== $file ====="
            $path = Join-Path $diag $file
            if (Test-Path -LiteralPath $path) { Get-Content -Raw -LiteralPath $path | Write-Host }
            else { Write-Host '<missing>' }
          }

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rev16-zapret-install-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/rev16-zapret-install-diagnostic
          if-no-files-found: error

      - name: Cleanup diagnostic state
        if: always()
        shell: pwsh
        run: |
          Get-Process winws -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          foreach ($name in @('zapret','WinDivert','WinDivert14')) {
            & sc.exe stop $name *> $null
            & sc.exe delete $name *> $null
          }
          Remove-Item -Force -ErrorAction SilentlyContinue '_release/0.4.17/third-party/Zapret/service-dpop-probe-*.bat'
          exit 0
