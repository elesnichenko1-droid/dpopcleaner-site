name: Rev16 apply proven Zapret install fix

on:
  push:
    branches:
      - feat/0.4.17-rev16-single-tray-zapret
    paths:
      - '.github/workflows/rev16-zapret-install-diagnostic.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply minimal direct service_install implementation
        shell: pwsh
        run: |
          $path = 'v0417/src/SimpleUpdate/ZapretEnhancementHost.cs'
          $source = Get-Content -Raw -LiteralPath $path
          $pattern = '(?s)        private void InstallSelectedStrategyUsingUpstreamManager\(\).*?(?=        private static int FindStrategyMenuIndex)'
          $matches = [regex]::Matches($source, $pattern)
          if ($matches.Count -ne 1) { throw "Expected exactly one install method, found $($matches.Count)." }

          $replacement = @'
        private void InstallSelectedStrategyUsingUpstreamManager()
        {
            var selected = ReadSelectedStrategy();
            if (string.IsNullOrWhiteSpace(selected)) throw new InvalidOperationException("Сначала выберите стратегию Zapret.");

            var zapretRoot = GetZapretRoot();
            var service = Path.Combine(zapretRoot, "service.bat");
            if (!File.Exists(service)) throw new FileNotFoundException("service.bat Zapret 1.10.2 не найден.", service);
            var menuIndex = FindStrategyMenuIndex(zapretRoot, selected);
            if (menuIndex <= 0) throw new InvalidOperationException("Выбранная стратегия отсутствует в upstream manager: " + selected);

            var directManager = BuildDirectUpstreamInstallManager(service);
            try
            {
                var info = new ProcessStartInfo("cmd.exe")
                {
                    UseShellExecute = false,
                    CreateNoWindow = true,
                    RedirectStandardInput = true,
                    Arguments = "/d /c \"\"" + directManager + "\" admin\"",
                    WorkingDirectory = zapretRoot
                };

                using (var process = Process.Start(info))
                {
                    if (process == null) throw new InvalidOperationException("Не удалось запустить upstream service.bat.");
                    try
                    {
                        process.StandardInput.WriteLine(menuIndex.ToString());
                        process.StandardInput.Flush();

                        var deadline = DateTime.UtcNow.AddSeconds(15);
                        while (DateTime.UtcNow < deadline)
                        {
                            var state = ZapretRuntimeState.Read(_applicationRoot);
                            if (state.ZapretServiceRunning)
                            {
                                RefreshRuntimeStatus();
                                return;
                            }
                            if (process.HasExited)
                                throw new InvalidOperationException("Upstream service.bat завершился до запуска службы. Стратегия: " + selected + ". Код выхода: " + process.ExitCode);
                            Thread.Sleep(200);
                        }
                        throw new TimeoutException("Upstream service.bat не запустил службу zapret. Стратегия: " + selected + ".");
                    }
                    finally
                    {
                        try { if (!process.HasExited) process.Kill(); } catch { }
                    }
                }
            }
            finally
            {
                try { if (File.Exists(directManager)) File.Delete(directManager); } catch { }
            }
        }

        private static string BuildDirectUpstreamInstallManager(string service)
        {
            var source = File.ReadAllText(service);
            const string anchor = "title ZAPRET SERVICE MANAGER v!LOCAL_VERSION!";
            var first = source.IndexOf(anchor, StringComparison.Ordinal);
            if (first < 0 || source.IndexOf(anchor, first + anchor.Length, StringComparison.Ordinal) >= 0)
                throw new InvalidDataException("Flowseal service manager anchor is missing or ambiguous.");

            var newline = source.IndexOf("\r\n", StringComparison.Ordinal) >= 0 ? "\r\n" : "\n";
            var modified = source.Insert(first + anchor.Length, newline + "goto service_install");
            var directory = Path.GetDirectoryName(service);
            if (string.IsNullOrWhiteSpace(directory)) throw new InvalidDataException("Flowseal service manager directory is invalid.");

            var directManager = Path.Combine(directory, "service-dpop-install-" + Guid.NewGuid().ToString("N") + ".bat");
            File.WriteAllText(directManager, modified, new UTF8Encoding(false));
            return directManager;
        }

'@

          $updated = [regex]::Replace($source, $pattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $replacement }, 1)
          [IO.File]::WriteAllText((Resolve-Path $path), $updated, [Text.UTF8Encoding]::new($false))

          if ($updated -match 'process\.StandardInput\.WriteLine\("1"\)') { throw 'Broken root-menu input is still present.' }
          if ($updated -notmatch 'goto service_install') { throw 'Direct upstream service_install jump is missing.' }

      - name: Run GREEN contract suite
        shell: pwsh
        run: dotnet test v0417/tests/SimpleUpdate.Tests/SimpleUpdate.Tests.csproj -c Release --nologo

      - name: Commit verified implementation and retire temporary workflow
        shell: pwsh
        run: |
          Remove-Item -Force '.github/workflows/rev16-zapret-install-diagnostic.yml'
          git config user.name 'elesnichenko1-droid'
          git config user.email 'elesnichenko1@gmail.com'
          git add v0417/src/SimpleUpdate/ZapretEnhancementHost.cs .github/workflows/rev16-zapret-install-diagnostic.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(rev16): bypass broken Zapret root menu'
          git push origin HEAD:feat/0.4.17-rev16-single-tray-zapret
