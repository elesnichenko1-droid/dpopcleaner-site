name: Rev16 patch Zapret harness async click

on:
  push:
    branches:
      - feat/0.4.17-rev16-single-tray-zapret
    paths:
      - '.github/workflows/rev16-patch-zapret-harness.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/0.4.17-rev16-single-tray-zapret
          fetch-depth: 0
      - name: Replace synchronous BM_CLICK with PostMessage
        shell: pwsh
        run: |
          $path = 'tools/dpop0417_rev16_zapret_functional_smoke.ps1'
          $text = Get-Content -Raw -LiteralPath $path
          $oldImport = '[DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr hwnd, uint msg, IntPtr wp, IntPtr lp);'
          $newImport = $oldImport + "`r`n    [DllImport(\"user32.dll\")] public static extern bool PostMessage(IntPtr hwnd, uint msg, IntPtr wp, IntPtr lp);"
          if (-not $text.Contains($oldImport)) { throw 'SendMessage import anchor missing.' }
          if ($text.Contains('public static extern bool PostMessage')) { throw 'PostMessage already present; refusing duplicate patch.' }
          $text = $text.Replace($oldImport, $newImport)
          $oldClick = '[void][Rev16ZapretNative]::SendMessage($control.Handle,0x00F5,[IntPtr]::Zero,[IntPtr]::Zero)'
          $newClick = 'if (-not [Rev16ZapretNative]::PostMessage($control.Handle,0x00F5,[IntPtr]::Zero,[IntPtr]::Zero)) { throw "Could not queue Zapret click id=$Id." }'
          if (-not $text.Contains($oldClick)) { throw 'Synchronous click anchor missing.' }
          $text = $text.Replace($oldClick, $newClick)
          Set-Content -LiteralPath $path -Value $text -Encoding utf8NoBOM
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $path
          git commit -m 'test(rev16): make Zapret lifecycle clicks nonblocking'
          git push origin HEAD:feat/0.4.17-rev16-single-tray-zapret
