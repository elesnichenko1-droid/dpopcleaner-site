name: DPopCleaner 0.3.5 Candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dpopcleaner-0-3-5-candidate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify 0.3.5 migration and Disk contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/test_dpop035_migrate.py -v
          if ($LASTEXITCODE -ne 0) { throw '0.3.5 migration contract failed.' }
          python tests/test_dpop035_disk_contract.py -v
          if ($LASTEXITCODE -ne 0) { throw '0.3.5 Disk contract failed.' }

      - name: Build and CTest DPopCleaner 0.3.5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'dpop035-output'
          $workspace = Join-Path $env:RUNNER_TEMP 'dpop035-workspace'
          python tools/dpop035_migrate.py --repository $PWD --output $output --workspace $workspace --build
          if ($LASTEXITCODE -ne 0) { throw 'DPopCleaner 0.3.5 migration/build failed.' }
          "DPOP035_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify recovered shell smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:DPOP035_OUTPUT 'artifacts/DPopCleaner.exe'
          $evidence = Join-Path $env:DPOP035_OUTPUT 'evidence/shell'
          ./tools/dpop033_ui_smoke.ps1 -ExePath $exe -OutputDir $evidence

      - name: Verify TreeSize-style Disk UI on controlled fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:DPOP035_OUTPUT 'artifacts/DPopCleaner.exe'
          $evidence = Join-Path $env:DPOP035_OUTPUT 'evidence/disk'
          ./tools/dpop035_disk_smoke.ps1 -ExePath $exe -OutputDir $evidence

      - name: Upload 0.3.5 candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: dpopcleaner-0.3.5-candidate
          path: ${{ runner.temp }}/dpop035-output/*
          if-no-files-found: error
