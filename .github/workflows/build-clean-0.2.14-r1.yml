name: Build CLEAN DPopCleaner 0.2.14 R1

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: clean-dpopcleaner-0-2-14-r1
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2022
    steps:
      - name: Require the main branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Run the clean release workflow from main only.'
          }

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Run release policy tests
        shell: pwsh
        run: ./tests/CleanReleasePolicy.Tests.ps1

      - name: Run website manifest tests
        shell: pwsh
        run: node --test tests/release-manifest.test.cjs

      - name: Verify clean release inputs
        shell: pwsh
        run: |
          Import-Module ./scripts/CleanReleasePolicy.psm1 -Force
          Assert-CleanSource -Path ./downloads/DPopCleaner_0.2.14_BETA.exe
          Assert-CleanInstallerDefinition -Path ./release/DPopCleaner_CLEAN_R1.iss

      - name: Stage standalone application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _release/stage | Out-Null
          Copy-Item -LiteralPath downloads/DPopCleaner_0.2.14_BETA.exe -Destination _release/stage/DPopCleaner.exe -Force

      - name: Import optional code-signing certificate
        id: signing
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64)) {
            'enabled=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host 'No trusted code-signing certificate is configured; the clean BETA will remain unsigned.'
            exit 0
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\dpopcleaner-code-signing.pfx", [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          'enabled=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Locate SignTool
        if: steps.signing.outputs.enabled == 'true'
        id: signtool
        shell: pwsh
        run: |
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $tool) { throw 'signtool.exe not found.' }
          "path=$($tool.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sign staged application
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & '${{ steps.signtool.outputs.path }}' sign /fd SHA256 /f "$env:RUNNER_TEMP\dpopcleaner-code-signing.pfx" /p "$env:CERT_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 _release/stage/DPopCleaner.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '${{ steps.signtool.outputs.path }}' verify /pa /v _release/stage/DPopCleaner.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build clean installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler not found.' }
          Push-Location release
          New-Item -ItemType Directory -Force -Path output | Out-Null
          $sourceExe = (Resolve-Path ../_release/stage/DPopCleaner.exe).Path
          & $compiler "/DSourceExe=$sourceExe" DPopCleaner_CLEAN_R1.iss
          $exitCode = $LASTEXITCODE
          Pop-Location
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Sign clean installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $installer = 'release/output/DPopCleaner_Setup_0.2.14_BETA_CLEAN_R1.exe'
          & '${{ steps.signtool.outputs.path }}' sign /fd SHA256 /f "$env:RUNNER_TEMP\dpopcleaner-code-signing.pfx" /p "$env:CERT_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '${{ steps.signtool.outputs.path }}' verify /pa /v $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate and validate release manifest
        shell: pwsh
        run: |
          Import-Module ./scripts/CleanReleasePolicy.psm1 -Force
          $installer = (Resolve-Path release/output/DPopCleaner_Setup_0.2.14_BETA_CLEAN_R1.exe).Path
          $signed = '${{ steps.signing.outputs.enabled }}' -eq 'true'
          $manifest = New-CleanReleaseManifest -InstallerPath $installer -Signed:$signed
          Assert-CleanReleaseManifest -Manifest $manifest -Published
          $manifest | ConvertTo-Json | Set-Content -LiteralPath update/beta.json -Encoding utf8
          Write-Host "Installer SHA-256: $($manifest.sha256)"
          Write-Host "Installer size: $($manifest.size)"
          Write-Host "Installer signed: $($manifest.signed)"

      - name: Re-run release tests
        shell: pwsh
        run: |
          ./tests/CleanReleasePolicy.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/release-manifest.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create or update prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.2.14-clean-r1'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title 'DPopCleaner 0.2.14 BETA R1 — Clean installer' --notes 'Clean R1 installer containing only DPopCleaner.exe. It does not bundle additional Zapret/WinDivert components. Verify the SHA-256 published on the project website.' --prerelease
          } else {
            gh release edit $tag --title 'DPopCleaner 0.2.14 BETA R1 — Clean installer' --notes 'Clean R1 installer containing only DPopCleaner.exe. It does not bundle additional Zapret/WinDivert components. Verify the SHA-256 published on the project website.' --prerelease
          }
          gh release upload $tag release/output/DPopCleaner_Setup_0.2.14_BETA_CLEAN_R1.exe --clobber

      - name: Commit published manifest
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update/beta.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Publish DPopCleaner 0.2.14 BETA R1 manifest'
            git pull --rebase origin main
            git push origin HEAD:main
          } else {
            Write-Host 'Published manifest is already current.'
          }

      - name: Remove temporary signing certificate
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP\dpopcleaner-code-signing.pfx" -Force -ErrorAction SilentlyContinue

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: DPopCleaner-0.2.14-BETA-CLEAN-R1
          path: |
            release/output/DPopCleaner_Setup_0.2.14_BETA_CLEAN_R1.exe
            update/beta.json

  deploy-site:
    needs: build-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout published main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Stage public website only
        shell: pwsh
        run: ./scripts/Stage-Site.ps1 -Root . -Destination _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
