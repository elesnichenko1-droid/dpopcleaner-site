name: Apply DPopCleaner 0.3.2 Task 8 development visual gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task8:
    runs-on: windows-2022

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Task 7 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          foreach ($path in @(
            'v032/ui/pages/OverviewPage.h',
            'v032/ui/pages/OverviewPage.cpp',
            'v032/tests/OverviewModelTests.cpp',
            'v032/ui/Shell.cpp'
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Task 7 baseline missing: $path"
            }
          }

          if (Test-Path -LiteralPath '.github/workflows/build-dpopcleaner-0.3.2-dev.yml') {
            throw 'Task 8 dev workflow already exists.'
          }

      - name: RED - add Task 8 policy and prove dev workflow is missing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $policyPath = 'v032/tests/Ui032Policy.Tests.ps1'
          $policy = Get-Content -Raw -LiteralPath $policyPath

          if (-not $policy.Contains('# Task 8 development visual gate policy.')) {
              $append = [Text.Encoding]::UTF8.GetString(
                  [Convert]::FromBase64String('')
              )

              $marker = "'Ui032Policy PASS'"
              if (-not $policy.Contains($marker)) {
                  throw 'Ui032Policy PASS marker missing.'
              }

              $policy = $policy.Replace(
                  $marker,
                  $append + "`r`n" + $marker
              )

              Set-Content `
                  -LiteralPath $policyPath `
                  -Value $policy `
                  -Encoding utf8
          }

          $failed = $false
          $failureText = ''

          try {
              ./v032/tests/Ui032Policy.Tests.ps1
          } catch {
              $failed = $true
              $failureText = $_ | Out-String
          }

          if (-not $failed) {
              throw 'RED unexpectedly passed before dev workflow exists.'
          }

          if ($failureText -notmatch '0\.3\.2 dev workflow is missing') {
              throw "RED failed for an unrelated reason:`n$failureText"
          }

          Write-Host 'RED PASS: Task 8 policy correctly requires the missing dev workflow.'
          exit 0

      - name: GREEN - create capture script and permanent dev workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Write-B64([string]$Path,[string]$Data) {
              $dir = Split-Path -Parent $Path
              if ($dir) {
                  New-Item -ItemType Directory -Path $dir -Force | Out-Null
              }
              [IO.File]::WriteAllBytes(
                  $Path,
                  [Convert]::FromBase64String($Data)
              )
          }

          Write-B64 `
              'scripts/Capture-032Shell.ps1' `
              ''

          Write-B64 `
              '.github/workflows/build-dpopcleaner-0.3.2-dev.yml' `
              ''

      - name: Verify Task 8 UI policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./v032/tests/Ui032Policy.Tests.ps1

      - name: Run baseline release policy tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tests/CleanReleasePolicy.Tests.ps1
          ./tests/R3ReleasePolicy.Tests.ps1
          ./tests/R3WorkflowPolicy.Tests.ps1
          node --test tests/release-manifest.test.cjs tests/release-manifest-r3.test.cjs

      - name: Prepare and build Task 8 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item task8-src,task8-build,task8-evidence `
              -Recurse -Force -ErrorAction SilentlyContinue

          ./scripts/Prepare-032Source.ps1 `
              -RepositoryRoot $PWD `
              -Destination "$PWD/task8-src"

          cmake -S task8-src -B task8-build -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'Task 8 CMake configure failed.' }

          cmake --build task8-build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Task 8 Release build failed.' }

          ctest `
              --test-dir task8-build `
              -C Release `
              --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Task 8 CTest failed.' }

      - name: Verify Task 8 binary versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $app = Get-Item 'task8-build/bin/Release/DPopCleaner.exe'
          $updater = Get-Item 'task8-build/bin/Release/DPopUpdater.exe'

          if ($app.VersionInfo.FileVersion -notlike '0.3.2.1*') {
              throw "Unexpected app FileVersion: $($app.VersionInfo.FileVersion)"
          }
          if ($app.VersionInfo.ProductVersion -notlike '0.3.2 BETA R1*') {
              throw "Unexpected app ProductVersion: $($app.VersionInfo.ProductVersion)"
          }
          if ($updater.VersionInfo.FileVersion -notlike '0.3.2.1*') {
              throw "Unexpected updater FileVersion: $($updater.VersionInfo.FileVersion)"
          }

      - name: Run three-state resize and close smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Path task8-evidence -Force | Out-Null

          $report = ./scripts/Capture-032Shell.ps1 `
              -ExecutablePath 'task8-build/bin/Release/DPopCleaner.exe' `
              -OutputDirectory 'task8-evidence'

          if (-not $report.graceful_close) {
              throw 'Task 8 capture report says graceful_close=false.'
          }

          foreach ($path in @(
              'task8-evidence/default-1200x850.png',
              'task8-evidence/minimum-1100x700.png',
              'task8-evidence/maximized.png',
              'task8-evidence/capture-report.json'
          )) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Task 8 evidence missing: $path"
              }
          }

      - name: Confirm no R4 or published site changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $protectedDiff = git diff -- `
              r4 `
              index.html `
              script.js `
              update `
              downloads `
              release-manifest.js

          if ($protectedDiff) {
              Write-Host $protectedDiff
              throw 'Task 8 changed protected R4/site files.'
          }

      - name: Commit Task 8 permanent development workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item task8-src,task8-build,task8-evidence `
              -Recurse -Force -ErrorAction SilentlyContinue

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add `
              '.github/workflows/build-dpopcleaner-0.3.2-dev.yml' `
              'scripts/Capture-032Shell.ps1' `
              'v032/tests/Ui032Policy.Tests.ps1'

          if (git diff --cached --quiet) {
              Write-Host 'Task 8 already matches.'
              exit 0
          }

          git commit -m 'ci: add visual gate for DPopCleaner 0.3.2 shell'
          git push origin HEAD:main
