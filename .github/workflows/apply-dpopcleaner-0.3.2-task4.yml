name: Apply DPopCleaner 0.3.2 Task 4 Midnight theme controls

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task4:
    runs-on: windows-2022

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Task 3 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'v032/ui/ShellModel.cpp',
            'v032/ui/Layout.cpp',
            'v032/tests/ShellModelTests.cpp',
            'v032/tests/LayoutTests.cpp'
          )) {
            if (-not (Test-Path $path)) { throw "Missing Task 2/3 baseline: $path" }
          }
          if (Test-Path v032/ui/Theme.cpp) { throw 'Task 4 precondition failed: Theme.cpp already exists.' }
          if (Test-Path v032/ui/Controls.cpp) { throw 'Task 4 precondition failed: Controls.cpp already exists.' }

      - name: RED - add tests and prove theme controls are missing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Write-B64([string]$Path,[string]$Data) {
            $dir = Split-Path -Parent $Path
            if ($dir) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
            [IO.File]::WriteAllBytes($Path,[Convert]::FromBase64String($Data))
          }

          Write-B64 'v032/tests/ThemeTests.cpp' ''
          Write-B64 'v032/tests/ControlsTests.cpp' ''
          Write-B64 'v032/CMakeLists.txt' ''

          Remove-Item task4-red-src,task4-red-build -Recurse -Force -ErrorAction SilentlyContinue
          ./scripts/Prepare-032Source.ps1 -RepositoryRoot $PWD -Destination "$PWD/task4-red-src"

          $redOutput = @()
          & cmake -S task4-red-src -B task4-red-build -A x64 -DBUILD_TESTING=ON 2>&1 |
            Tee-Object -Variable redOutput
          $redCode = $LASTEXITCODE

          if ($redCode -eq 0) {
            throw 'RED unexpectedly configured before Theme/Controls implementation.'
          }

          $joined = ($redOutput | Out-String)
          if ($joined -notmatch 'Theme\.cpp|Controls\.cpp') {
            throw "RED failed for an unrelated reason. Output:`n$joined"
          }

          Write-Host 'RED PASS: missing Theme/Controls implementation is the expected failure.'
          exit 0

      - name: GREEN - implement Midnight Theme and reusable controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Write-B64([string]$Path,[string]$Data) {
            $dir = Split-Path -Parent $Path
            if ($dir) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
            [IO.File]::WriteAllBytes($Path,[Convert]::FromBase64String($Data))
          }

          Write-B64 'v032/ui/Theme.h' ''
          Write-B64 'v032/ui/Theme.cpp' ''
          Write-B64 'v032/ui/Controls.h' ''
          Write-B64 'v032/ui/Controls.cpp' ''
          Write-B64 'v032/tests/Ui032Policy.Tests.ps1' ''

      - name: Verify 0.3.2 UI policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./v032/tests/Ui032Policy.Tests.ps1

      - name: GREEN - build and run theme control tests plus regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item task4-src,task4-build -Recurse -Force -ErrorAction SilentlyContinue
          ./scripts/Prepare-032Source.ps1 -RepositoryRoot $PWD -Destination "$PWD/task4-src"

          cmake -S task4-src -B task4-build -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }

          cmake --build task4-build --config Release --target ThemeTests ControlsTests LayoutTests ShellModelTests
          if ($LASTEXITCODE -ne 0) { throw 'Task 2-4 test build failed.' }

          ctest --test-dir task4-build -C Release -R '^(ThemeTests|ControlsTests|LayoutTests|ShellModelTests)$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Task 2-4 regression tests failed.' }

      - name: Confirm R4 and site are untouched
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $protectedDiff = git diff -- r4 index.html script.js update downloads release-manifest.js
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect protected paths.' }
          if ($protectedDiff) {
            Write-Host $protectedDiff
            throw 'Task 4 changed protected R4/site files.'
          }

          Write-Host 'R4 and site remain untouched.'

      - name: Commit Task 4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item task4-red-src,task4-red-build,task4-src,task4-build -Recurse -Force -ErrorAction SilentlyContinue

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add `
            v032/CMakeLists.txt `
            v032/ui/Theme.h `
            v032/ui/Theme.cpp `
            v032/ui/Controls.h `
            v032/ui/Controls.cpp `
            v032/tests/ThemeTests.cpp `
            v032/tests/ControlsTests.cpp `
            v032/tests/Ui032Policy.Tests.ps1

          if (git diff --cached --quiet) {
            Write-Host 'Task 4 already matches.'
            exit 0
          }

          git commit -m 'feat: restore DPopCleaner Midnight theme controls'
          git push origin HEAD:main
