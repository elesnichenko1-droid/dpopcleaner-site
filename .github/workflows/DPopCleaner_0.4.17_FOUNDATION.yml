name: DPopCleaner 0.4.17 Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/dpopcleaner-0.4.17-0214
      - fix/restore-0.4.17-simpleupdate
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    runs-on: windows-2022
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize exact current settings screenshot
        shell: pwsh
        run: ./tools/dpop0417_materialize_current_screenshot.ps1

      - name: Verify 0.4.17 foundation contracts
        shell: pwsh
        run: |
          python tests/test_dpop0417_core_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_dpop0417_layout_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_dpop0417_stage_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_dpop0417_workflow_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_dpop0417_disk_smoke_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_dpop0417_restore_smoke_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_dpop0417_installer_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_dpop0417_release_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_dpop0417_zapret_screen_fix_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_dpop0417_zapret_bundle_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_dpop0417_rev7_functional_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run DPop.Common tests
        shell: pwsh
        run: |
          dotnet test v0417/tests/DPop.Common.Tests/DPop.Common.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Disk Analyzer unit tests
        shell: pwsh
        run: |
          dotnet test v0417/tests/DiskAnalyzer.Tests/DiskAnalyzer.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Zapret Screen Fix tests
        shell: pwsh
        run: |
          dotnet test v0417/tests/ZapretScreenFix.Tests/ZapretScreenFix.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build DPop.Common
        shell: pwsh
        run: |
          dotnet build v0417/src/DPop.Common/DPop.Common.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Disk Analyzer
        shell: pwsh
        run: |
          dotnet build v0417/src/DiskAnalyzer/DiskAnalyzer.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Restore Center
        shell: pwsh
        run: |
          dotnet build v0417/src/RestoreCenter/RestoreCenter.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Zapret Screen Fix
        shell: pwsh
        run: |
          dotnet build v0417/src/ZapretScreenFix/ZapretScreenFix.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build SimpleUpdate launcher
        shell: pwsh
        run: |
          dotnet build v0417/src/SimpleUpdate/SimpleUpdate.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare pinned Flowseal Zapret 1.10.2
        shell: pwsh
        run: ./tools/dpop0417_prepare_zapret.ps1

      - name: Stage approved 0.4.17 package payload
        shell: pwsh
        run: ./tools/dpop0417_stage.ps1 -RequireCompanions

      - name: Run authentic Zapret Center staged UI smoke
        shell: pwsh
        run: |
          ./tools/dpop0417_zapret_ui_smoke.ps1 `
            -RootPath '_release/0.4.17/stage' `
            -OutputDir '_release/0.4.17/evidence/zapret-ui'

      - name: Run Disk Analyzer staged UI smoke
        shell: pwsh
        run: |
          ./tools/dpop0417_disk_smoke.ps1 `
            -ExePath '_release/0.4.17/stage/Modules/DiskAnalyzer.exe' `
            -OutputDir '_release/0.4.17/evidence/disk'

      - name: Run Restore Center staged roundtrip smoke
        shell: pwsh
        run: |
          ./tools/dpop0417_restore_smoke.ps1 `
            -ExePath '_release/0.4.17/stage/Modules/RestoreCenter.exe' `
            -OutputDir '_release/0.4.17/evidence/restore'

      - name: Verify staged Zapret runtime and Screen Fix companion
        shell: pwsh
        run: |
          foreach ($required in @(
            '_release/0.4.17/stage/Zapret/service.bat',
            '_release/0.4.17/stage/Zapret/general.bat',
            '_release/0.4.17/stage/Zapret/bin/winws.exe',
            '_release/0.4.17/stage/Zapret/bin/WinDivert.dll',
            '_release/0.4.17/stage/Zapret/bin/WinDivert64.sys',
            '_release/0.4.17/stage/Zapret/.service/version.txt',
            '_release/0.4.17/stage/Modules/ZapretScreenFix.exe',
            '_release/0.4.17/stage/Shell/commands/zapret-screen-fix.json'
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Staged Zapret requirement missing: $required" }
          }
          if ((Get-Content -Raw '_release/0.4.17/stage/Zapret/.service/version.txt').Trim() -ne '1.10.2') { throw 'Staged Flowseal Zapret version is not 1.10.2.' }

      - name: Verify staged original core is byte-identical
        shell: pwsh
        run: |
          $expected = 'efd0eff1f4962319282363fa85595c25e0cebe11'
          $blob = (& git hash-object -- '_release/0.4.17/stage/DPopCleaner.exe').Trim()
          if ($LASTEXITCODE -ne 0 -or $blob -ne $expected) { throw "Staged original core changed: $blob" }
          Write-Host "Immutable original core verified: $blob"

      - name: Build DPopCleaner 0.4.17 installer
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup 6 ISCC.exe was not found on windows-2022.' }
          New-Item -ItemType Directory -Path '_release/0.4.17/installer' -Force | Out-Null
          & $iscc 'release/DPopCleaner_0.4.17.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath '_release/0.4.17/installer/DPopCleaner_Setup_0.4.17.exe' -PathType Leaf)) { throw 'Expected DPopCleaner_Setup_0.4.17.exe was not produced.' }

      - name: Record installer SHA-256
        shell: pwsh
        run: |
          $installer = '_release/0.4.17/installer/DPopCleaner_Setup_0.4.17.exe'
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToUpperInvariant()
          $size = (Get-Item -LiteralPath $installer).Length
          [pscustomobject]@{ file='DPopCleaner_Setup_0.4.17.exe'; sha256=$hash; size=$size } | ConvertTo-Json | Set-Content -LiteralPath '_release/0.4.17/installer/installer-metadata.json' -Encoding utf8
          Write-Host "Installer SHA-256: $hash"
          Write-Host "Installer size: $size"

      - name: Run installed package smoke
        shell: pwsh
        run: |
          ./tools/dpop0417_install_smoke.ps1 `
            -InstallerPath '_release/0.4.17/installer/DPopCleaner_Setup_0.4.17.exe' `
            -OutputDir '_release/0.4.17/evidence/install'

      - name: Run rev.15 installed language-restart bridge and RAM tray smoke
        shell: pwsh
        run: |
          ./tools/dpop0417_rev15_installed_restart_smoke.ps1 `
            -InstallerPath '_release/0.4.17/installer/DPopCleaner_Setup_0.4.17.exe' `
            -OutputDir '_release/0.4.17/evidence/rev15-restart'

      - name: Run rev.16 installed single tray identity smoke
        shell: pwsh
        run: |
          ./tools/dpop0417_rev16_single_tray_smoke.ps1 `
            -InstallerPath '_release/0.4.17/installer/DPopCleaner_Setup_0.4.17.exe' `
            -OutputDir '_release/0.4.17/evidence/rev16-tray'

      - name: Run rev.16 installed Zapret presentation smoke
        shell: pwsh
        run: |
          ./tools/dpop0417_rev16_zapret_presentation_smoke.ps1 `
            -InstallerPath '_release/0.4.17/installer/DPopCleaner_Setup_0.4.17.exe' `
            -OutputDir '_release/0.4.17/evidence/rev16-zapret-presentation'

      - name: Run rev.16 installed Zapret functional smoke
        shell: pwsh
        run: |
          ./tools/dpop0417_rev16_zapret_functional_smoke.ps1 `
            -InstallerPath '_release/0.4.17/installer/DPopCleaner_Setup_0.4.17.exe' `
            -OutputDir '_release/0.4.17/evidence/rev16-zapret-functional'

      - name: Upload 0.4.17 candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: DPopCleaner-0.4.17-candidate-${{ github.run_id }}
          path: |
            _release/0.4.17/stage
            _release/0.4.17/installer
            _release/0.4.17/evidence
          if-no-files-found: error
