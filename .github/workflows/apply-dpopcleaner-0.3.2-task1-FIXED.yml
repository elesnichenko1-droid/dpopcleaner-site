name: Apply DPopCleaner 0.3.2 Task 1 overlay FIXED

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task1:
    runs-on: windows-2022
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Write Task 1 files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Write-B64([string]$Path,[string]$Data) {
            $dir = Split-Path -Parent $Path
            if ($dir) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
            [IO.File]::WriteAllBytes($Path,[Convert]::FromBase64String($Data))
          }
          Write-B64 'v032/Version.h' ''
          Write-B64 'v032/version.rc.in' ''
          Write-B64 'v032/MainWindow.cpp' 'I2luY2x1ZGUgImFwcC9NYWluV2luZG93LmgiCiNpbmNsdWRlICJ1aS9TaGVsbC5oIgoKbmFtZXNwYWNlIGRwb3A6OnVpIHsKaW50IFJ1bihISU5TVEFOQ0UgaW5zdGFuY2UsIGludCBzaG93Q29tbWFuZCkgewogICAgcmV0dXJuIGRwb3A6OnVpOjpzaGVsbDo6UnVuKGluc3RhbmNlLCBzaG93Q29tbWFuZCk7Cn0KfQo='
          Write-B64 'v032/CMakeLists.txt' ''
          Write-B64 'v032/tests/Ui032Policy.Tests.ps1' ''
          Write-B64 'scripts/Prepare-032Source.ps1' ''

      - name: Run 0.3.2 overlay policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./v032/tests/Ui032Policy.Tests.ps1

      - name: Verify prepared 0.3.2 source overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'dpop-032-task1-source'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          ./scripts/Prepare-032Source.ps1 -RepositoryRoot $PWD -Destination $dest
          $version = Get-Content -Raw (Join-Path $dest 'src/core/Version.h')
          $resource = Get-Content -Raw (Join-Path $dest 'resources/version.rc.in')
          $cmake = Get-Content -Raw (Join-Path $dest 'CMakeLists.txt')
          if (-not $version.Contains('0.3.2 BETA R1')) { throw 'Prepared Version.h is not 0.3.2 BETA R1.' }
          if (-not $resource.Contains('FILEVERSION 0,3,2,1')) { throw 'Prepared resource version is wrong.' }
          if (-not $cmake.Contains('project(DPopCleaner VERSION 0.3.2')) { throw 'Prepared CMake project version is wrong.' }
          $inventory = Get-Content -Raw (Join-Path $dest 'v032-overlay-inventory.json') | ConvertFrom-Json
          if (@($inventory).Count -lt 5) { throw 'Overlay inventory is unexpectedly small.' }
          Write-Host 'Task 1 prepared-source verification PASS'

      - name: Confirm stable R4 and site are untouched
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code -- r4 update/beta.json index.html release-manifest.js script.js

      - name: Commit Task 1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v032/Version.h v032/version.rc.in v032/MainWindow.cpp v032/CMakeLists.txt v032/tests/Ui032Policy.Tests.ps1 scripts/Prepare-032Source.ps1
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Task 1 already applied.'; exit 0 }
          git commit -m 'build: establish DPopCleaner 0.3.2 overlay'
          git push origin HEAD:main
