name: DPopCleaner 0.4.17 TDD

on:
  push:
    branches:
      - feat/dpopcleaner-0.4.17-0214
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run 0.4.17 contract tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_dpop0417_*.py; do
            [ -e "$test" ] || continue
            python "$test" -v
          done
