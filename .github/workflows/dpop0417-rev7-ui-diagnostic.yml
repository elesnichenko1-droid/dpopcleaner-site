name: DPopCleaner 0.4.17 rev.7 UI diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frozen-ui-diagnostic:
    runs-on: windows-2022
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
      - name: Dump frozen 0.2.14 controls for rev.7 bridge work
        shell: pwsh
        run: ./tools/dpop0417_rev7_ui_diagnostic.ps1 -ExePath 'downloads/DPopCleaner_0.2.14_BETA.exe'
