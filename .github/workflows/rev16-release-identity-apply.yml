name: Rev16 release identity apply

on:
  push:
    branches:
      - feat/0.4.17-rev16-single-tray-zapret
    paths:
      - '.github/workflows/rev16-release-identity-apply.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/0.4.17-rev16-single-tray-zapret
          fetch-depth: 0

      - name: Apply approved rev.16 release identity
        run: python .github/scripts/rev16_release_identity_apply.py

      - name: Preserve prior release-note guarantees
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('release/RELEASE_NOTES_0.4.17.md')
          text = p.read_text(encoding='utf-8')
          old = 'Installed pixel-smoke проверяет **Light** и **Midnight**, а native и bridge-кнопки больше не должны визуально выбиваться друг из друга.'
          new = old + ' При смене темы Zapret-кнопки сразу перерисовываются в выбранной палитре.'
          if text.count(old) != 1:
              raise SystemExit('release notes visual anchor mismatch')
          text = text.replace(old, new)
          anchor = '- В системном трее остаётся **одна** рабочая DPopCleaner tray-иконка с цифровым процентом ОЗУ.'
          addition = anchor + ' Tray reconciliation продолжает использовать `Shell_NotifyIcon`; после перезапуска core или Explorer canonical identity восстанавливается без второй ghost-иконки.'
          if text.count(anchor) != 1:
              raise SystemExit('release notes tray anchor mismatch')
          p.write_text(text.replace(anchor, addition), encoding='utf-8')
          PY

      - name: Verify release contracts
        run: |
          python tests/test_dpop0417_rev16_release_contract.py -v
          python tests/test_dpop0417_release_contract.py -v
          git diff --check

      - name: Collect verified release materialization
        run: |
          mkdir -p _rev16_release/v0417/src/SimpleUpdate _rev16_release/update _rev16_release/release _rev16_release/.github/workflows _rev16_release/tests
          cp v0417/src/SimpleUpdate/Program.cs _rev16_release/v0417/src/SimpleUpdate/Program.cs
          cp v0417/src/SimpleUpdate/LauncherContext.cs _rev16_release/v0417/src/SimpleUpdate/LauncherContext.cs
          cp version.json _rev16_release/version.json
          cp update/stable.json _rev16_release/update/stable.json
          cp release-manifest.js _rev16_release/release-manifest.js
          cp index.html _rev16_release/index.html
          cp release/RELEASE_NOTES_0.4.17.md _rev16_release/release/RELEASE_NOTES_0.4.17.md
          cp .github/workflows/DPopCleaner_0.4.17_FOUNDATION.yml _rev16_release/.github/workflows/DPopCleaner_0.4.17_FOUNDATION.yml
          cp .github/workflows/publish-dpopcleaner-0.4.17.yml _rev16_release/.github/workflows/publish-dpopcleaner-0.4.17.yml
          cp tests/test_dpop0417_release_contract.py _rev16_release/tests/test_dpop0417_release_contract.py
          cp tests/test_dpop0417_rev16_release_contract.py _rev16_release/tests/test_dpop0417_rev16_release_contract.py

      - name: Upload verified release materialization
        uses: actions/upload-artifact@v4
        with:
          name: rev16-release-materialization-${{ github.run_id }}
          path: _rev16_release
          if-no-files-found: error
          include-hidden-files: true
