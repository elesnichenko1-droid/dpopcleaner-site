name: Rev16 release identity apply

on:
  push:
    branches:
      - feat/0.4.17-rev16-single-tray-zapret
    paths:
      - '.github/workflows/rev16-release-identity-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/0.4.17-rev16-single-tray-zapret
          fetch-depth: 0

      - name: Apply approved rev.16 release identity
        run: python .github/scripts/rev16_release_identity_apply.py

      - name: Preserve prior release-note guarantees
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('release/RELEASE_NOTES_0.4.17.md')
          text = p.read_text(encoding='utf-8')
          old = 'Installed pixel-smoke проверяет **Light** и **Midnight**, а native и bridge-кнопки больше не должны визуально выбиваться друг из друга.'
          new = old + ' При смене темы Zapret-кнопки сразу перерисовываются в выбранной палитре.'
          if text.count(old) != 1:
              raise SystemExit('release notes visual anchor mismatch')
          text = text.replace(old, new)
          anchor = '- В системном трее остаётся **одна** рабочая DPopCleaner tray-иконка с цифровым процентом ОЗУ.'
          addition = anchor + ' Tray reconciliation продолжает использовать `Shell_NotifyIcon`; после перезапуска core или Explorer canonical identity восстанавливается без второй ghost-иконки.'
          if text.count(anchor) != 1:
              raise SystemExit('release notes tray anchor mismatch')
          p.write_text(text.replace(anchor, addition), encoding='utf-8')
          PY

      - name: Verify release contracts before commit
        run: |
          python tests/test_dpop0417_rev16_release_contract.py -v
          python tests/test_dpop0417_release_contract.py -v

      - name: Commit approved release identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            v0417/src/SimpleUpdate/Program.cs \
            v0417/src/SimpleUpdate/LauncherContext.cs \
            version.json update/stable.json release-manifest.js index.html \
            release/RELEASE_NOTES_0.4.17.md \
            .github/workflows/DPopCleaner_0.4.17_FOUNDATION.yml \
            .github/workflows/publish-dpopcleaner-0.4.17.yml \
            tests/test_dpop0417_release_contract.py
          git diff --cached --check
          git commit -m 'release: prepare DPopCleaner 0.4.17 rev.16'
          git push origin HEAD:feat/0.4.17-rev16-single-tray-zapret
