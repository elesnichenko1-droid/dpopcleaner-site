name: Rev16 patch proven Zapret install repair

on:
  push:
    branches:
      - feat/0.4.17-rev16-single-tray-zapret
    paths:
      - '.github/workflows/rev16-patch-zapret-install.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/0.4.17-rev16-single-tray-zapret
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch ZapretEnhancementHost install path
        shell: pwsh
        run: |
          python tools/_tmp_rev16_patch_zapret_install.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- v0417/src/SimpleUpdate/ZapretEnhancementHost.cs
          git commit -m 'fix(rev16): proxy proven broken Zapret install action'
          git push origin HEAD:feat/0.4.17-rev16-single-tray-zapret
