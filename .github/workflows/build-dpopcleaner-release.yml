name: Build and publish DPopCleaner 0.3.1 BETA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "*.cpp"
      - "*.h"
      - "CMakeLists.txt"
      - ".github/workflows/build-dpopcleaner-release.yml"

permissions:
  contents: write

concurrency:
  group: dpopcleaner-0-3-1-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Reconstruct project folders from flat GitHub upload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dirs = @(
            "src/app",
            "src/core",
            "src/modules",
            "src/update",
            "src/updater",
            "resources",
            "release",
            "update"
          )
          foreach ($d in $dirs) {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
          }

          $map = @{
            "MainWindow.cpp"      = "src/app/MainWindow.cpp"
            "MainWindow.h"        = "src/app/MainWindow.h"
            "Logger.cpp"          = "src/core/Logger.cpp"
            "Logger.h"            = "src/core/Logger.h"
            "Paths.cpp"           = "src/core/Paths.cpp"
            "Paths.h"             = "src/core/Paths.h"
            "SystemInfo.cpp"      = "src/modules/SystemInfo.cpp"
            "SystemInfo.h"        = "src/modules/SystemInfo.h"
            "Cleaner.cpp"         = "src/modules/Cleaner.cpp"
            "Cleaner.h"           = "src/modules/Cleaner.h"
            "StartupManager.cpp"  = "src/modules/StartupManager.cpp"
            "StartupManager.h"    = "src/modules/StartupManager.h"
            "DPopGuard.cpp"       = "src/modules/DPopGuard.cpp"
            "DPopGuard.h"         = "src/modules/DPopGuard.h"
            "ZapretManager.cpp"   = "src/modules/ZapretManager.cpp"
            "ZapretManager.h"     = "src/modules/ZapretManager.h"
            "Applications.cpp"    = "src/modules/Applications.cpp"
            "Applications.h"      = "src/modules/Applications.h"
            "UpdateManifest.cpp"  = "src/update/UpdateManifest.cpp"
            "UpdateManifest.h"    = "src/update/UpdateManifest.h"
            "UpdateClient.cpp"    = "src/update/UpdateClient.cpp"
            "UpdateClient.h"      = "src/update/UpdateClient.h"
            "Hash.cpp"            = "src/update/Hash.cpp"
            "Hash.h"              = "src/update/Hash.h"
            "Signature.cpp"       = "src/update/Signature.cpp"
            "Signature.h"         = "src/update/Signature.h"
          }

          $missing = @()
          foreach ($src in $map.Keys) {
            $dst = $map[$src]
            if (Test-Path $dst) {
              Write-Host "Already present: $dst"
            }
            elseif (Test-Path $src) {
              Copy-Item $src $dst -Force
              Write-Host "Restored: $src -> $dst"
            }
            else {
              $missing += $src
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host ""
            Write-Host "Missing required source files:" -ForegroundColor Red
            $missing | ForEach-Object { Write-Host " - $_" -ForegroundColor Red }
            throw "Some C++ source files are missing from the repository."
          }

          @'
          #pragma once
          namespace dpop::version {
          inline constexpr wchar_t kProductName[] = L"DPopCleaner";
          inline constexpr wchar_t kVersion[] = L"0.3.1";
          inline constexpr wchar_t kChannel[] = L"beta";
          inline constexpr int kVersionCode = 301;
          }
          '@ | Set-Content -Encoding utf8 "src/core/Version.h"

          @'
          #pragma once
          namespace dpop::update_config {
          inline constexpr wchar_t kManifestUrl[] =
              L"https://elesnichenko1-droid.github.io/dpopcleaner-site/update/beta.json";
          inline constexpr wchar_t kUserAgent[] = L"DPopCleaner-Updater/0.3.1";
          inline constexpr unsigned long kConnectTimeoutMs = 8000;
          inline constexpr unsigned long kReceiveTimeoutMs = 20000;
          }
          '@ | Set-Content -Encoding utf8 "src/update/UpdateConfig.h"

          @'
          #include "app/MainWindow.h"
          #include <windows.h>
          int WINAPI wWinMain(HINSTANCE instance,HINSTANCE,LPWSTR,int showCommand){
              return dpop::ui::Run(instance,showCommand);
          }
          '@ | Set-Content -Encoding utf8 "src/main.cpp"

          @'
          #include "update/Hash.h"
          #include "update/Signature.h"
          #include <windows.h>
          #include <shellapi.h>
          #include <filesystem>
          #include <string>
          #include <vector>
          #include <algorithm>
          #include <cwctype>

          namespace {
          std::wstring ArgValue(const std::vector<std::wstring>& args,const std::wstring& key){
              for(size_t i=0;i+1<args.size();++i) if(args[i]==key) return args[i+1];
              return {};
          }
          bool HasArg(const std::vector<std::wstring>& args,const std::wstring& key){
              return std::find(args.begin(),args.end(),key)!=args.end();
          }
          bool EqualsNoCase(std::wstring a,std::wstring b){
              std::transform(a.begin(),a.end(),a.begin(),::towlower);
              std::transform(b.begin(),b.end(),b.begin(),::towlower);
              return a==b;
          }
          }

          int WINAPI wWinMain(HINSTANCE,HINSTANCE,LPWSTR,int){
              int argc=0;
              LPWSTR* argv=CommandLineToArgvW(GetCommandLineW(),&argc);
              std::vector<std::wstring> args;
              for(int i=0;i<argc;++i) args.emplace_back(argv[i]);
              LocalFree(argv);

              const auto parentText=ArgValue(args,L"--parent");
              const auto package=ArgValue(args,L"--package");
              const auto expectedHash=ArgValue(args,L"--sha256");
              const auto installArgs=ArgValue(args,L"--args");
              const auto restartPath=ArgValue(args,L"--restart");
              const bool allowUnsigned=HasArg(args,L"--allow-unsigned");
              if(parentText.empty()||package.empty()||expectedHash.empty()) return 2;

              const DWORD parent=static_cast<DWORD>(std::stoul(parentText));
              HANDLE process=OpenProcess(SYNCHRONIZE,FALSE,parent);
              if(process){ WaitForSingleObject(process,30000); CloseHandle(process); }

              std::wstring actualHash,hashError;
              if(!dpop::update::Sha256File(package,actualHash,hashError) ||
                 !EqualsNoCase(actualHash,expectedHash)){
                  MessageBoxW(nullptr,
                      (L"Обновление остановлено: SHA-256 пакета не совпадает.\n"+hashError).c_str(),
                      L"DPopUpdater",MB_ICONERROR);
                  return 3;
              }

              std::wstring sigError;
              if(!allowUnsigned && !dpop::update::VerifyAuthenticode(package,sigError)){
                  MessageBoxW(nullptr,(L"Обновление остановлено.\n"+sigError).c_str(),
                              L"DPopUpdater",MB_ICONERROR);
                  return 4;
              }

              SHELLEXECUTEINFOW sei{};
              sei.cbSize=sizeof(sei);
              sei.fMask=SEE_MASK_NOCLOSEPROCESS;
              sei.lpVerb=L"runas";
              sei.lpFile=package.c_str();
              sei.lpParameters=installArgs.empty()?nullptr:installArgs.c_str();
              sei.nShow=SW_SHOWNORMAL;

              if(!ShellExecuteExW(&sei)){
                  MessageBoxW(nullptr,L"Не удалось запустить установщик обновления.",
                              L"DPopUpdater",MB_ICONERROR);
                  return 5;
              }

              if(sei.hProcess){
                  WaitForSingleObject(sei.hProcess,INFINITE);
                  DWORD exitCode=0;
                  GetExitCodeProcess(sei.hProcess,&exitCode);
                  CloseHandle(sei.hProcess);
                  if(exitCode!=0 && exitCode!=3010) return static_cast<int>(exitCode);
              }

              if(!restartPath.empty() && std::filesystem::exists(restartPath)){
                  ShellExecuteW(nullptr,L"open",restartPath.c_str(),nullptr,nullptr,SW_SHOWNORMAL);
              }
              return 0;
          }
          '@ | Set-Content -Encoding utf8 "src/updater/main.cpp"

          @'
          #include <windows.h>
          1 RT_MANIFEST "app.manifest"
          '@ | Set-Content -Encoding ascii "resources/app.rc"

          @'
          #include <windows.h>
          1 RT_MANIFEST "app.manifest"
          '@ | Set-Content -Encoding ascii "resources/updater.rc"

          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <assemblyIdentity version="1.0.0.0" processorArchitecture="amd64"
                              name="DPopCleaner" type="win32"/>
            <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3">
              <security>
                <requestedPrivileges>
                  <requestedExecutionLevel level="asInvoker" uiAccess="false"/>
                </requestedPrivileges>
              </security>
            </trustInfo>
            <compatibility xmlns="urn:schemas-microsoft-com:compatibility.v1">
              <application>
                <supportedOS Id="{8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a}"/>
              </application>
            </compatibility>
          </assembly>
          '@ | Set-Content -Encoding utf8 "resources/app.manifest"

          @'
          #include <windows.h>
          VS_VERSION_INFO VERSIONINFO
           FILEVERSION 0,3,1,0
           PRODUCTVERSION 0,3,1,0
           FILEFLAGSMASK 0x3fL
          #ifdef _DEBUG
           FILEFLAGS 0x1L
          #else
           FILEFLAGS 0x0L
          #endif
           FILEOS 0x40004L
           FILETYPE 0x1L
           FILESUBTYPE 0x0L
          BEGIN
              BLOCK "StringFileInfo"
              BEGIN
                  BLOCK "040904B0"
                  BEGIN
                      VALUE "CompanyName", "DPopCleaner Project\0"
                      VALUE "FileDescription", "DPopCleaner\0"
                      VALUE "FileVersion", "0.3.1 BETA\0"
                      VALUE "InternalName", "DPopCleaner.exe\0"
                      VALUE "OriginalFilename", "DPopCleaner.exe\0"
                      VALUE "ProductName", "DPopCleaner\0"
                      VALUE "ProductVersion", "0.3.1 BETA\0"
                  END
              END
              BLOCK "VarFileInfo"
              BEGIN
                  VALUE "Translation", 0x0409, 1200
              END
          END
          '@ | Set-Content -Encoding ascii "resources/version.rc.in"

          Write-Host "Project folders reconstructed successfully."

      - name: Configure CMake x64
        shell: pwsh
        run: cmake -S . -B out/build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build out/build --config Release --parallel

      - name: Stage binaries
        shell: pwsh
        run: |
          $cleaner = Get-ChildItem -Recurse -Filter DPopCleaner.exe out/build |
                     Where-Object { $_.FullName -match 'Release' } |
                     Select-Object -First 1
          $updater = Get-ChildItem -Recurse -Filter DPopUpdater.exe out/build |
                     Where-Object { $_.FullName -match 'Release' } |
                     Select-Object -First 1

          if (-not $cleaner -or -not $updater) {
            throw "Built EXE files were not found."
          }

          New-Item -ItemType Directory -Force -Path "_release/stage" | Out-Null
          Copy-Item $cleaner.FullName "_release/stage/DPopCleaner.exe"
          Copy-Item $updater.FullName "_release/stage/DPopUpdater.exe"

      - name: Import code-signing certificate (optional)
        id: signing
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "No signing certificate configured; unsigned BETA will be created."
            exit 0
          }

          $bytes = [Convert]::FromBase64String($env:CERT_PFX_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\dpopcert.pfx",$bytes)
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sign application binaries (optional)
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
                        -Recurse -Filter signtool.exe |
                        Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
                        Sort-Object FullName -Descending |
                        Select-Object -First 1).FullName

          if (-not $signtool) { throw "signtool.exe not found" }

          & $signtool sign /fd SHA256 `
             /f "$env:RUNNER_TEMP\dpopcert.pfx" `
             /p "$env:CERT_PASSWORD" `
             /tr http://timestamp.digicert.com /td SHA256 `
             "_release/stage/DPopCleaner.exe"

          & $signtool sign /fd SHA256 `
             /f "$env:RUNNER_TEMP\dpopcert.pfx" `
             /p "$env:CERT_PASSWORD" `
             /tr http://timestamp.digicert.com /td SHA256 `
             "_release/stage/DPopUpdater.exe"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Generate installer definition
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "_release/output" | Out-Null

          @'
          #define MyAppName "DPopCleaner"
          #define MyAppVersion "0.3.1 BETA"
          #ifndef SourceDir
            #define SourceDir "."
          #endif

          [Setup]
          AppId={{B892E3D2-00CC-4D16-BB22-8B3943D42D15}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion}
          AppPublisher=DPopCleaner Project
          AppPublisherURL=https://elesnichenko1-droid.github.io/dpopcleaner-site/
          AppSupportURL=https://elesnichenko1-droid.github.io/dpopcleaner-site/
          AppUpdatesURL=https://elesnichenko1-droid.github.io/dpopcleaner-site/
          VersionInfoVersion=0.3.1.0
          VersionInfoProductVersion=0.3.1.0
          VersionInfoCompany=DPopCleaner Project
          VersionInfoDescription=DPopCleaner Setup
          VersionInfoProductName=DPopCleaner
          DefaultDirName={autopf}\DPopCleaner
          DefaultGroupName=DPopCleaner
          DisableProgramGroupPage=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          OutputDir=output
          OutputBaseFilename=DPopCleaner_Setup_0.3.1_BETA
          UninstallDisplayIcon={app}\DPopCleaner.exe
          UninstallDisplayName=DPopCleaner 0.3.1 BETA
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          SetupLogging=yes
          CloseApplications=yes
          RestartApplications=no
          AllowNoIcons=yes
          MinVersion=10.0

          [Languages]
          Name: "russian"; MessagesFile: "compiler:Languages\Russian.isl"
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Files]
          Source: "{#SourceDir}\DPopCleaner.exe"; DestDir: "{app}"; Flags: ignoreversion restartreplace
          Source: "{#SourceDir}\DPopUpdater.exe"; DestDir: "{app}"; Flags: ignoreversion restartreplace

          [Tasks]
          Name: "desktopicon"; Description: "Создать ярлык на рабочем столе"; GroupDescription: "Дополнительные ярлыки:"; Flags: unchecked

          [Icons]
          Name: "{autoprograms}\DPopCleaner"; Filename: "{app}\DPopCleaner.exe"; WorkingDir: "{app}"
          Name: "{autodesktop}\DPopCleaner"; Filename: "{app}\DPopCleaner.exe"; WorkingDir: "{app}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\DPopCleaner.exe"; Description: "Запустить DPopCleaner"; Flags: nowait postinstall skipifsilent

          [UninstallDelete]
          Type: filesandordirs; Name: "{localappdata}\DPopCleaner\Updates"
          Type: filesandordirs; Name: "{localappdata}\DPopCleaner\Logs"
          Type: dirifempty; Name: "{localappdata}\DPopCleaner"
          '@ | Set-Content -Encoding utf8 "_release/DPopCleaner.iss"

      - name: Build full installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }

          Push-Location "_release"
          & $iscc "/DSourceDir=$((Resolve-Path 'stage').Path)" "DPopCleaner.iss"
          $exit = $LASTEXITCODE
          Pop-Location

          if ($exit -ne 0) { exit $exit }

      - name: Sign installer (optional)
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
                        -Recurse -Filter signtool.exe |
                        Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
                        Sort-Object FullName -Descending |
                        Select-Object -First 1).FullName

          & $signtool sign /fd SHA256 `
             /f "$env:RUNNER_TEMP\dpopcert.pfx" `
             /p "$env:CERT_PASSWORD" `
             /tr http://timestamp.digicert.com /td SHA256 `
             "_release/output/DPopCleaner_Setup_0.3.1_BETA.exe"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate update manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "update" | Out-Null

          $installer = (Resolve-Path "_release/output/DPopCleaner_Setup_0.3.1_BETA.exe").Path
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $size = (Get-Item $installer).Length
          $repo = "${{ github.repository }}"
          $tag = "v0.3.1-beta"
          $name = [IO.Path]::GetFileName($installer)
          $signed = "${{ steps.signing.outputs.enabled }}" -eq "true"

          $manifest = [ordered]@{
            product = "DPopCleaner"
            channel = "beta"
            version = "0.3.1"
            version_code = 301
            mandatory = $false
            download_url = "https://github.com/$repo/releases/download/$tag/$name"
            sha256 = $hash
            size = $size
            signed = $signed
            available = $true
            notes_url = "https://elesnichenko1-droid.github.io/dpopcleaner-site/"
            install_args = "/SILENT /NORESTART"
          }

          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 "update/beta.json"

          if (-not (Test-Path "update/stable.json")) {
            [ordered]@{
              product = "DPopCleaner"
              channel = "stable"
              version = "0.0.0"
              version_code = 0
              available = $false
            } | ConvertTo-Json | Set-Content -Encoding utf8 "update/stable.json"
          }

          [ordered]@{
            product = "DPopCleaner"
            version = "0.3.1"
            channel = "beta"
            platform = "windows"
            architecture = "x86-64"
            manifest = "./update/beta.json"
          } | ConvertTo-Json | Set-Content -Encoding utf8 "version.json"

          Write-Host "Installer SHA256: $hash"
          Write-Host "Installer size: $size"

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.3.1-beta"

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --title "DPopCleaner 0.3.1 BETA" `
              --notes "Stage 3: полноценный установщик, реальные установленные приложения, штатная деинсталляция, поиск хвостов и система автообновления." `
              --prerelease
          }

          gh release upload $tag `
            "_release/output/DPopCleaner_Setup_0.3.1_BETA.exe" `
            "_release/stage/DPopCleaner.exe" `
            "_release/stage/DPopUpdater.exe" `
            --clobber

      - name: Commit update metadata
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add update/beta.json update/stable.json version.json
          git diff --cached --quiet

          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish DPopCleaner 0.3.1 update manifest"
            git pull --rebase origin main
            git push origin HEAD:main
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DPopCleaner-0.3.1-BETA
          path: |
            _release/output/DPopCleaner_Setup_0.3.1_BETA.exe
            _release/stage/DPopCleaner.exe
            _release/stage/DPopUpdater.exe
            update/beta.json
