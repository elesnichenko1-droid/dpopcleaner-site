name: Build, release and deploy DPopCleaner 0.3.1 Stage 3 R2

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dpopcleaner-0-3-1-stage3-r2
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Reconstruct project tree from flat repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dirs = @("src/app","src/core","src/modules","src/update","src/updater","resources","update")
          foreach ($d in $dirs) { New-Item -ItemType Directory -Force -Path $d | Out-Null }

          $map = @{
            "main.cpp"            = "src/main.cpp"
            "MainWindow.cpp"      = "src/app/MainWindow.cpp"
            "MainWindow.h"        = "src/app/MainWindow.h"
            "Logger.cpp"          = "src/core/Logger.cpp"
            "Logger.h"            = "src/core/Logger.h"
            "Paths.cpp"           = "src/core/Paths.cpp"
            "Paths.h"             = "src/core/Paths.h"
            "SystemInfo.cpp"      = "src/modules/SystemInfo.cpp"
            "SystemInfo.h"        = "src/modules/SystemInfo.h"
            "Cleaner.cpp"         = "src/modules/Cleaner.cpp"
            "Cleaner.h"           = "src/modules/Cleaner.h"
            "StartupManager.cpp"  = "src/modules/StartupManager.cpp"
            "StartupManager.h"    = "src/modules/StartupManager.h"
            "DPopGuard.cpp"       = "src/modules/DPopGuard.cpp"
            "DPopGuard.h"         = "src/modules/DPopGuard.h"
            "ZapretManager.cpp"   = "src/modules/ZapretManager.cpp"
            "ZapretManager.h"     = "src/modules/ZapretManager.h"
            "Applications.cpp"    = "src/modules/Applications.cpp"
            "Applications.h"      = "src/modules/Applications.h"
            "UpdateManifest.cpp"  = "src/update/UpdateManifest.cpp"
            "UpdateManifest.h"    = "src/update/UpdateManifest.h"
            "UpdateClient.cpp"    = "src/update/UpdateClient.cpp"
            "UpdateClient.h"      = "src/update/UpdateClient.h"
            "Hash.cpp"            = "src/update/Hash.cpp"
            "Hash.h"              = "src/update/Hash.h"
            "Signature.cpp"       = "src/update/Signature.cpp"
            "Signature.h"         = "src/update/Signature.h"
            "UpdaterMain.cpp"     = "src/updater/main.cpp"
          }

          $missing = @()
          foreach ($src in $map.Keys) {
            $dst = $map[$src]
            if (Test-Path $src) {
              Copy-Item $src $dst -Force
              Write-Host "Patched: $src -> $dst"
            } elseif (Test-Path $dst) {
              Write-Host "Using repository copy: $dst"
            } else {
              $missing += $src
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Missing source files:" -ForegroundColor Red
            $missing | ForEach-Object { Write-Host " - $_" -ForegroundColor Red }
            throw "Required DPopCleaner source files are missing."
          }

          @'
          #pragma once
          namespace dpop::version {
          inline constexpr wchar_t kProductName[] = L"DPopCleaner";
          inline constexpr wchar_t kVersion[] = L"0.3.1";
          inline constexpr wchar_t kChannel[] = L"beta";
          inline constexpr int kVersionCode = 3011;
          inline constexpr int kRevision = 2;
          }
          '@ | Set-Content -Encoding utf8 "src/core/Version.h"

          @'
          #pragma once
          namespace dpop::update_config {
          inline constexpr wchar_t kManifestUrl[] = L"https://elesnichenko1-droid.github.io/dpopcleaner-site/update/beta.json";
          inline constexpr wchar_t kUserAgent[] = L"DPopCleaner-Updater/0.3.1-stage3-r2";
          inline constexpr unsigned long kConnectTimeoutMs = 8000;
          inline constexpr unsigned long kReceiveTimeoutMs = 30000;
          }
          '@ | Set-Content -Encoding utf8 "src/update/UpdateConfig.h"

          if (Test-Path "dpopcleaner.ico") {
            Copy-Item "dpopcleaner.ico" "resources/dpopcleaner.ico" -Force
            @'
          #include <windows.h>
          101 ICON "dpopcleaner.ico"
          '@ | Set-Content -Encoding ascii "resources/app.rc"
            @'
          #include <windows.h>
          101 ICON "dpopcleaner.ico"
          '@ | Set-Content -Encoding ascii "resources/updater.rc"
          } else {
            '#include <windows.h>' | Set-Content -Encoding ascii "resources/app.rc"
            '#include <windows.h>' | Set-Content -Encoding ascii "resources/updater.rc"
          }

          @'
          #include <windows.h>
          VS_VERSION_INFO VERSIONINFO
           FILEVERSION 0,3,1,1
           PRODUCTVERSION 0,3,1,1
           FILEFLAGSMASK 0x3fL
          #ifdef _DEBUG
           FILEFLAGS 0x1L
          #else
           FILEFLAGS 0x0L
          #endif
           FILEOS 0x40004L
           FILETYPE 0x1L
           FILESUBTYPE 0x0L
          BEGIN
              BLOCK "StringFileInfo"
              BEGIN
                  BLOCK "041904B0"
                  BEGIN
                      VALUE "CompanyName", "DPopCleaner Project\0"
                      VALUE "FileDescription", "DPopCleaner Stage 3\0"
                      VALUE "FileVersion", "0.3.1.1\0"
                      VALUE "InternalName", "DPopCleaner.exe\0"
                      VALUE "OriginalFilename", "DPopCleaner.exe\0"
                      VALUE "ProductName", "DPopCleaner\0"
                      VALUE "ProductVersion", "0.3.1 BETA Stage 3 R2\0"
                  END
              END
              BLOCK "VarFileInfo"
              BEGIN
                  VALUE "Translation", 0x0419, 1200
              END
          END
          '@ | Set-Content -Encoding ascii "resources/version.rc.in"

      - name: Configure CMake x64
        shell: pwsh
        run: cmake -S . -B out/build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build out/build --config Release --parallel

      - name: Stage binaries
        shell: pwsh
        run: |
          $cleaner = Get-ChildItem -Recurse -Filter DPopCleaner.exe out/build | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          $updater = Get-ChildItem -Recurse -Filter DPopUpdater.exe out/build | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $cleaner -or -not $updater) { throw "Built EXE files were not found." }
          New-Item -ItemType Directory -Force -Path "_release/stage" | Out-Null
          Copy-Item $cleaner.FullName "_release/stage/DPopCleaner.exe"
          Copy-Item $updater.FullName "_release/stage/DPopUpdater.exe"

      - name: Import code-signing certificate (optional)
        id: signing
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "No signing certificate configured; unsigned BETA will be created."
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:CERT_PFX_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\dpopcert.pfx", $bytes)
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sign application binaries (optional)
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          foreach ($file in @("_release/stage/DPopCleaner.exe", "_release/stage/DPopUpdater.exe")) {
            & $signtool sign /fd SHA256 /f "$env:RUNNER_TEMP\dpopcert.pfx" /p "$env:CERT_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Generate full installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "_release/output" | Out-Null
          @'
          #define MyAppName "DPopCleaner"
          #define MyAppVersion "0.3.1 BETA"
          #ifndef SourceDir
            #define SourceDir "."
          #endif

          [Setup]
          AppId={{B892E3D2-00CC-4D16-BB22-8B3943D42D15}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion}
          AppPublisher=DPopCleaner Project
          AppPublisherURL=https://elesnichenko1-droid.github.io/dpopcleaner-site/
          AppSupportURL=https://elesnichenko1-droid.github.io/dpopcleaner-site/
          AppUpdatesURL=https://elesnichenko1-droid.github.io/dpopcleaner-site/
          VersionInfoVersion=0.3.1.1
          VersionInfoProductVersion=0.3.1.1
          VersionInfoCompany=DPopCleaner Project
          VersionInfoDescription=DPopCleaner Stage 3 Setup
          VersionInfoProductName=DPopCleaner
          DefaultDirName={autopf}\DPopCleaner
          DefaultGroupName=DPopCleaner
          DisableProgramGroupPage=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          OutputDir=output
          OutputBaseFilename=DPopCleaner_Setup_0.3.1_BETA
          UninstallDisplayIcon={app}\DPopCleaner.exe
          UninstallDisplayName=DPopCleaner 0.3.1 BETA
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          SetupLogging=yes
          CloseApplications=yes
          RestartApplications=no
          AllowNoIcons=yes
          MinVersion=10.0

          [Languages]
          Name: "russian"; MessagesFile: "compiler:Languages\Russian.isl"
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Files]
          Source: "{#SourceDir}\DPopCleaner.exe"; DestDir: "{app}"; Flags: ignoreversion restartreplace
          Source: "{#SourceDir}\DPopUpdater.exe"; DestDir: "{app}"; Flags: ignoreversion restartreplace

          [Tasks]
          Name: "desktopicon"; Description: "Создать ярлык на рабочем столе"; GroupDescription: "Дополнительные ярлыки:"; Flags: unchecked

          [Icons]
          Name: "{autoprograms}\DPopCleaner"; Filename: "{app}\DPopCleaner.exe"; WorkingDir: "{app}"
          Name: "{autodesktop}\DPopCleaner"; Filename: "{app}\DPopCleaner.exe"; WorkingDir: "{app}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\DPopCleaner.exe"; Description: "Запустить DPopCleaner"; Flags: nowait postinstall skipifsilent

          [UninstallDelete]
          Type: filesandordirs; Name: "{localappdata}\DPopCleaner\Updates"
          Type: filesandordirs; Name: "{localappdata}\DPopCleaner\Logs"
          Type: dirifempty; Name: "{localappdata}\DPopCleaner"
          '@ | Set-Content -Encoding utf8 "_release/DPopCleaner.iss"

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          Push-Location "_release"
          & $iscc "/DSourceDir=$((Resolve-Path 'stage').Path)" "DPopCleaner.iss"
          $exit = $LASTEXITCODE
          Pop-Location
          if ($exit -ne 0) { exit $exit }

      - name: Sign installer (optional)
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /f "$env:RUNNER_TEMP\dpopcert.pfx" /p "$env:CERT_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 "_release/output/DPopCleaner_Setup_0.3.1_BETA.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate update manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "update" | Out-Null
          $installer = (Resolve-Path "_release/output/DPopCleaner_Setup_0.3.1_BETA.exe").Path
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $size = (Get-Item $installer).Length
          $repo = "${{ github.repository }}"
          $tag = "v0.3.1-beta"
          $name = [IO.Path]::GetFileName($installer)
          $signed = "${{ steps.signing.outputs.enabled }}" -eq "true"
          [ordered]@{
            product = "DPopCleaner"
            channel = "beta"
            version = "0.3.1"
            version_code = 3011
            revision = 2
            mandatory = $false
            download_url = "https://github.com/$repo/releases/download/$tag/$name"
            sha256 = $hash
            size = $size
            signed = $signed
            available = $true
            notes_url = "https://elesnichenko1-droid.github.io/dpopcleaner-site/"
            install_args = "/SILENT /NORESTART"
          } | ConvertTo-Json | Set-Content -Encoding utf8 "update/beta.json"
          [ordered]@{
            product = "DPopCleaner"
            version = "0.3.1"
            version_code = 3011
            revision = 2
            channel = "beta"
            platform = "windows"
            architecture = "x86-64"
            manifest = "./update/beta.json"
          } | ConvertTo-Json | Set-Content -Encoding utf8 "version.json"
          Write-Host "Installer SHA256: $hash"

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.3.1-beta"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "DPopCleaner 0.3.1 BETA — Stage 3" --notes "Stage 3 Revision 2: возвращена полноценная концепция DPopCleaner, реальные приложения, DPopGuard 2, очистка, автозагрузка, Zapret Center и обновления." --prerelease
          }
          gh release upload $tag "_release/output/DPopCleaner_Setup_0.3.1_BETA.exe" "_release/stage/DPopCleaner.exe" "_release/stage/DPopUpdater.exe" --clobber

      - name: Commit update metadata
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/beta.json version.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish DPopCleaner 0.3.1 Stage 3 R2 manifest"
            git pull --rebase origin main
            git push origin HEAD:main
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DPopCleaner-0.3.1-Stage3-R2
          path: |
            _release/output/DPopCleaner_Setup_0.3.1_BETA.exe
            _release/stage/DPopCleaner.exe
            _release/stage/DPopUpdater.exe
            update/beta.json

  deploy-site:
    name: Deploy updated website
    needs: build-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Stage public website
        shell: bash
        run: |
          set -e
          rm -rf _site
          mkdir -p _site/update
          cp index.html _site/
          cp styles.css _site/
          cp script.js _site/
          cp dpopcleaner-icon.png _site/
          cp version.json _site/
          cp update/beta.json _site/update/
          if [ -f update/stable.json ]; then cp update/stable.json _site/update/; fi
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
