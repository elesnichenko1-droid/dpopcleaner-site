name: Apply DPopCleaner 0.3.2 Task 2 navigation model FIXED

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task2:
    runs-on: windows-2022
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Task 1 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path v032/Version.h)) { throw 'Task 1 overlay missing.' }
          if (-not (Test-Path scripts/Prepare-032Source.ps1)) { throw 'Prepare-032Source.ps1 missing.' }
          if (-not (Select-String -Path v032/Version.h -SimpleMatch '0.3.2 BETA R1')) { throw 'Wrong 0.3.2 baseline.' }

      - name: RED - add test and prove model is missing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Write-B64([string]$Path,[string]$Data) {
            $dir = Split-Path -Parent $Path
            if ($dir) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
            [IO.File]::WriteAllBytes($Path,[Convert]::FromBase64String($Data))
          }
          Write-B64 'v032/tests/ShellModelTests.cpp' ''
          Write-B64 'v032/CMakeLists.txt' ''

          if (Test-Path v032/ui/ShellModel.h) { throw 'RED precondition failed: ShellModel.h already exists.' }
          if (Test-Path v032/ui/ShellModel.cpp) { throw 'RED precondition failed: ShellModel.cpp already exists.' }

          Remove-Item task2-red-src,task2-red-build -Recurse -Force -ErrorAction SilentlyContinue
          ./scripts/Prepare-032Source.ps1 -RepositoryRoot $PWD -Destination "$PWD/task2-red-src"
          cmake -S task2-red-src -B task2-red-build -A x64 -DBUILD_TESTING=ON 2>&1 | Tee-Object -Variable redOutput
          $redCode = $LASTEXITCODE
          if ($redCode -eq 0) {
            throw 'RED phase unexpectedly configured successfully before ShellModel implementation.'
          }
          $joined = ($redOutput | Out-String)
          if ($joined -notmatch 'ShellModel') {
            throw "RED failed for an unrelated reason. Output:`n$joined"
          }
          Write-Host 'RED PASS: test/build correctly fails because ShellModel implementation is absent.'
          exit 0

      - name: GREEN - implement ShellModel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Write-B64([string]$Path,[string]$Data) {
            $dir = Split-Path -Parent $Path
            if ($dir) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
            [IO.File]::WriteAllBytes($Path,[Convert]::FromBase64String($Data))
          }
          Write-B64 'v032/ui/ShellModel.h' ''
          Write-B64 'v032/ui/ShellModel.cpp' ''

      - name: Verify navigation source policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $impl = Get-Content -Raw v032/ui/ShellModel.cpp
          $test = Get-Content -Raw v032/tests/ShellModelTests.cpp
          $required = @('Обзор','Очистка','ОЗУ','DPopGuard','Диск','Приложения','Windows','Дубликаты','Инструменты','Zapret')
          foreach ($label in $required) {
            if (-not $impl.Contains('L"' + $label + '"')) { throw "Missing tab: $label" }
          }
          if ($impl.Contains('Page::Settings')) { throw 'Settings must not appear in the primary tab table.' }
          if (-not $test.Contains('tabs.size() == 10')) { throw 'Test does not verify exact tab count.' }
          if (-not $test.Contains('1000 + static_cast<int>(i)')) { throw 'Test does not verify command IDs.' }
          Write-Host 'Navigation source policy PASS'

      - name: GREEN - prepare, configure, build and run ShellModelTests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item task2-src,task2-build -Recurse -Force -ErrorAction SilentlyContinue
          ./scripts/Prepare-032Source.ps1 -RepositoryRoot $PWD -Destination "$PWD/task2-src"
          cmake -S task2-src -B task2-build -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }
          cmake --build task2-build --config Release --target ShellModelTests
          if ($LASTEXITCODE -ne 0) { throw 'ShellModelTests build failed.' }
          ctest --test-dir task2-build -C Release -R '^ShellModelTests$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'ShellModelTests failed.' }

      - name: Confirm R4 and site are untouched
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changed = @(git status --short)
          $allowedPrefixes = @('?? task2-', '?? v032/', ' M v032/', ' M scripts/')
          foreach ($line in $changed) {
            if ($line -match '(^|\s)(r4/|index\.html|script\.js|update/|downloads/|release-manifest\.js)') {
              throw "Stable/site file changed unexpectedly: $line"
            }
          }
          git diff -- r4 index.html script.js update downloads release-manifest.js
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect protected paths.' }

      - name: Commit Task 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item task2-red-src,task2-red-build,task2-src,task2-build -Recurse -Force -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v032/CMakeLists.txt v032/ui/ShellModel.h v032/ui/ShellModel.cpp v032/tests/ShellModelTests.cpp
          if (git diff --cached --quiet) {
            Write-Host 'Task 2 already matches.'
            exit 0
          }
          git commit -m 'feat: define DPopCleaner 0.3.2 navigation model'
          git push origin HEAD:main
