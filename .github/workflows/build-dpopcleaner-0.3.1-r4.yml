name: Build, verify, release and deploy DPopCleaner 0.3.1 R4

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dpopcleaner-0-3-1-r4
  cancel-in-progress: false

env:
  R4_TAG: v0.3.1-beta-r4
  R4_ASSET: DPopCleaner_Setup_0.3.1_BETA_R4.exe
  ZAPRET_ARCHIVE_URL: https://github.com/Flowseal/zapret-discord-youtube/releases/download/1.10.1/zapret-discord-youtube-1.10.1.zip
  ZAPRET_ARCHIVE_SHA256: F748D61FEC75E4EDC992CB5B09D554E914197C68C690384ACEB61F143D8F76C9
  ZAPRET_LICENSE_URL: https://raw.githubusercontent.com/Flowseal/zapret-discord-youtube/1.10.1/LICENSE.txt
  ZAPRET_LICENSE_SHA256: FE3983A1E91206AD1A530BCFAE01FAD207020CB61882EDD62C1E3CB5F8D5D430

jobs:
  build-verify:
    runs-on: windows-2022
    steps:
      - name: Checkout verified base
        uses: actions/checkout@v5

      - name: Baseline release policy tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tests/CleanReleasePolicy.Tests.ps1
          ./tests/R3ReleasePolicy.Tests.ps1
          ./tests/R3WorkflowPolicy.Tests.ps1
          node --test tests/release-manifest.test.cjs tests/release-manifest-r3.test.cjs

      - name: Download and verify Zapret 1.10.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path inputs -Force | Out-Null
          Invoke-WebRequest -Uri $env:ZAPRET_ARCHIVE_URL -OutFile inputs/zapret-1.10.1.zip
          Invoke-WebRequest -Uri $env:ZAPRET_LICENSE_URL -OutFile inputs/zapret-LICENSE.txt
          if ((Get-FileHash inputs/zapret-1.10.1.zip -Algorithm SHA256).Hash -ne $env:ZAPRET_ARCHIVE_SHA256) { throw 'Zapret archive SHA-256 mismatch.' }
          if ((Get-FileHash inputs/zapret-LICENSE.txt -Algorithm SHA256).Hash -ne $env:ZAPRET_LICENSE_SHA256) { throw 'Zapret license SHA-256 mismatch.' }

      - name: Prepare R4 source from verified R3 core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Prepare-R3Source.ps1 -RepositoryRoot $PWD -Destination "$PWD/r4-source"
          New-Item -ItemType Directory -Path r4-overrides -Force | Out-Null
          function Write-Base64File([string]$Base64,[string]$Path){ [IO.File]::WriteAllBytes($Path,[Convert]::FromBase64String($Base64)) }

          if (Test-Path r4/MainWindow.cpp) { Copy-Item r4/MainWindow.cpp r4-overrides/MainWindow.cpp -Force }
          else { Write-Base64File '' r4-overrides/MainWindow.cpp }
          if (Test-Path r4/Version.h) { Copy-Item r4/Version.h r4-overrides/Version.h -Force }
          else { Write-Base64File '' r4-overrides/Version.h }
          if (Test-Path r4/version.rc.in) { Copy-Item r4/version.rc.in r4-overrides/version.rc.in -Force }
          else { Write-Base64File '' r4-overrides/version.rc.in }
          if (Test-Path r4/DPopCleaner_0.3.1_R4.iss) { Copy-Item r4/DPopCleaner_0.3.1_R4.iss r4-overrides/DPopCleaner_0.3.1_R4.iss -Force }
          else { Write-Base64File '' r4-overrides/DPopCleaner_0.3.1_R4.iss }
          Write-Base64File 'IyBEUG9wQ2xlYW5lciAwLjMuMSBCRVRBIFI0ClI0IGtlZXBzIHRoZSB2ZXJpZmllZCBSMyBmdW5jdGlvbmFsIG1vZHVsZXMgYW5kIHJlc3RvcmVzIHRoZSBjb21wYWN0IDAuMi4xNC1pbnNwaXJlZCBpbnRlcmZhY2UuClRoZSBpbW11dGFibGUgUjMgcmVsZWFzZSByZW1haW5zIHRoZSByb2xsYmFjayBwb2ludC4K' r4-overrides/README.md

          Copy-Item r4-overrides/MainWindow.cpp r4-source/src/app/MainWindow.cpp -Force
          Copy-Item r4-overrides/Version.h r4-source/src/core/Version.h -Force
          Copy-Item r4-overrides/version.rc.in r4-source/resources/version.rc.in -Force

      - name: Verify restored UI policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ui = Get-Content -Raw r4-source/src/app/MainWindow.cpp
          $required = @(
            'case WM_SIZE:','LayoutControls(hwnd)','ID_CARD_CPU','ID_CARD_RAM','ID_CARD_DISK',
            'ListView_SetImageList','displayIcon','TOOLTIPS_CLASSW','PaintSunsetBackground','0.3.1 BETA R4',
            'dpop::cleaner::CleanUserTemp()','dpop::guard::QuickScan()','dpop::apps::EnumerateInstalledApps()',
            'dpop::zapret::QueryStatus()','dpop::update::CheckForUpdates()','case WM_CLOSE:'
          )
          foreach ($needle in $required) { if (-not $ui.Contains($needle)) { throw "R4 UI policy missing: $needle" } }
          if ($ui.Contains('~WS_MAXIMIZEBOX')) { throw 'R4 must support maximize.' }
          if ($ui.Contains('WS_EX_CLIENTEDGE, L"EDIT"')) { throw 'R4 must not use the old client-edge text slab.' }

      - name: Configure MSVC x64
        shell: pwsh
        run: cmake -S r4-source -B r4-build -A x64 -DBUILD_TESTING=ON

      - name: Build R4
        shell: pwsh
        run: cmake --build r4-build --config Release --parallel

      - name: Run C++ tests
        shell: pwsh
        run: ctest --test-dir r4-build -C Release --output-on-failure

      - name: Optionally sign application binaries
        id: sign-apps
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          "signed=false" | Out-File $env:GITHUB_OUTPUT -Append
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            Write-Host 'Signing secrets are not configured; producing unsigned BETA.'
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP 'dpop-r4-signing.pfx'
          [IO.File]::WriteAllBytes($certificate,[Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -File -Recurse |
           Where-Object { $_.FullName -like '*\x64\*' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found.' }
          foreach ($binary in @('r4-build/bin/Release/DPopCleaner.exe','r4-build/bin/Release/DPopUpdater.exe')) {
            & $signtool.FullName sign /fd SHA256 /f $certificate /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $binary
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $binary" }
          }
          "signed=true" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Verify binary identity and manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          $app=(Resolve-Path r4-build/bin/Release/DPopCleaner.exe).Path
          $updater=(Resolve-Path r4-build/bin/Release/DPopUpdater.exe).Path
          foreach ($x in @(
            @{path=$app;internal='DPopCleaner.exe';description='DPopCleaner Windows utility'},
            @{path=$updater;internal='DPopUpdater.exe';description='DPopCleaner secure updater'})) {
            $info=(Get-Item $x.path).VersionInfo
            if ($info.FileVersion -ne '0.3.1.4' -or $info.ProductVersion -ne '0.3.1 BETA R4') { throw "Wrong R4 version: $($x.path)" }
            if ($info.InternalName -ne $x.internal -or $info.OriginalFilename -ne $x.internal -or $info.FileDescription -ne $x.description) { throw "Wrong binary identity: $($x.path)" }
          }
          $mt=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter mt.exe -File -Recurse |
           Where-Object { $_.FullName -like '*\x64\*' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mt) { throw 'mt.exe not found.' }
          & $mt.FullName "-inputresource:$app;#1" '-out:evidence/DPopCleaner.manifest.xml'
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract app manifest.' }
          & $mt.FullName "-inputresource:$updater;#1" '-out:evidence/DPopUpdater.manifest.xml'
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract updater manifest.' }
          if ((Get-Content -Raw evidence/DPopCleaner.manifest.xml) -notmatch 'requireAdministrator') { throw 'App must require admin.' }
          if ((Get-Content -Raw evidence/DPopUpdater.manifest.xml) -notmatch 'asInvoker') { throw 'Updater must be asInvoker.' }

      - name: Stage verified payload
        shell: pwsh
        run: |
          ./scripts/Stage-R3Payload.ps1 `
            -ApplicationExe r4-build/bin/Release/DPopCleaner.exe `
            -UpdaterExe r4-build/bin/Release/DPopUpdater.exe `
            -ZapretArchive inputs/zapret-1.10.1.zip `
            -ZapretLicense inputs/zapret-LICENSE.txt `
            -Destination "$PWD/r4-payload" `
            -InventoryPath "$PWD/evidence/payload-inventory.json"

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $iscc=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe') |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --no-progress -y }

      - name: Build R4 installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $iscc=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe') |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found.' }
          & $iscc "/DSourceDir=$PWD\r4-payload" "/DZapretDir=$PWD\r4-payload\zapret" "/DIconFile=$PWD\dpopcleaner.ico" "/O$PWD\artifacts" r4-overrides/DPopCleaner_0.3.1_R4.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }
          if (-not (Test-Path "artifacts/$env:R4_ASSET")) { throw 'R4 installer not produced.' }

      - name: Optionally sign R4 installer
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          if ('${{ steps.sign-apps.outputs.signed }}' -ne 'true') { exit 0 }
          $certificate=Join-Path $env:RUNNER_TEMP 'dpop-r4-signing.pfx'
          $signtool=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -File -Recurse |
            Where-Object { $_.FullName -like '*\x64\*' } | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f $certificate /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "artifacts/$env:R4_ASSET"
          if ($LASTEXITCODE -ne 0) { throw 'Installer signing failed.' }

      - name: Run Microsoft Defender scans
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $platform=Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1
          $mp=if($platform){Join-Path $platform.FullName 'MpCmdRun.exe'}else{"$env:ProgramFiles\Windows Defender\MpCmdRun.exe"}
          if(-not(Test-Path $mp)){throw 'MpCmdRun.exe not found.'}
          $log=[Collections.Generic.List[string]]::new()
          $pref=Get-MpPreference
          $originalExclusions=@($pref.ExclusionPath|Where-Object{-not[string]::IsNullOrWhiteSpace($_)})
          $archiveDisabled=[bool]$pref.DisableArchiveScanning
          $scanRoot=Join-Path $env:RUNNER_TEMP ("dpop-r4-defender-"+[guid]::NewGuid().ToString('N'))
          try{
            if($originalExclusions.Count -gt 0){Remove-MpPreference -ExclusionPath $originalExclusions}
            Set-MpPreference -DisableArchiveScanning $false
            $remainingExclusions=@((Get-MpPreference).ExclusionPath|Where-Object{-not[string]::IsNullOrWhiteSpace($_)})
            if($remainingExclusions.Count -gt 0){throw "Defender exclusions remain active: $($remainingExclusions -join ', ')"}
            $sig=& $mp -SignatureUpdate 2>&1; foreach($line in $sig){$log.Add([string]$line)}
            if($LASTEXITCODE -ne 0){throw "Defender signature update failed: $LASTEXITCODE"}
            New-Item -ItemType Directory -Path $scanRoot | Out-Null
            Copy-Item r4-payload (Join-Path $scanRoot payload) -Recurse
            Copy-Item "artifacts/$env:R4_ASSET" (Join-Path $scanRoot $env:R4_ASSET)
            foreach($target in @((Join-Path $scanRoot payload),(Join-Path $scanRoot $env:R4_ASSET))){
              $out=& $mp -Scan -ScanType 3 -File $target 2>&1; $code=$LASTEXITCODE
              foreach($line in $out){$log.Add([string]$line)}
              $txt=$out -join "`n"
              if($txt -match 'was skipped'){throw "Defender skipped $target"}
              if($txt -notmatch 'found no threats'){throw "Defender did not confirm clean: $target"}
              if($code -ne 0){throw "Defender scan failed/detected threat: $target ($code)"}
            }
          }finally{
            Set-MpPreference -DisableArchiveScanning $archiveDisabled -ErrorAction SilentlyContinue
            if($originalExclusions.Count -gt 0){Add-MpPreference -ExclusionPath $originalExclusions -ErrorAction SilentlyContinue}
            if(Test-Path $scanRoot){Remove-Item $scanRoot -Recurse -Force}
            $log|Set-Content evidence/defender-scan.txt -Encoding utf8
          }

      - name: Capture R4 screenshot and verify close
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $started=Get-Date
          $capture=./scripts/Capture-AppScreenshot.ps1 -ExecutablePath r4-build/bin/Release/DPopCleaner.exe -OutputPath evidence/dpopcleaner-0.3.1-r4.png
          if(-not $capture.graceful_close){throw 'Graceful close not proven.'}
          $capture|ConvertTo-Json|Set-Content evidence/screenshot-report.json -Encoding utf8
          $unexpected=@(Get-Process DPopCleaner,DPopUpdater,DPopCleaner_Setup_0.3.1_BETA_R4 -ErrorAction SilentlyContinue|Where-Object{try{$_.StartTime -ge $started}catch{$false}})
          if($unexpected.Count -gt 0){throw "Close test left/relaunched: $($unexpected.Name -join ', ')"}
          'PASS'|Set-Content evidence/close-test.txt

      - name: Generate R4 manifest and evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=(Resolve-Path "artifacts/$env:R4_ASSET").Path
          $hash=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $installer).Length
          $signed=(Get-AuthenticodeSignature $installer).Status -eq 'Valid'
          [pscustomobject][ordered]@{
            product='DPopCleaner';channel='beta';version='0.3.1';version_code=3014;revision=4;mandatory=$false
            download_url="https://github.com/${{ github.repository }}/releases/download/$env:R4_TAG/$env:R4_ASSET"
            sha256=$hash;size=[int64]$size;signed=[bool]$signed;available=$true
            notes_url='https://elesnichenko1-droid.github.io/dpopcleaner-site/';install_args='/SILENT /NORESTART'
          }|ConvertTo-Json|Set-Content evidence/release-manifest.json -Encoding utf8
          Compress-Archive -Path evidence/* -DestinationPath artifacts/DPopCleaner_0.3.1_R4_build_evidence.zip

      - name: Upload verified R4 build
        uses: actions/upload-artifact@v4
        with:
          name: dpopcleaner-0.3.1-r4-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/DPopCleaner_Setup_0.3.1_BETA_R4.exe
            artifacts/DPopCleaner_0.3.1_R4_build_evidence.zip
            r4-build/bin/Release/DPopCleaner.exe
            r4-build/bin/Release/DPopUpdater.exe
            evidence/**
            r4-overrides/**

  release-and-site:
    needs: build-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download verified R4 artifact
        uses: actions/download-artifact@v5
        with:
          name: dpopcleaner-0.3.1-r4-${{ github.run_id }}
          path: release-bundle

      - name: Publish immutable R4 prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin main
          $remoteMain=git rev-parse origin/main
          if($remoteMain -ne $env:GITHUB_SHA){throw "Main advanced to $remoteMain; refusing mismatched R4 publish."}
          $installer="release-bundle/artifacts/$env:R4_ASSET"
          $evidence='release-bundle/artifacts/DPopCleaner_0.3.1_R4_build_evidence.zip'
          gh release view $env:R4_TAG --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          if($releaseExists){
            git fetch --force origin "refs/tags/$env:R4_TAG:refs/tags/$env:R4_TAG"
            $tagCommit=git rev-list -n 1 $env:R4_TAG
            if($tagCommit -ne $env:GITHUB_SHA){throw "Immutable R4 tag targets $tagCommit, expected $env:GITHUB_SHA."}
            New-Item -ItemType Directory existing-release -Force|Out-Null
            gh release download $env:R4_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:R4_ASSET --dir existing-release
            if((Get-FileHash $installer -Algorithm SHA256).Hash -ne (Get-FileHash "existing-release/$env:R4_ASSET" -Algorithm SHA256).Hash){throw 'Existing R4 asset differs.'}
          }else{
            gh release create $env:R4_TAG $installer $evidence --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease `
              --title 'DPopCleaner 0.3.1 BETA R4 — restored 0.2.14 interface' `
              --notes 'R4 keeps the verified R3 functional core and restores the compact 0.2.14-inspired interface. Verified Zapret 1.10.1 remains bundled.'
          }

      - name: Verify fresh public R4 download
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:R4_TAG/$env:R4_ASSET" -OutFile fresh-r4.exe
          $m=Get-Content -Raw release-bundle/evidence/release-manifest.json|ConvertFrom-Json
          if((Get-Item fresh-r4.exe).Length -ne [int64]$m.size){throw 'Fresh R4 size mismatch.'}
          if((Get-FileHash fresh-r4.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $m.sha256){throw 'Fresh R4 SHA-256 mismatch.'}

      - name: Prepare R4 source snapshot and clean website
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory r4 -Force|Out-Null
          Copy-Item release-bundle/r4-overrides/MainWindow.cpp r4/MainWindow.cpp -Force
          Copy-Item release-bundle/r4-overrides/Version.h r4/Version.h -Force
          Copy-Item release-bundle/r4-overrides/version.rc.in r4/version.rc.in -Force
          Copy-Item release-bundle/r4-overrides/DPopCleaner_0.3.1_R4.iss r4/DPopCleaner_0.3.1_R4.iss -Force
          Copy-Item release-bundle/r4-overrides/README.md r4/README.md -Force

          New-Item -ItemType Directory assets -Force|Out-Null
          Copy-Item release-bundle/evidence/dpopcleaner-0.3.1-r4.png assets/dpopcleaner-0.3.1-r4.png -Force
          Copy-Item release-bundle/evidence/release-manifest.json update/beta.json -Force
          [pscustomobject][ordered]@{product='DPopCleaner';version='0.3.1';version_code=3014;revision=4;channel='beta';platform='windows';architecture='x86-64';manifest='./update/beta.json'}|
            ConvertTo-Json|Set-Content version.json -Encoding utf8

          [IO.File]::WriteAllBytes('release-manifest.js',[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('script.js',[Convert]::FromBase64String(''))

          $html=Get-Content -Raw index.html
          $html=$html.Replace('0.3.1 BETA R3','0.3.1 BETA R4').Replace('0.3.1 R3','0.3.1 R4')
          $html=$html.Replace('dpopcleaner-0.3.1-r3.png','dpopcleaner-0.3.1-r4.png')
          $html=$html.Replace('https://github.com/elesnichenko1-droid/dpopcleaner-site/releases/download/v0.2.14-clean-r1/DPopCleaner_Setup_0.2.14_BETA_CLEAN_R1.exe',
                              'https://github.com/elesnichenko1-droid/dpopcleaner-site/releases/download/v0.3.1-beta-r4/DPopCleaner_Setup_0.3.1_BETA_R4.exe')
          $html=$html.Replace('0.2.14 CLEAN R1','0.3.1 BETA R4')
          $m=Get-Content -Raw update/beta.json|ConvertFrom-Json
          $html=$html.Replace('7beb2713a2207110d076cc06ed323364e4bf5654bef4f4615e16a6d09b4d4ff5',[string]$m.sha256)
          $html=$html.Replace('dac34a1f1697dbc9f7f5a953ade9e1e4f09b39a04d66fb18e404ba511543900e',[string]$m.sha256)
          $html=$html.Replace('DPopCleaner 0.3.1 BETA R4 проходит сборку и проверки. Пока доступен последний проверенный установщик 0.3.1 BETA R4.',
                              'DPopCleaner 0.3.1 BETA R4 опубликован, проверен и готов к загрузке.')
          Set-Content index.html $html -Encoding utf8

          foreach($p in @('index.html','release-manifest.js','script.js')){
            $text=Get-Content -Raw $p
            if($text -match 'v0\.2\.14-clean-r1|BETA R3|beta-r3|CLEAN R1'){throw "Stale release reference remains in $p"}
          }
          node -e "const api=require('./release-manifest.js');const m=require('./update/beta.json');if(!api.isUsableR4Manifest(m))throw new Error('R4 manifest rejected');if(api.resolveDownloadManifest(null)!==null)throw new Error('stale fallback enabled');"

      - name: Stage Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/update _site/assets
          cp .nojekyll dpopcleaner-icon.png index.html release-manifest.js script.js styles.css version.json _site/
          cp update/beta.json _site/update/beta.json
          if [ -f update/stable.json ]; then cp update/stable.json _site/update/stable.json; fi
          cp assets/dpopcleaner-0.3.1-r4.png _site/assets/dpopcleaner-0.3.1-r4.png
          grep -q '0.3.1 BETA R4' _site/index.html
          ! grep -R -E 'v0\.2\.14-clean-r1|BETA R3|beta-r3|CLEAN R1' _site/index.html _site/release-manifest.js _site/script.js

      - name: Commit verified R4 source snapshot and site
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          $remoteMain=git rev-parse origin/main
          if($remoteMain -ne $env:GITHUB_SHA){throw "Main advanced to $remoteMain; refusing R4 metadata push."}
          git add r4 index.html release-manifest.js script.js update/beta.json version.json assets/dpopcleaner-0.3.1-r4.png
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){
            git commit -m 'Publish DPopCleaner 0.3.1 BETA R4 UI and site'
            git push origin HEAD:main
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy verified R4 website
        id: deployment
        uses: actions/deploy-pages@v4
