name: DPopCleaner 0.4.17 SimpleUpdate

on:
  push:
    branches:
      - fix/restore-0.4.17-simpleupdate
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  simpleupdate:
    runs-on: windows-2022
    env:
      DPOP_BRIDGE_DIAGNOSTICS: '1'
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify original 0.4.17 core identity
        shell: pwsh
        run: |
          $core = 'downloads/DPopCleaner_0.2.14_BETA.exe'
          if (-not (Test-Path -LiteralPath $core -PathType Leaf)) { throw 'Original core missing.' }
          if ((Get-Item -LiteralPath $core).Length -ne 389632) { throw 'Original core size changed.' }
          $blob = (& git hash-object -- $core).Trim()
          if ($blob -ne 'efd0eff1f4962319282363fa85595c25e0cebe11') { throw "Original core blob changed: $blob" }

      - name: Run SimpleUpdate RED-GREEN contracts
        shell: pwsh
        run: |
          dotnet test v0417/tests/SimpleUpdate.Tests/SimpleUpdate.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run fast-close bridge smoke
        shell: pwsh
        run: ./tools/dpop0417_close_smoke.ps1

      - name: Run authentic SimpleUpdate launcher and Settings bridge smoke
        shell: pwsh
        run: ./tools/dpop0417_simpleupdate_smoke.ps1

      - name: Run rev.15 language-restart bridge and RAM tray smoke
        shell: pwsh
        run: ./tools/dpop0417_rev15_restart_recovery_smoke.ps1

      - name: Run rev.16 single tray identity smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'dpop0417-rev16-tray-stage'
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Copy-Item 'v0417/src/SimpleUpdate/bin/Release/net48/SimpleUpdate.exe' (Join-Path $root 'DPopCleaner.exe') -Force
          Copy-Item 'v0417/src/SimpleUpdate/bin/Release/net48/SimpleUpdate.exe' (Join-Path $root 'SimpleUpdate.exe') -Force
          Copy-Item 'downloads/DPopCleaner_0.2.14_BETA.exe' (Join-Path $root 'DPopCleaner.Core.exe') -Force
          ./tools/dpop0417_rev16_single_tray_smoke.ps1 `
            -RootPath $root `
            -OutputDir '_release/0.4.17/evidence/rev16-tray-stage'

      - name: Dump bridge diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $path = Join-Path ([IO.Path]::GetTempPath()) 'DPopCleaner-bridge-diagnostics.log'
          if (Test-Path -LiteralPath $path -PathType Leaf) {
            Write-Host '===== DPOP_BRIDGE_DIAGNOSTICS ====='
            Get-Content -Raw -LiteralPath $path | Write-Host
          } else {
            Write-Host "Bridge diagnostics file was not created: $path"
          }

      - name: Probe original DPopCleaner UI controls
        shell: pwsh
        run: ./tools/dpop0417_ui_probe.ps1
