name: Build DPopCleaner 0.2.15 BETA

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-release:
    runs-on: windows-2022
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B out/build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build out/build --config Release --parallel

      - name: Locate binaries
        id: bins
        shell: pwsh
        run: |
          $cleaner = Get-ChildItem -Recurse -Filter DPopCleaner.exe out/build | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          $updater = Get-ChildItem -Recurse -Filter DPopUpdater.exe out/build | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $cleaner -or -not $updater) { throw "Built EXE files were not found" }
          New-Item -ItemType Directory -Force -Path release/stage | Out-Null
          Copy-Item $cleaner.FullName release/stage/DPopCleaner.exe
          Copy-Item $updater.FullName release/stage/DPopUpdater.exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "/DSourceDir=$((Resolve-Path 'release/stage').Path)" "/DIconFile=$((Resolve-Path 'resources/dpopcleaner.ico').Path)" release/DPopCleaner.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare update manifest
        shell: pwsh
        run: |
          $installer = (Resolve-Path 'release/output/DPopCleaner_Setup_0.2.15_BETA.exe').Path
          ./scripts/update-manifest.ps1 -Installer $installer -Repository "${{ github.repository }}"

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.15-beta"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "DPopCleaner 0.2.15 BETA" --notes "Первый релиз новой базы с проверкой обновлений через сайт. Установщик пока не имеет Authenticode-подписи, поэтому автоматический тихий запуск обновления отключён." --prerelease
          }
          gh release upload $tag release/output/DPopCleaner_Setup_0.2.15_BETA.exe --clobber
          gh release upload $tag release/stage/DPopCleaner.exe --clobber
          gh release upload $tag release/stage/DPopUpdater.exe --clobber

      - name: Publish beta.json to website repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/beta.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update DPopCleaner beta manifest to 0.2.15"
            git push
          } else {
            Write-Host "Manifest already up to date"
          }


      - name: Stage updated website
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _site/update | Out-Null
          Copy-Item index.html,styles.css,script.js,dpopcleaner-icon.png,version.json,.nojekyll _site/
          Copy-Item update/beta.json,update/stable.json _site/update/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload updated website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy updated website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPopCleaner-0.2.15-BETA
          path: |
            release/output/DPopCleaner_Setup_0.2.15_BETA.exe
            release/stage/DPopCleaner.exe
            release/stage/DPopUpdater.exe
            update/beta.json
