name: Deploy DPopCleaner website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage public website
        run: |
          mkdir -p _site/update _site/downloads
          cp index.html styles.css script.js dpopcleaner-icon.png version.json .nojekyll _site/
          cp update/beta.json update/stable.json _site/update/
          if [ -f downloads/DPopCleaner_0.2.14_BETA.exe ]; then
            cp downloads/DPopCleaner_0.2.14_BETA.exe _site/downloads/
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
