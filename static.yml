name: Deploy DPopCleaner website

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "dpopcleaner-icon.png"
      - "version.json"
      - "update/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stage public website only
        run: |
          mkdir -p _site/update
          cp index.html styles.css script.js dpopcleaner-icon.png version.json .nojekyll _site/
          cp update/beta.json update/stable.json _site/update/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
